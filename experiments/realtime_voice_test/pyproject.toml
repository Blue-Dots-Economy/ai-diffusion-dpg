[project]
name = "realtime-voice-test"
version = "0.1.0"
description = "Vobiz ↔ gpt-realtime-mini bridge for voice-model latency benchmarking."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.7",
    "pipecat-ai[websocket,silero,openai]>=0.0.108,<0.1",
    "pipecat-vobiz>=0.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
