sonar.organization=blue-dots-economy
sonar.projectKey=Blue-Dots-Economy_ai-diffusion-dpg
sonar.projectName=ai-diffusion-dpg

# One entry per uv package. Most use a src/ layout; dev-kit and
# reach_layer/base are flat, so their package directory is named directly.
sonar.sources=\
  action_gateway/src,\
  agent_core/src,\
  knowledge_engine/src,\
  memory_layer/src,\
  observability_layer/src,\
  trust_layer/src,\
  dev-kit/dev_kit,\
  reach_layer/base/schema,\
  reach_layer/bridge/src,\
  reach_layer/cli/src,\
  reach_layer/mcp/src,\
  reach_layer/voice/src,\
  reach_layer/web/src

sonar.tests=\
  action_gateway/tests,\
  agent_core/tests,\
  knowledge_engine/tests,\
  memory_layer/tests,\
  observability_layer/tests,\
  trust_layer/tests,\
  dev-kit/tests,\
  reach_layer/base/tests,\
  reach_layer/bridge/tests,\
  reach_layer/cli/tests,\
  reach_layer/mcp/tests,\
  reach_layer/voice/tests,\
  reach_layer/web/tests

sonar.test.inclusions=**/tests/**/test_*.py,**/tests/**/*_test.py

# .venv is checked out in developer working trees and must never be analysed;
# it is other people's code and would swamp every metric.
sonar.exclusions=**/.venv/**,**/__pycache__/**,**/tests/**,**/*.egg-info/**

sonar.coverage.exclusions=**/tests/**,**/conftest.py,**/__init__.py

# Written by each CI matrix leg as <package>/coverage.xml and restored to these
# paths by the sonar job before the scan runs.
sonar.python.coverage.reportPaths=\
  action_gateway/coverage.xml,\
  agent_core/coverage.xml,\
  knowledge_engine/coverage.xml,\
  memory_layer/coverage.xml,\
  observability_layer/coverage.xml,\
  trust_layer/coverage.xml,\
  dev-kit/coverage.xml,\
  reach_layer/base/coverage.xml,\
  reach_layer/bridge/coverage.xml,\
  reach_layer/cli/coverage.xml,\
  reach_layer/mcp/coverage.xml,\
  reach_layer/voice/coverage.xml,\
  reach_layer/web/coverage.xml

# Matches the CI matrix; eleven packages declare >=3.11 but dev-kit and
# reach_layer/bridge declare >=3.13.
sonar.python.version=3.13
sonar.sourceEncoding=UTF-8
