# Config-agnostic: dpgConfig and domainConfig injected at deploy time via --set-file
configFolder: /app/config
replicaCount: 1

image:
  # Published by .github/workflows/build-images.yaml; same default tag as
  # automation/docker/docker-compose.dev.yml (DPG_IMAGE_TAG).
  repository: ghcr.io/blue-dots-economy/ai-diffusion-dpg/agent-core
  tag: "sha-646216d"
  pullPolicy: IfNotPresent

service:
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

healthCheck:
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20

# Health URLs that must answer before Agent Core starts (init container).
# Set to [] to disable.
waitFor:
  - http://action-gateway:9999/health
waitImage: busybox:1.36

# LLM provider keys — set at deploy time with --set, never commit values.
# Only the key(s) for the configured provider(s) are needed.
anthropicApiKey: ""
openaiApiKey: ""
googleApiKey: ""
geminiApiKey: ""
ollamaApiKey: ""
ollamaEndpoint: ""

# Python logging + uvicorn access log level (DEBUG for chat_provider tracing).
logLevel: INFO

# Injected at deploy time — do not set here
dpgConfig: ""
domainConfig: ""

# docker-compose hostnames used in the DPG/domain YAML -> Kubernetes Service
# names (the dev-kit installs each chart with release name = chart name, all in
# one namespace). Applied to both rendered ConfigMaps. Use FQDNs such as
# memory-layer.<ns>.svc.cluster.local if releases live in different namespaces.
serviceHosts:
  agent_core: agent-core
  knowledge_engine: knowledge-engine
  memory_layer: memory-layer
  trust_layer: trust-layer
  observability_layer: observability-layer
  action_gateway: action-gateway
  otelcol: otel-collector
