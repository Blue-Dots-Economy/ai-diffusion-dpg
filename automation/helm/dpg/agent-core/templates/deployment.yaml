apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      # Roll pods when rendered config changes; services read it only at startup.
      annotations:
        checksum/configmap-dpg: {{ include (print $.Template.BasePath "/configmap-dpg.yaml") . | sha256sum }}
        checksum/configmap-domain: {{ include (print $.Template.BasePath "/configmap-domain.yaml") . | sha256sum }}
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- with .Values.waitFor }}
      # docker-compose `depends_on: service_healthy` equivalent: Agent Core
      # fetches the tool list from Action Gateway at startup and exits if a
      # configured tool is not registered yet.
      initContainers:
        - name: wait-for-dependencies
          image: {{ $.Values.waitImage | quote }}
          command:
            - sh
            - -c
            - |
              {{- range . }}
              until wget -q -T 3 -O /dev/null {{ . }}; do echo "waiting for {{ . }}"; sleep 2; done
              {{- end }}
      {{- end }}
      containers:
        - name: agent-core
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            - name: CONFIG_FOLDER
              value: {{ .Values.configFolder | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.ollamaEndpoint }}
            - name: OLLAMA_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: dpg-config
              mountPath: /app/config/dpg.yaml
              subPath: dpg.yaml
            - name: domain-config
              mountPath: /app/config/agent_core.yaml
              subPath: agent_core.yaml
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.healthCheck.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.healthCheck.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.liveness.periodSeconds }}
      volumes:
        - name: dpg-config
          configMap:
            name: {{ .Release.Name }}-dpg-config
        - name: domain-config
          configMap:
            name: {{ .Release.Name }}-domain-config
