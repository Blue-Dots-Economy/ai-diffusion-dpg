# LLM provider keys — pass at install/upgrade time, never store them in
# values.yaml or any committed file. Set the key(s) for the provider(s) named
# in agent_core.yaml (agent.provider and any helper provider); unset keys are
# omitted, matching docker-compose where every key is optional.
#
# Install:
#   helm install agent-core ./agent-core -n dpg --create-namespace \
#     --set openaiApiKey=$OPENAI_API_KEY
#
# Upgrade: re-pass the same --set flags (or use --reuse-values).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  {{- with .Values.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.googleApiKey }}
  GOOGLE_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.geminiApiKey }}
  GEMINI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.ollamaApiKey }}
  OLLAMA_API_KEY: {{ . | quote }}
  {{- end }}
