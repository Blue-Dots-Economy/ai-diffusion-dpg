# Config-agnostic: dpgConfig and domainConfig injected at deploy time via --set-file
configFolder: /app/config
replicaCount: 1

image:
  # Published by .github/workflows/build-images.yaml; same default tag as
  # automation/docker/docker-compose.dev.yml (DPG_IMAGE_TAG).
  repository: ghcr.io/blue-dots-economy/ai-diffusion-dpg/reach-layer-web
  tag: "sha-646216d"
  pullPolicy: IfNotPresent

service:
  port: 8005
  # Set to NodePort to allow the local dev-kit to reach this service from outside the cluster.
  # When type is NodePort, nodePort pins the host port (must be in 30000–32767).
  type: ClusterIP
  nodePort: ""

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

healthCheck:
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20

# Upload chain auth — set at deploy time; never commit real values here.
uploadAuth:
  devkitToReachApiKey: ""
  reachToKeApiKey: ""
  keInternalUrl: "http://knowledge-engine:8001"

# REACH_LAYER_WEB_MODE: full (SPA + chat) or routing_only (health + ingest proxy).
webMode: full

# Injected at deploy time — do not set here
dpgConfig: ""
domainConfig: ""

# docker-compose hostnames used in the DPG/domain YAML -> Kubernetes Service
# names (the dev-kit installs each chart with release name = chart name, all in
# one namespace). Applied to both rendered ConfigMaps. Use FQDNs such as
# memory-layer.<ns>.svc.cluster.local if releases live in different namespaces.
serviceHosts:
  agent_core: agent-core
  knowledge_engine: knowledge-engine
  memory_layer: memory-layer
  trust_layer: trust-layer
  observability_layer: observability-layer
  action_gateway: action-gateway
  otelcol: otel-collector

# Google Sign-On — set at deploy time. When auth.enabled is true in
# reach_layer.yaml, both of these MUST be provided.
auth:
  # Set to true when the domain config has auth.enabled: true.
  # When true, googleClientId and sessionSecretName/Key below are all required.
  enabled: false
  # Public OAuth 2.0 Web client_id from Google Cloud Console.
  googleClientId: ""
  # Kubernetes Secret holding the HMAC secret for session JWTs.
  # Must contain a key named `session-secret`. Create with:
  #   kubectl create secret generic reach-layer-auth \
  #     --from-literal=session-secret=$(openssl rand -hex 32)
  sessionSecretName: ""
  sessionSecretKey: "session-secret"
