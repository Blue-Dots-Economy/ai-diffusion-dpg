apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      # Roll pods when rendered config changes; services read it only at startup.
      annotations:
        checksum/configmap-dpg: {{ include (print $.Template.BasePath "/configmap-dpg.yaml") . | sha256sum }}
        checksum/configmap-domain: {{ include (print $.Template.BasePath "/configmap-domain.yaml") . | sha256sum }}
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: reach-layer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: CONFIG_FOLDER
              value: {{ .Values.configFolder | quote }}
            # full = SPA + chat; routing_only = health + ingest proxy only.
            - name: REACH_LAYER_WEB_MODE
              value: {{ .Values.webMode | quote }}
            {{- if .Values.auth.enabled }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.auth.googleClientId | required "auth.googleClientId is required when auth.enabled is true" | quote }}
            - name: REACH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.sessionSecretName | required "auth.sessionSecretName is required when auth.enabled is true" | quote }}
                  key: {{ .Values.auth.sessionSecretKey | required "auth.sessionSecretKey is required when auth.enabled is true" | quote }}
            {{- end }}
            # Upload chain auth — set at deploy time via uploadAuth values.
            - name: DEVKIT_TO_REACH_API_KEY
              value: {{ .Values.uploadAuth.devkitToReachApiKey | quote }}
            - name: REACH_TO_KE_API_KEY
              value: {{ .Values.uploadAuth.reachToKeApiKey | quote }}
            - name: KE_INTERNAL_URL
              value: {{ .Values.uploadAuth.keInternalUrl | quote }}
          volumeMounts:
            - name: dpg-config
              mountPath: /app/config/dpg.yaml
              subPath: dpg.yaml
            - name: domain-config
              mountPath: /app/config/reach_layer.yaml
              subPath: reach_layer.yaml
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.healthCheck.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.healthCheck.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.liveness.periodSeconds }}
      volumes:
        - name: dpg-config
          configMap:
            name: {{ .Release.Name }}-dpg-config
        - name: domain-config
          configMap:
            name: {{ .Release.Name }}-domain-config
