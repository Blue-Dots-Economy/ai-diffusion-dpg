# Dev-Kit Configuration Agent
configFolder: /app/config
replicaCount: 1

image:
  # Published by .github/workflows/build-images.yaml; same default tag as
  # automation/docker/docker-compose.dev.yml (DPG_IMAGE_TAG).
  repository: ghcr.io/blue-dots-economy/ai-diffusion-dpg/dev-kit
  tag: "sha-646216d"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

healthCheck:
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 20

# Anthropic API key for the Configuration Agent's LLM calls.
# Injected via --set or from a Kubernetes Secret.
anthropicApiKey: ""
