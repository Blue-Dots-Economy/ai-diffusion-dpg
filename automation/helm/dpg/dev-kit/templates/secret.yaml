# LLM provider keys for the Configuration Agent. The dev-kit exits at startup
# unless at least one of ANTHROPIC/OPENAI/GOOGLE_API_KEY is set. Pass at
# install time with --set, never commit values.
{{- if not (or .Values.anthropicApiKey .Values.openaiApiKey .Values.googleApiKey) }}
{{- fail "dev-kit needs at least one of anthropicApiKey, openaiApiKey, googleApiKey (the app exits at startup without one)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  {{- with .Values.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.googleApiKey }}
  GOOGLE_API_KEY: {{ . | quote }}
  {{- end }}
