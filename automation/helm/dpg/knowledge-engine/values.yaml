# Config-agnostic: dpgConfig and domainConfig injected at deploy time via --set-file
configFolder: /app/config
replicaCount: 1

image:
  # Published by .github/workflows/build-images.yaml; same default tag as
  # automation/docker/docker-compose.dev.yml (DPG_IMAGE_TAG).
  repository: ghcr.io/blue-dots-economy/ai-diffusion-dpg/knowledge-engine
  tag: "sha-646216d"
  pullPolicy: IfNotPresent

service:
  port: 8001

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

healthCheck:
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 20

# The image runs as a non-root system user (uid 100 / gid 101 in the current
# GHCR builds). fsGroup makes the PVCs writable on provisioners that create
# root-owned volumes (e.g. EBS). docker-compose uses `user: root` instead.
podSecurityContext:
  fsGroup: 101

storage:
  chromadb:
    size: 5Gi
    storageClass: ""
  kbData:
    size: 10Gi
    storageClass: ""
    mountPath: /data/kb

# Upload chain auth — set at deploy time; never commit real values here.
uploadAuth:
  reachToKeApiKey: ""
  keToDevkitApiKey: ""
  devkitCallbackUrl: ""

# Azure Blob Storage — required only when the domain uses Azure for KB ingestion.
azure:
  storageAccount: ""
  storageKey: ""
  containerName: ""

# Injected at deploy time — do not set here
dpgConfig: ""
domainConfig: ""

# docker-compose hostnames used in the DPG/domain YAML -> Kubernetes Service
# names (the dev-kit installs each chart with release name = chart name, all in
# one namespace). Applied to both rendered ConfigMaps. Use FQDNs such as
# memory-layer.<ns>.svc.cluster.local if releases live in different namespaces.
serviceHosts:
  agent_core: agent-core
  knowledge_engine: knowledge-engine
  memory_layer: memory-layer
  trust_layer: trust-layer
  observability_layer: observability-layer
  action_gateway: action-gateway
  otelcol: otel-collector
