# DPG Agent Core. dpgConfig and domainConfig are injected at deploy time:
#   --set-file dpgConfig=dev-kit/dpg/agent_core.yaml
#   --set-file domainConfig=dev-kit/configs/<domain>/agent_core.yaml
# Template behaviour and every supported key: automation/helm/dpg-common/templates/_deployment.tpl
replicaCount: 1

image:
  # Published by .github/workflows/build-images.yaml. sha-28f0517 is main at
  # #385, the build these charts were verified with; earlier images reject
  # the current dev-kit configs.
  repository: ghcr.io/blue-dots-economy/ai-diffusion-dpg/agent-core
  tag: "sha-28f0517"
  pullPolicy: IfNotPresent

service:
  port: 8000

# The service reads /app/config/dpg.yaml and /app/config/<configFile>.
configFile: agent_core.yaml

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

healthCheck:
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20

# Health URLs that must answer before Agent Core starts (init container):
# Agent Core loads its tool list from Action Gateway at startup and exits if a
# configured tool is not registered yet. Set to [] to disable.
waitFor:
  - http://action-gateway:9999/health
waitImage: busybox:1.36

# LLM provider keys — set at deploy time with --set, never commit values.
# Only the key(s) for the configured provider(s) are needed; empty keys are
# left out of the Secret.
anthropicApiKey: ""
openaiApiKey: ""
googleApiKey: ""
geminiApiKey: ""
ollamaApiKey: ""
ollamaEndpoint: ""

# Python logging + uvicorn access log level (DEBUG for chat_provider tracing).
logLevel: INFO

env:
  - {name: LOG_LEVEL, key: logLevel}
  - {name: OLLAMA_ENDPOINT, key: ollamaEndpoint, ifSet: true}

secretEnvFromValues:
  - {name: ANTHROPIC_API_KEY, key: anthropicApiKey}
  - {name: OPENAI_API_KEY, key: openaiApiKey}
  - {name: GOOGLE_API_KEY, key: googleApiKey}
  - {name: GEMINI_API_KEY, key: geminiApiKey}
  - {name: OLLAMA_API_KEY, key: ollamaApiKey}

# Injected at deploy time — do not set here
dpgConfig: ""
domainConfig: ""
