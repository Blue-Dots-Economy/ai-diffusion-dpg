# DPG Observability Layer. dpgConfig and domainConfig are injected at deploy time:
#   --set-file dpgConfig=dev-kit/dpg/observability_layer.yaml
#   --set-file domainConfig=dev-kit/configs/<domain>/observability_layer.yaml
# Template behaviour and every supported key: automation/helm/dpg-common/templates/_deployment.tpl
replicaCount: 1

image:
  # Published by .github/workflows/build-images.yaml; same default tag as
  # automation/docker/docker-compose.dev.yml (DPG_IMAGE_TAG).
  repository: ghcr.io/blue-dots-economy/ai-diffusion-dpg/observability-layer
  tag: "sha-646216d"
  pullPolicy: IfNotPresent

service:
  port: 8004

# The service reads /app/config/dpg.yaml and /app/config/<configFile>.
configFile: observability_layer.yaml

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

healthCheck:
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20

# Injected at deploy time — do not set here
dpgConfig: ""
domainConfig: ""
