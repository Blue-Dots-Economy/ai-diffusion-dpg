name: secret-scan
# Scans the full git history for committed secrets with gitleaks, and publishes
# the findings to Security > Code scanning.
#
# Blocking: a finding fails the job. The history was clean when this workflow
# was added (241 commits, gitleaks v8.30.1), so there is no backlog to triage
# first; anything it reports is new. A false positive goes in `.gitleaksignore`
# as its fingerprint, which the job prints alongside each finding.
#
# Full history on every run, not just the PR's commits: a secret removed in a
# later commit is still in the history and still has to be rotated. The whole
# repo scans in under 30s, so there is nothing to gain from narrowing it.
#
# The OSS gitleaks image is used rather than gitleaks/gitleaks-action, which
# needs a paid licence for organisation-owned repositories.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, or gitleaks only sees the tip commit.
          fetch-depth: 0
          persist-credentials: false

      # --user runs the container as the runner, so it can write the report
      # into the checkout. The report cannot go to stdout instead: --verbose
      # prints each finding there too, and the two interleave. --redact keeps
      # the secret values out of both the log and the SARIF, which anyone who
      # can read code-scanning alerts can see.
      - name: Run gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --verbose \
            --report-format sarif --report-path /repo/gitleaks.sarif

      # always(), so a failing scan still publishes what it found. Skipped on
      # PRs from forks: their token is read-only and the upload would 403.
      - name: Upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
