name: build-images
# Builds the 12 DPG service images and pushes them to GHCR under
# ghcr.io/blue-dots-economy/ai-diffusion-dpg/<service>.
#
# Two entry points:
#   push to main      — the release path. Only the images whose inputs changed
#                       are rebuilt (see the `prepare` job).
#   workflow_dispatch — manual. Builds ANY ref, including branches cut before
#                       this workflow existed, because the ref is an input that
#                       `prepare` checks out rather than the ref the workflow
#                       itself was read from. Also takes a single-service
#                       filter, which is the fast path while iterating on one
#                       image.
#
# Every image builds from the REPO ROOT as context — the Dockerfiles COPY
# sibling paths (`observability_layer/`, `reach_layer/base/`), so a per-service
# context would not resolve. Only `file:` varies across the matrix.
#
# Third-party images in the compose file (redis, memgraph, grafana, jaeger,
# loki, otelcol, prometheus, ngrok) are pulled upstream and are not built here.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build. Blank = the ref selected above.'
        required: false
        type: string
      service:
        description: 'Single service to build, or "all".'
        required: false
        default: all
        type: choice
        options:
          - all
          - action-gateway
          - agent-core
          - knowledge-engine
          - memory-layer
          - observability-layer
          - trust-layer
          - reach-layer-web
          - reach-layer-voice
          - reach-layer-mcp
          - reach-layer-cli
          - reach-layer-bridge
          - dev-kit

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Resolves three things the build matrix cannot express statically:
  #   1. which ref to build (dispatch input overrides the workflow's own ref);
  #   2. which services changed, so a one-service commit does not rebuild 12;
  #   3. which Dockerfiles actually exist on that ref — reach-layer-bridge is
  #      not on main yet, and a matrix entry for a missing file would fail the
  #      job rather than skip it.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      ref: ${{ steps.resolve.outputs.ref }}
      ref_slug: ${{ steps.resolve.outputs.slug }}
      short_sha: ${{ steps.plan.outputs.short_sha }}
    steps:
      - name: Resolve ref
        id: resolve
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          FALLBACK_REF: ${{ github.ref_name }}
        run: |
          REF="${INPUT_REF:-$FALLBACK_REF}"
          # Docker tags allow [A-Za-z0-9_.-] only, so `feat/x` becomes `feat-x`.
          SLUG="$(printf '%s' "$REF" | tr '/' '-' | tr -cd 'A-Za-z0-9_.-' | cut -c1-120)"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          # Needed so the push path can diff against the previous commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the build matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SERVICE_FILTER: ${{ github.event.inputs.service }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 .github/scripts/plan_image_builds.py

  build:
    needs: prepare
    if: needs.prepare.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      # docker-container driver — the default driver cannot export the
      # type=gha cache used below.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          # GHCR rejects uppercase in a repository path, hence the lowercased org.
          images: ghcr.io/blue-dots-economy/ai-diffusion-dpg/${{ matrix.service.name }}
          # `sha-<short>` is emitted as a raw value rather than `type=sha`,
          # because type=sha reads github.sha — the commit the WORKFLOW was read
          # from — which is not the commit being built when `ref` is supplied.
          # The branch tag is disabled on dispatch for the same reason; the raw
          # slug below carries the real ref instead.
          tags: |
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=${{ needs.prepare.outputs.ref_slug }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          # amd64 only: the deployment VM is amd64, and multi-arch through QEMU
          # costs 3-4x the build time for an arch nothing consumes today.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-service scope, or the 12 images thrash a single cache key.
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
