# dev-kit/configs/kkb/action_gateway.yaml
# KKB domain values for Action Gateway.
# Merged with dev-kit/dpg/action_gateway.yaml by loader.py before deployment.

tools:
  - id: onest_market_lookup
    type: rest_api
    category: read
    description: >
      Search the ONEST job network for live job listings. Returns verified job postings
      from the ONEST network including roles, employers, locations, and salary details.
      Always call with a natural language query_text describing what the user is looking for.
      Add structured filters only when the user has explicitly stated those preferences.
    base_url: "https://onest-lite-bap.dhiway.net/api/v3"
    auth:
      type: api_key
      header: X-API-KEY
      secret_env: ONEST_API_KEY
    timeout_ms: 5000
    endpoints:
      - name: search
        method: POST
        path: /search
        params:
          - name: query_text
            source: agent
            type: string
            required: true
            description: >
              Natural language sentence describing the user's job search in English.
              Always include location and trade. 1-2 sentences max.
              Examples: "electrician jobs in Hubballi with 15000 monthly in-hand",
              "ITI fitter mechanical jobs in Pune immediate joining",
              "helper warehouse jobs in Noida full-time day shift".
          - name: industry
            source: agent
            type: string
            required: false
            description: >
              Broad industry category. Include only if clearly known.
              Examples: Manufacturing, Electrical, Construction, Customer Facing, Logistics.
          - name: age
            source: agent
            type: integer
            required: false
            description: "Candidate age in years. Include only if known from profile."
          - name: languages
            source: agent
            type: array
            required: false
            description: >
              Languages the candidate speaks. Capitalised strings.
              Examples: ["Hindi"], ["Hindi", "Kannada"].
          - name: preferred_work_mode
            source: agent
            type: array
            required: false
            description: >
              Work preference from: on-site-no-shift, on-site-shifts, remote, hybrid.
              Include only if the user has stated a preference.
          - name: monthly_in_hand
            source: agent
            type: integer
            required: false
            description: "Expected monthly in-hand salary in INR. Include only if stated."
          - name: work_hours_per_day
            source: agent
            type: integer
            required: false
            description: "Preferred working hours per day. Include only if stated."
          - name: limit
            source: static
            type: integer
            value: 10
          - name: page
            source: static
            type: integer
            value: 1
    response:
      max_size_chars: 4000

  # Stub profile fetch. The KKB system prompts instruct subagents to call
  # ``get_profile`` when no profile data is in context; previously the LLM
  # would announce the fetch verbally with no tool registered, so the call
  # went nowhere. This hits Memory Layer's GET /profile/{user_id} and
  # returns the raw profile dict so the LLM can summarise.
  #
  # The ``{user_id}`` placeholder in ``path`` is substituted by the rest_api
  # adapter from the caller's session user_id — the LLM does NOT supply it.
  - id: get_profile
    type: rest_api
    category: read
    description: >
      Fetch the caller's saved profile from Memory Layer. Call ONLY after the
      user has explicitly agreed to let you look up their profile. Returns
      the stored fields (trade, location, age, languages, prior outcomes,
      etc.) when the user has been seen before; returns an empty object when
      the user is new or the profile is unreachable. After receiving a
      profile, briefly summarise what you found in one sentence and continue
      with one open-ended question — do NOT immediately make another tool
      call.
    base_url: "http://memory_layer:8002"
    timeout_ms: 3000
    endpoints:
      - name: get_profile
        method: GET
        path: "/profile/{user_id}"
        params: []
    response:
      max_size_chars: 3000

