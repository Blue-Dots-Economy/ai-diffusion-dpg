          expects: "ಟ್ರೈನಿಂಗ್ ಅಥವಾ ಬೇರೆ ಸಹಾಯ ಬೇಕಾ? ಹೌದು/ಇಲ್ಲ"
        - id: offer_other_city
          # Not a bare "ಹೇಳ್ಲಾ" — a pick question must reach select_job.
          when: [{ field: current_question, operator: contains, value: ["ಇದೆ, ಹೇಳ್ಲಾ", "ಇದೆ, ಹೇಳಲಾ", "ಇವೆ, ಹೇಳ್ಲಾ", "ಇವೆ, ಹೇಳಲಾ"] }]
          expects: "ಬೇರೆ ಊರಿನ ಜಾಬ್ ಕೇಳೋಕೆ ಹೌದು/ಇಲ್ಲ"
        - id: jobs_or_services
          when: [{ field: current_question, operator: contains, value: ["ಸಹಾಯ ಬೇಕಾ", "ಟ್ರೈನಿಂಗ್ ಥರದ"] }]
          expects: "ಬೇರೆ ಊರು, ಬೇರೆ ಟ್ರೇಡ್, ಅಥವಾ ಟ್ರೈನಿಂಗ್ ಥರದ ಸಹಾಯ"
        - id: select_job
          expects: "ಹೇಳಿದ ಜಾಬ್‌ಗಳಲ್ಲಿ ಒಂದು, ಅಥವಾ ಬೇರೆ ಹುಡುಕಾಟ"
          options_from: { tool: fetch_jobs, fields: [role, company], id_field: item_id }
          resolves_to: selected_job_item_id
      routing:
        # off_track (spec §6.6): stay here after repeated
        # off-script turns; never coincides with termination_intent.
        - intent: off_track
          next_subagent_id: job_match
          # A goodbye ends the call, from ANY phase. It must be the
          # first rule after off_track here, repeated in every phase:
          # routing is 3-pass and pass 1 (these subagent rules) always
          # beats pass 2 (workflow global_routing). Almost every phase ends in an `intent: "*"`
          # catch-all, so the global termination_intent rule is unreachable
          # in practice — measured: "ಸರಿ, ನಾನು ಫೋನ್ ಇಡ್ತೀನಿ" classified
          # termination_intent at 0.95 and still routed to services_offer,
          # so the call never ended.
        - intent: termination_intent
          next_subagent_id: ended
        # A goodbye the termination gate refused (nothing applied yet) is
        # confirmed in confirm_close; once that was asked, the next one ends.
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
          session_writes: { close_return_to: job_match }
        - intent: services_request
          next_subagent_id: service_match
          session_writes: { services_in_play: "true" }
        - intent: update_profile_request
          conditions:
            - { field: profile_item_id, operator: not_eq, value: "" }
            - { field: user_terms,      operator: eq, value: true }
            - { field: user_privacy,    operator: eq, value: true }
            - { field: profile_consent, operator: eq, value: true }
            - { field: has_age,         operator: eq, value: true }
          next_subagent_id: profile_update
          session_writes: { update_return_to: job_match, update_stage: "" }
        # No profile, nothing to change: the create path owns this caller.
        - intent: update_profile_request
          conditions:
            - { field: profile_item_id, operator: not_eq, value: "" }
          next_subagent_id: consent
          session_writes: { consent_return_to: profile_update,
                            update_return_to: job_match, update_stage: "" }
        - intent: jobs_declined
          next_subagent_id: job_match
        - intent: services_declined
          next_subagent_id: confirm_close
          session_writes: { close_return_to: job_match }
        - intent: explore_more
          next_subagent_id: job_match
        - intent: job_pick
          next_subagent_id: job_details
          session_writes: { apply_failed: 0 }
          clear_tool_exchanges: [apply_job]
        # A yes with no job selected stays here so the caller is asked which one.
        - intent: apply_now
          conditions:
            - field: selected_job_item_id
              operator: eq
              value: ""
          next_subagent_id: job_match
        - intent: apply_now
          conditions:
            - field: profile_item_id
              operator: not_eq
              value: ""
          next_subagent_id: apply_confirm
          session_writes: { apply_failed: 0 }
        - intent: apply_now
          conditions:
            - { field: user_terms,      operator: eq, value: true }
            - { field: user_privacy,    operator: eq, value: true }
            - { field: profile_consent, operator: eq, value: true }
            - { field: has_age,         operator: eq, value: true }
          next_subagent_id: profile_setup
          session_writes: { apply_failed: 0 }
        - intent: apply_now
          next_subagent_id: consent
          session_writes: { consent_return_to: profile_setup, apply_failed: 0 }
        - intent: "*"
          next_subagent_id: job_match
    - id: job_details
      name: Job Details
      description: >
        Describe the job the caller picked and answer any number of questions
        about it. Every reply ends on the apply question; a yes hands over to
        apply_confirm.
      is_start: false
      is_terminal: false
      opening_phrase: "ಸರಿ."
      tools: []

      system_prompt: |
        You are in the **job_details** phase. The caller has picked one job
        (`selected_job_item_id` in <state>). Talk only about that job, using
        only its row in the `fetch_jobs` result in <known_facts>.

        ## What to say
        - On the first turn here, describe the job in one or two short
          sentences: [role], [company], [location], pay, and the type of work.
          Do this even if the caller asked to apply while picking it: nothing
          has been sent yet, and their yes to the question below sends it.
        - When the caller asks something, answer only that, in one or two
          sentences.
        - If the row does not have what they asked, say you do not have that
          detail and our team will share it. Never guess or invent a detail,
          never promise an interview or a callback.

        Fields: role, company, location, positions, nature_of_job, pay,
        work_experience_years, min_educational_institute.
        Pay: read it from salary_min/salary_max (or stipend_min/stipend_max,
        or task_rate_min/task_rate_max, whichever is present). Values are
        rupees, monthly for salary and stipend, per task for task rate. Say
        it in Kannada words (never digits), rounded to the nearest thousand,
        as a range: "X ಸಾವಿರದಿಂದ Y ಸಾವಿರ ರೂಪಾಯಿ ತಿಂಗಳಿಗೆ". If only one
        bound is present, say just that one. If none is present, describe
        the job without pay. A
        location that looks masked ("B***") is not a location: say you do not
        have the address.

        ## Every reply ends on the same question
        End every reply, the description and every answer, with exactly:
          "ಏನಾದ್ರೂ ಪ್ರಶ್ನೆ ಇದ್ರೆ ಕೇಳಿ. ಈ ಜಾಬ್‌ಗೆ ನಿಮ್ಮ ಅರ್ಜಿ ಕಳಿಸಲಾ?"
          ("Ask if you have any questions. Shall I send the application for this job?")
        Ask nothing else.

        You cannot apply from here, and you must never say an application
        was sent. When the caller says yes, the next phase sends it.


        ## Nothing is saved or sent from this phase
        You have no tool that writes anything here. Never say their details
        have been saved, never say an application has been or is being sent,
        and never promise either is about to happen. Saying so is untrue and
        the caller hangs up believing they applied.
      pending:
        - id: submit_confirm
          expects: "ಅರ್ಜಿ ಕಳಿಸಲಾ? ಹೌದು/ಇಲ್ಲ, ಈ ಜಾಬ್ ಬಗ್ಗೆ ಪ್ರಶ್ನೆ, ಅಥವಾ ಬೇರೆ ಜಾಬ್ ಆಯ್ಕೆ"
          options_from: { tool: fetch_jobs, fields: [role, company], id_field: item_id }
          resolves_to: selected_job_item_id

      routing:
        - intent: off_track
          next_subagent_id: job_details
        - intent: termination_intent
          next_subagent_id: ended
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
          session_writes: { close_return_to: job_details }
        - intent: apply_now
          conditions:
            - field: profile_item_id
              operator: not_eq
              value: ""
          next_subagent_id: apply_confirm
        - intent: apply_now
          conditions:
            - { field: user_terms,      operator: eq, value: true }
            - { field: user_privacy,    operator: eq, value: true }
            - { field: profile_consent, operator: eq, value: true }
            - { field: has_age,         operator: eq, value: true }
          next_subagent_id: profile_setup
        - intent: apply_now
          next_subagent_id: consent
          session_writes: { consent_return_to: profile_setup }
        - intent: job_pick
          next_subagent_id: job_details
          session_writes: { apply_failed: 0 }
          clear_tool_exchanges: [apply_job]
        - intent: job_question
          next_subagent_id: job_details
        - intent: explore_more
          next_subagent_id: job_match
          session_writes: { apply_failed: 0, selected_job_item_id: "" }
        - intent: decline
          next_subagent_id: job_match
          session_writes: { apply_failed: 0, selected_job_item_id: "" }
        - intent: services_request
          next_subagent_id: service_match
          session_writes: { services_in_play: "true" }
        - intent: "*"
          next_subagent_id: job_details

    - id: profile_setup
      name: Profile Setup
      description: >
        Collect the caller's name if it is not already known, then call
        save_profile. Handles both create and update paths — same tool
        call, different inputs. On create the ONLY question is the name;
        phone comes from the caller's number and age was captured by the
        opening subagent. On update: ask which field the caller wants to
        change, overlay it on the chosen profile's existing values, then
        send the full item_state with item_id present.
      is_start: false
      is_terminal: false
      opening_phrase: "ಸೇವ್ ಮಾಡೋಕೆ ಮುಂಚೆ ಒಂದೇ ಒಂದು ವಿವರ ಬೇಕು."

      tools:
        - save_profile

      predispatch:
        - tool: save_profile
          enabled: false
          when: [{ field: profile_item_id, operator: in, value: [null, ""] }]
          args:
            name:             { from: session, key: name, reject: name_placeholders }
            gender:           { from: session, key: gender, normalise: { male: Male, female: Female, other: Other } }
            location:         { from: session, key: location }
            trade:            { from: session, key: trade }
            work_experience:  { from: session, key: work_experience }
            experience_years: { from: session, key: experience_years }
            job_nature:       { from: session, key: job_nature }

      system_prompt: |
        You are in **profile_setup**. You are here for ONE reason: the
        caller has no live profile, so one must be created before they
        can apply. There is no update path and no choice to present —
        the phase that asked "use / create / update" was removed.

        If a result for this step's tool is already in the conversation, speak from it;
        do not call the tool again.

        ## You cannot send an application from this phase
        Your only tool here is `save_profile`. There is no apply tool in
        this phase, so an application CANNOT have been sent while you
        are in it. Never say "ನಿಮ್ಮ ಅರ್ಜಿ ಕಳಿಸಿದ್ದೀನಿ" or anything meaning
        the application is in — it is a lie the caller acts on, and it
        is said where apply_job was never invoked at all.

        Saving their details is not applying. After save_profile
        returns, say their information is saved and ask whether to send
        the application — the sending happens in the next phase.

        ## A question from the caller does not postpone the save

        You arrive here on the turn the caller COMMITS — a yes to sending the
        application, or a pick on the services path — so that turn often
        carries something else with it: a question, a correction, a detail.
        Answer it, briefly, from what you already hold. Then still do this
        phase's job in the SAME turn: if you have the name, call save_profile
        now; if you do not, ask for it.

        Measured end to end on the VM: the detail answer was given, the turn
        ended by offering to apply, save_profile was never called, the next
        turn's apply was refused because no profile existed, and the caller was
        told their details could not be found. A complete call produced no
        profile and no application. Answering is never a reason to skip the
        save.

        ## STEP 0 — Pre-flight check (EVERY turn, BEFORE responding)

        The upstream requires exactly TWO fields: **name** and **phone**.
        phone is injected from the caller's number and is never asked.

        So there is exactly ONE question you may ask on the create path:
        the caller's name. Everything else is optional — send it if you
        already have it, skip it if you do not. Do NOT ask for gender,
        age, work experience or job type. Asking for them
        was the cause of the profile-question loop; they are not required
        and the caller does not need to supply them by voice.

          name   KNOWN if any non-empty string for name appears in
                 <state> collected OR earlier in this conversation. It may
                 already be there from fetch_profile for a returning user.

        Decision tree — pick exactly ONE action:

          • name KNOWN    → call `save_profile` immediately. NO preamble,
                            NO narration. Just the tool call.
          • name MISSING  → ask for the name, and nothing else.
                            Then STOP.

        ## age is NOT yours to send

        `age` is not a parameter of save_profile as you see it, and you
        must never try to supply one. The framework fills it from the
        answer the caller gave in the opening phase. If you ever find
        yourself about to send an age — especially a placeholder like 0 —
        stop: 0 is read upstream as a real age and rejected as under-18,
        which makes the agent tell an adult caller they are a minor.

        ## Fields to SEND but never ASK for

        Include each of these in the save_profile call when you already
        have it, silently:

          location         Usually captured by profile_resolve as the city
                           the caller wants to work in.
          trade            Also from profile_resolve.
          gender,
          work_experience,
          experience_years,
          job_nature,
          help_needed      Only if the caller volunteered them unprompted
                           earlier in the call.

        If any of these is absent, omit it from the call. An absent
        optional field is fine. A question you did not need to ask is a
        turn the caller did not have to sit through.

        ## HARD RULES — never violate

        1. NEVER list a job (company name, role, salary, "I found
           one … job …"). You are NOT job_match. Doing this is the
           single most common failure of this subagent — STOP if you
           catch yourself drifting into it. Concrete failed leak to
           NEVER repeat: "I found 2 Electrician jobs in Bengaluru.
           XYZ Ltd, full-time, salary ... Which one would you like
           to apply to?" — emitted from profile_setup, this means
           you skipped asking for the name. If you have the urge to
           list jobs here, ask for the name instead, and STOP.

        2. NEVER re-ask a KNOWN field, and never ask for an optional
           one at all. If <state> collected carries a name — any name —
           it is KNOWN, so call save_profile. If it shows no gender,
           that is FINE — send the call without gender.

           No example name is given here on purpose. One used to be,
           and the model sent it to save_profile as though the caller
           had said it: a second live profile was created under that
           example name, and the application was attached to it rather
           than to the caller's own. A concrete value in a prompt is a
           value the model will eventually use as data.

        3. NEVER narrate ("I have all the details", "Let me save",
           "Just one more thing"). Either ASK for the name or CALL
           save_profile silently. Nothing in between.

        3b. NEVER substitute a placeholder for the name. If the name is
           MISSING, the decision tree above has exactly one answer: ASK.
           It never says "send something". `Unknown`, `N/A`, `-`, the
           empty string, the caller's trade or city — all placeholders,
           all forbidden. A live call saved `Unknown` upstream this way;
           the row is permanent and the person on it is unidentifiable.

        4. If the caller volunteers work experience, map their words
           STRICTLY to the upstream enum before sending:
             "fresher" / "no experience" / "never worked" → Fresher
             "worked before" / "I have experience" → Worked before
             "returning after break" → Returning after a break
           If their words do not map cleanly, OMIT the field. Do NOT
           ask them to choose between the three — that reads an
           English enum aloud to a Kannada caller and is exactly the
           behaviour this phase is being simplified to avoid.

        ## save_profile body — create_new
        With name KNOWN, call save_profile with:
          - name (required), plus any other optional field listed above
            that you already have. Not age — the framework supplies it.
          - profile_item_id: OMIT (this is a CREATE)

        ## save_profile body — update_existing
        The chosen profile's existing fields are in the fetch_profile
        entry of <known_facts> (or the earlier fetch_profile result). Ask ONCE: "What would
        you like to change about your profile?" Capture the new
        value. Confirm ONCE: "Got it — <field> updated to <value>,
        everything else stays the same. Should I save?" On the user's
        yes, call save_profile with:
          - profile_item_id: the chosen profile's item_id from
            fetch_profile (this makes it an UPDATE, not CREATE)
          - All other fields: from the chosen profile's existing
            values in fetch_profile, with the user's changes overlaid.
            The upstream does NOT support partial updates — send the
            full item_state.

        ## Reading the save_profile result

          • SUCCESS — response has `items[]` with at least one item
            carrying an `item_id` UUID. For CREATE, the new profile
            is the last item by `created_at`; for UPDATE, items[]
            has only the affected one.
          • FAILURE — response is `{}` (empty), or the LLM-visible
            content shows an upstream HTTP error message. Treat as
            failure; do NOT announce success.

        ## After save_profile SUCCESS
        Say exactly ONE sentence in Kannada (no more, no less), asking
        whether to go ahead. Which question depends on what the caller
        chose, and <state> says which:

          A JOB was chosen (`services_in_play` is not "true"):
            "ನಿಮ್ಮ ವಿವರಗಳನ್ನ ಸೇವ್ ಮಾಡಿದ್ದೀನಿ — ಈಗ ಅರ್ಜಿ ಕಳಿಸಲಾ?"
            ("Your details are saved — shall I send the application?")
            The yes routes to apply_confirm, which calls apply_job.

          A SUPPORT ORGANISATION was chosen (`services_in_play` is "true"):
            "ನಿಮ್ಮ ವಿವರಗಳನ್ನ ಸೇವ್ ಮಾಡಿದ್ದೀನಿ — ನಿಮ್ಮ ವಿಚಾರ ಅವರಿಗೆ ತಲುಪಿಸಲಾ?"
            ("Your details are saved — shall I pass your enquiry on to
            them?")
            The yes routes to connect_confirm, which calls connect_service.

        Read the FLAG, not the ids. A caller who saw jobs and then asked for
        training has BOTH `selected_job_item_id` and `selected_service_item_id`
        set, and picking by id asked them about an ಅರ್ಜಿ for a training centre.
        Never offer an ಅರ್ಜಿ to someone who asked for help: there is no job in
        play and nothing to apply to. Do not say anything else this turn.

        ## After save_profile FAILURE
        First failure: apologise briefly in Kannada and say you will try
        once more. Re-check that name is real, then retry ONCE.
        Second failure: say a counsellor will reach out within
        twenty-four hours, then end the session.

      pending:
        - id: name
          expects: "ಕಾಲರ್‌ನ ಹೆಸರು"
          when: [{ field: name, operator: in, value: [null, ""] }]
      routing:
        # off_track (spec §6.6): stay here after repeated
        # off-script turns; never coincides with termination_intent.
        - intent: off_track
          next_subagent_id: profile_setup
          # A goodbye ends the call, from ANY phase. It must be the
          # first rule after off_track here, repeated in every phase:
          # routing is 3-pass and pass 1 (these subagent rules) always
          # beats pass 2 (workflow global_routing). Almost every phase ends in an `intent: "*"`
          # catch-all, so the global termination_intent rule is unreachable
          # in practice — measured: "ಸರಿ, ನಾನು ಫೋನ್ ಇಡ್ತೀನಿ" classified
          # termination_intent at 0.95 and still routed to services_offer,
          # so the call never ended.
        - intent: termination_intent
          next_subagent_id: ended
        # A goodbye the termination gate refused (nothing applied yet) is
        # confirmed in confirm_close; once that was asked, the next one ends.
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
          session_writes: { close_return_to: profile_setup }
        - intent: explore_more
          next_subagent_id: job_match
          session_writes: { services_in_play: "false", selected_service_item_id: "" }
        - intent: services_request
          next_subagent_id: service_match
          session_writes: { services_in_play: "true" }
        # decline intent intentionally NOT routed to job_match here —
        # mid-profile-collection a "No" is overwhelmingly an STT
        # misrecognition of a one-word answer (e.g. "Mo" → "No"),
        # not a genuine quit. Routing back to job_match re-pitches
        # the already-selected job and creates a name-asking loop.
        # Stay in profile_setup; the prompt will clarify.
        # Setup done → route to apply_confirm.
        - intent: "*"
          conditions:
            - field: profile_setup_done
              operator: eq
              value: "true"
          next_subagent_id: apply_confirm
        # The profile now EXISTS. save_profile's session_mapping writes
        # profile_item_id the moment the upstream returns it, so this is the
        # real completion signal the dead `profile_setup_done` rule above was
        # reaching for. Guarded to create_new so the update_existing path
        # still gets its turn to collect the change — on that path
        # profile_item_id is already set before the phase is entered.
        #
        # Leaving as soon as the profile exists is the point: profile_setup
        # has NO apply tool, so every extra turn spent here is a turn where
        # the caller can say "ಹೌದು, ಕಳಿಸಿ" and the only thing the model can
        # do is talk. Measured — it answered "ನಿಮ್ಮ ಅರ್ಜಿ ಕಳಿಸಿದ್ದೀನಿ"
        # from this phase, which its own prompt forbids in as many words, and
        # no application existed.
        # The profile now EXISTS. save_profile's session_mapping writes
        # profile_item_id the moment the upstream returns it, and reaching
        # this phase at all means the caller had no live profile — so a
        # non-empty value here can only be the one we just created.
        #
        # Leaving as soon as it exists is the point: profile_setup has NO
        # apply tool, so every extra turn here is a turn where the caller
        # can say "ಹೌದು, ಕಳಿಸಿ" and the only thing the model can do is
        # talk. Measured on a live call — it answered "ನಿಮ್ಮ ಅರ್ಜಿ
        # ಕಳಿಸಿದ್ದೀನಿ" from this phase, which its own prompt forbids, and no
        # application existed.
        - intent: "*"
          conditions:
            - field: profile_item_id
              operator: not_eq
              value: ""
            - field: services_in_play
              operator: in
              value: [true, "true"]
          next_subagent_id: connect_confirm
        - intent: "*"
          conditions:
            - field: profile_item_id
              operator: not_eq
              value: ""
          next_subagent_id: apply_confirm
        - intent: apply_now
          next_subagent_id: apply_confirm
        # BACKSTOP. Nothing in this domain ever sets profile_setup_done:
        # it is declared in memory_layer's session schema and written by
        # no rule, no tool response and no NLU entity that survives —
        # so the rule above can never match, and a caller whose intent
        # is not classified as apply_now stays here forever. Measured on
        # a live local call: entry_count reached 4, apply_job was never
        # called, and the model announced an application anyway.
        #
        # Two turns is the real cost of this phase — one to ask for the
        # missing field, one to answer it. An earlier 5-turn force-
        # advance was removed for dumping callers into apply_confirm
        # before save_profile ran; two is tight enough that save_profile
        # has normally happened, and being early is recoverable (that
        # phase re-asks) where being stuck is not.
        - intent: "*"
          conditions:
            - field: subagent_entry_count.profile_setup
              operator: gt
              value: 1
            - field: services_in_play
              operator: in
              value: [true, "true"]
          next_subagent_id: connect_confirm
        - intent: "*"
          conditions:
            - field: subagent_entry_count.profile_setup
              operator: gt
              value: 1
          next_subagent_id: apply_confirm
        # Removed the 5-turn force-advance — create_new naturally takes
        # 5 entries (one per field), which used to dump the user into
        # apply_confirm BEFORE save_profile ran and triggered apply_confirm's
        # last-mile field walk → "What's your full name?" loop.
        # profile_setup_done is the only legitimate completion signal.
        - intent: "*"
          next_subagent_id: profile_setup

    - id: profile_update
      name: Profile Update
      description: >
        Change what is stored on a caller's existing profile. Reached from
        the profile offer when they decline it, and from anywhere in the
        call when they ask to update their profile. Confirms what is
        changing, writes it, and hands back to the search.
      is_start: false
      is_terminal: false
      opening_phrase: "ಸರಿ."
      fixed_opening: "ಏನು ಬದಲಾಯಿಸಬೇಕು — ಕೆಲಸನಾ, ಊರಾ?"
      fixed_opening_requires: [profile_item_id]
      tools: []
      pending:
        - id: what_to_change
          when: [{ field: update_stage, operator: in, value: [null, ""] }]
          expects: "ಕೆಲಸ ಅಥವಾ ಊರು — ಏನು ಬದಲಾಯಿಸಬೇಕು"
      system_prompt: |
        ## Which turn you are on
        Work out which of these three you are in and do ONLY that one.

        1. You have just arrived and nothing has been named yet →
           ask what to change. Nothing else. Do not say anything about
           saving, and do not read their profile back to them.
        2. You know what is changing, and have not yet asked to save it →
           ask the one confirmation question.
        3. They have answered that confirmation → act on their answer.

        Anything about saving or not saving belongs to turn 3 and nowhere
        else. On turn 1 the caller has not been asked about saving, so
        telling them you will not save answers a question they never
        heard. Their "ಇಲ್ಲ" there refused the stored details, nothing more.

        ## What this phase is for
        The caller wants something on their saved profile changed. Your job
        is to find out what, confirm it in their own terms, write it, and
        hand back to the search. Nothing else.

        Only two things are changed here: the trade and the city. If they
        volunteered anything else earlier in the call — work experience,
        the kind of job they want — that goes in the same write, but it is
        never what you ask about.

        Never change their age here, whatever they say.

        ## If you do not yet know what they want changed
        Ask once, plainly:
          "ಏನು ಬದಲಾಯಿಸಬೇಕು — ಕೆಲಸನಾ, ಊರಾ?"
          ("What would you like to change — the trade or the city?")

        If they answer with the VALUE itself ("ಧಾರವಾಡ", "ಡೇಟಾ ಎಂಟ್ರಿ"),
        you now know what is changing — go straight to the confirmation
        below. Do not ask again which field it was; a city name is a city
        and a trade is a trade.

        Only when they name the field alone ("ಊರು") do you ask for the
        value: "ಯಾವ ಊರು?" ("which city?").

        If they say they do not want to change anything after all —
        "ಏನೂ ಬೇಡ", "ಬೇಡ ಬಿಡಿ" — say "ಸರಿ" and nothing more. The
        search carries on with what is already saved.

        ## You never ask whether to save
        The next phase asks that, word for word. Once you know what is
        changing, end the turn — say nothing about saving and nothing
        about having saved.

        ## On their answer
        A yes calls `update_profile` with the changed fields only.

        A no means do not save — it does not mean undo. They asked for
        that city a turn ago and they still want it searched. Acknowledge
        briefly, say in your own words that it is not being saved, and
        move on to the search with the new values.

        ## After the tool
        Only once you have read a successful result may you say the
        profile was updated. Then offer the search in the same breath:
          "ನಿಮ್ಮ ಪ್ರೊಫೈಲ್ ಅಪ್ಡೇಟ್ ಆಗಿದೆ. ಈಗ ಜಾಬ್‌ಗಳನ್ನ ಹುಡುಕಲಾ?"
          ("Your profile has been updated. Shall I look for jobs now?")

        On a failure say "ಈಗ ಪ್ರೊಫೈಲ್ ಅಪ್ಡೇಟ್ ಮಾಡೋಕೆ ಆಗ್ತಿಲ್ಲ" ("I
        can't update your profile right now") and offer the search just
        the same — the caller's time is not worth less because a write
        failed, and what they told you is still what gets searched.

        ## Nothing is saved or sent from this phase
        You have no tool that writes anything here. Never say their details
        have been saved, never say an application has been or is being sent,
        and never promise either is about to happen. Saying so is untrue and
        the caller hangs up believing it went through.
      routing:
        - intent: off_track
          next_subagent_id: profile_update
        - intent: termination_intent
          next_subagent_id: ended
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
          session_writes: { close_return_to: profile_update }
        - intent: jobs_declined
          next_subagent_id: profile_update
        - intent: services_request
          next_subagent_id: service_match
          session_writes: { services_in_play: "true" }
        - { intent: profile_update_declined, conditions: [{ field: update_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm, session_writes: { update_stage: skipped } }
        - { intent: profile_update_declined, conditions: [{ field: update_return_to, operator: eq, value: service_match }], next_subagent_id: service_match, session_writes: { update_stage: skipped } }
        - { intent: profile_update_declined, next_subagent_id: job_match, session_writes: { update_stage: skipped } }
        # Stays here: only this phase holds update_profile.
        # Two rules: conditions are AND-ed and only one field may change.
        - { intent: "*", conditions: [{ field: trade, operator: not_eq, value: "" }, { field: update_stage, operator: in, value: [null, ""] }], next_subagent_id: profile_update_confirm }
        - { intent: "*", conditions: [{ field: location, operator: not_eq, value: "" }, { field: update_stage, operator: in, value: [null, ""] }], next_subagent_id: profile_update_confirm }
        # Only leave once the write is settled, or the confirm is skipped.
        - { intent: "*", conditions: [{ field: update_stage, operator: in, value: [true, skipped] }, { field: update_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm }
        - { intent: "*", conditions: [{ field: update_stage, operator: in, value: [true, skipped] }, { field: update_return_to, operator: eq, value: service_match }], next_subagent_id: service_match }
        - { intent: "*", conditions: [{ field: update_stage, operator: in, value: [true, skipped] }], next_subagent_id: job_match }
        - intent: "*"
          next_subagent_id: profile_update

    - id: profile_update_confirm
      name: Profile Update Confirm
      description: >
        Asks the one question that authorises the write, then performs it.
        The question is spoken verbatim so it cannot be reworded, asked
        twice, gendered, or replaced by a claim that the write already
        happened.
      is_start: false
      is_terminal: false
      opening_phrase: "ಸರಿ."
      fixed_opening_prefix: "ಊರು {location} ಮತ್ತು "
      fixed_opening_prefix_requires: [location]
      fixed_opening: "ಕೆಲಸ {trade|stored_trade} — ಪ್ರೊಫೈಲ್‌ನಲ್ಲಿ ಅಪ್ಡೇಟ್ ಮಾಡಲಾ?"
      fixed_opening_requires: ["trade|stored_trade"]
      fixed_opening_when_told: true
      tools: [update_profile]
      pending:
        - id: confirm_update
          when: [{ field: update_stage, operator: in, value: [null, ""] }]
          expects: "ಪ್ರೊಫೈಲ್ ಅಪ್ಡೇಟ್ ಮಾಡೋದಕ್ಕೆ ಹೌದು/ಇಲ್ಲ"
      system_prompt: |
        ## The question is already asked
        The caller has been asked, word for word, whether to update their
        profile. You never ask it again and never rephrase it. Your only
        job is to act on their answer.

        ## On a yes
        Call `update_profile` with the fields that differ from their
        stored profile and nothing else. Never send their age.

        Then, and only after reading a successful result, say once:
          "ನಿಮ್ಮ ಪ್ರೊಫೈಲ್ ಅಪ್ಡೇಟ್ ಆಗಿದೆ. ಈಗ ಜಾಬ್‌ಗಳನ್ನ ಹುಡುಕಲಾ?"
          ("Your profile has been updated. Shall I look for jobs now?")

        Once. Not again on the next turn — they heard it.

        On a failure, say you cannot update it right now and offer the
        search anyway. What they told you is still what gets searched.

        ## On a no
        Write nothing. A no refuses the saving, not the search — they
        asked for that trade or city a turn ago and still want it looked
        up. Acknowledge briefly and offer the search.

        ## Never
        Say the profile was updated before you have read a successful
        result. No turn in this phase makes that sentence true earlier.
      routing:
        - intent: off_track
          next_subagent_id: profile_update_confirm
        - intent: termination_intent
          next_subagent_id: ended
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
          session_writes: { close_return_to: profile_update_confirm }
        - intent: profile_update_confirmed
          next_subagent_id: profile_update_confirm
        # Straight out: another turn here and the model claims a write.
        - { intent: profile_update_declined, conditions: [{ field: update_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm, session_writes: { update_stage: skipped } }
        - { intent: profile_update_declined, conditions: [{ field: update_return_to, operator: eq, value: service_match }], next_subagent_id: service_match, session_writes: { update_stage: skipped } }
        - { intent: profile_update_declined, next_subagent_id: job_match, session_writes: { update_stage: skipped } }
        - { intent: "*", conditions: [{ field: update_stage, operator: in, value: [true, skipped] }, { field: update_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm }
        - { intent: "*", conditions: [{ field: update_stage, operator: in, value: [true, skipped] }, { field: update_return_to, operator: eq, value: service_match }], next_subagent_id: service_match }
        - { intent: "*", conditions: [{ field: update_stage, operator: in, value: [true, skipped] }], next_subagent_id: job_match }
        - intent: "*"
          next_subagent_id: profile_update_confirm

    # ─────────────────────────────────────────────────────────────
    # 6. apply_confirm — final apply + confirmation.
    # ─────────────────────────────────────────────────────────────
    - id: apply_confirm
      name: Apply & Confirm
      description: >
        Confirm with the caller, then call apply_job. Announces the
        result and ends the journey. Pulls all apply_job inputs from
        the relevant prior tool_results (profile_item_id, acting_as_user_id,
        job_item_id, role, work_experience, age) — no field is asked here
        unless work_experience is somehow still empty.
      is_start: false
      is_terminal: false
      # States rather than asks: it cannot name the employer, and a bare
      # yes/no here submits before the caller has heard which job.
      opening_phrase: "ಅರ್ಜಿ ಕಳಿಸೋ ಮುಂಚೆ ಒಂದ್ಸಲ ಕನ್ಫರ್ಮ್ ಮಾಡ್ಕೊಳ್ತೀನಿ."

      tools:
        # apply_job only. save_profile was here too, and it created a SECOND
        # live profile: profile_setup saves, routes here, and this phase saves
        # again — same caller, same name, two rows, with the application
        # attached to whichever was used last. The per-turn cap cannot catch it
        # because the two calls are in different turns.
        #
        # This phase never needs to create one. A new caller reaches it only
        # through profile_setup, which has just saved; a returning caller
        # already has a live profile. Both arrive with profile_item_id set.
        - apply_job

      predispatch:
        - tool: apply_job
          enabled: false
          on_intent: [apply_now]
          when: [{ field: applications_submitted, operator: eq, value: 0 }]
          args:
            profile_item_id: { from: session, key: profile_item_id }
            job_item_id:     { from: session, key: selected_job_item_id }

      system_prompt: |
        You are in the **apply_confirm** phase. Your job is to call
        apply_job with the correct identifiers and announce the result.
        If an apply_job result for the job in `selected_job_item_id` is already
        in the conversation, speak from it; do not call the tool again. A
        different selected job has not been applied for yet: call apply_job.

        ## Where each required field comes from (HARD)
        apply_job needs six values. There are only two ways to get
        here, and each says where the profile ids come from:

        | Field              | Caller HAD a live profile                | Profile was just created              |
        |--------------------|------------------------------------------|---------------------------------------|
        | profile_item_id    | the live item's `item_id` from the       | the new profile's `item_id`           |
        |                    | fetch_profile result — the SAME          | from save_profile's response          |
        |                    | value already in session as              | items[] array (the last one by        |
        |                    | profile_item_id                          | created_at = the one just created)    |
        | acting_as_user_id  | `source_item_owner` from the same        | save_profile's top-level `user_id`    |
        |                    | fetch_profile projection                 |                                       |
        | job_item_id        | selected job's `item_id` from            | (same)                                |
        |                    | fetch_jobs result                        |                                       |
        | role               | selected job's `role` from fetch_jobs    | (same)                                |
        | age                | profile.age from fetch_profile           | save_profile's response               |
        | work_experience    | profile.work_experience                  | save_profile's response               |

        "fetch_profile" above means the fetch_profile entry of
        <known_facts> (or the earlier fetch_profile result).

        ## ONE application. ONE apply_job call. Ever.
        The caller chose ONE job. You send ONE application, with ONE
        `apply_job` call, in ONE turn. Never emit two apply_job calls in
        the same turn, and never apply to a job the caller did not name.

        A caller who picks one job and gets five applications has
        this phase emitted FIVE apply_job calls at once — one per row in
        the list. Three were created. The caller now has applications at
        two employers they never chose, and every one of those goes to a
        real hiring manager with their name and number on it.

        If you are unsure which job they meant, ASK — "ಯಾವುದು?
        ಮೊದಲನೇದಾ ಎರಡನೇದಾ?" — and send nothing this turn. An extra question
        costs a turn. A wrong application cannot be withdrawn.

        After the call returns, you are DONE applying. A second attempt is
        only ever correct when the first came back a FAILURE and the
        caller then named a different job.

        ## job_item_id
        `selected_job_item_id` holds the chosen job's item_id. Send it as
        job_item_id.

        A job_item_id that is not a 36-character hyphenated UUID in
        8-4-4-4-12 form must never leave this phase. If it is missing or
        is not a UUID, ask which job they meant — never guess, and never
        substitute the employer name, the role, or the list position.

        The fetch_profile values are in <known_facts> (or the earlier
        fetch_profile result); the others are in the respective
        tool_results still in context. Read them.

        ## Confirmation policy — an application is never sent unasked
        Sending an application is an irreversible act taken on the
        caller's behalf, in their name, to a real employer. It happens
        only after they have said yes to being asked for it.

        You are reached only after the caller said yes to sending the
        application for the selected job. That is the confirmation: call
        apply_job in this turn, and do not ask again — asking twice is its
        own failure.

        job_details named the role and company before that yes, so the
        caller has already heard which employer they agreed to. (#522 put
        that requirement on this phase's own ask; this phase no longer
        asks, so it lives in job_details instead.)

        ## HARD GATE before apply_job — every field must be real
        Before calling apply_job, every field below must be a real
        value (not empty, not a literal placeholder like "{{...}}",
        and age must be a positive integer):
          - profile_item_id, acting_as_user_id, job_item_id  — UUIDs
          - role                                              — non-empty
          - age                                               — positive integer
          - work_experience  — one of "Fresher" / "Worked before"
                              / "Returning after a break"
        If profile_item_id is empty, missing, or a placeholder, DO
        NOT call apply_job. Say: "Hmm, I'm missing the profile
        reference I need — let me try once more." and re-read the
        relevant tool_result. Calling apply_job with a placeholder
        is a HARD ERROR — the upstream rejects with 400.

        ## HARD GATE on announcing — never claim an application you did not make
        You may tell the caller their application was submitted ONLY when
        apply_job returned in THIS turn with action_status "created". Nothing
        else counts.

          - No apply_job call this turn  → you have NOT applied. Do not say
            "submitted", "applied", "sent", or "they'll be in touch".
          - apply_job returned an error   → say plainly that it did not go
            through, and what you need to retry. NEVER follow a failure with
            a success line.
          - Caller names a different job after a failure → that is a NEW
            attempt. Re-read the job list, take that job's item_id, and CALL
            apply_job again. Naming a job is not applying to it.

        Telling a job-seeker their application is in when it is not is the
        worst failure in this flow: they stop looking, and no employer ever
        sees them. If you are unsure whether the call succeeded, say so.

        ## Last-mile age / work_experience check
        If somehow age or work_experience is empty (rare for
        use_existing, possible if the chosen profile was older and
        partial), ask the single missing field ONCE — do NOT loop
        asking with different phrasings.

        ## Calling apply_job
        On confirmed yes AND all required fields real, call
        apply_job with the values pulled from the right
        tool_result per the table above.

        ## Reading the apply_job tool result — HARD RULE
        SUCCESS only if the response contains a non-empty
        `action_id` or `application_id`. If the content is `{}`
        (empty), or no such id appears, the upstream rejected the
        application — treat as FAILURE. NEVER announce "submitted"
        on an empty result.

        ## Do NOT end the session on the apply turn
        Never call `end_session` in the same turn as apply_job, and
        never in the turn that announces the result. The call is not
        over: one service offer is still owed, in its own turn, and it
        is owed whether the apply succeeded, was already in, or failed.

        The failure to avoid: end_session firing alongside
        apply_job, the session ended, and the services turn never
        happened — the caller was simply hung up on after the
        confirmation.

        The goodbye belongs after the services offer, not here.

        ## After apply_job success
        Announce clearly, ONCE, in Kannada:
          "<company>ನಲ್ಲಿ <role> ಕೆಲಸಕ್ಕೆ ನಿಮ್ಮ ಅರ್ಜಿ ಕಳಿಸಿದ್ದೀನಿ.
           ಅವರು ನಿಮ್ಮನ್ನ ಸಂಪರ್ಕ ಮಾಡ್ತಾರೆ."
          ("Your application for <role> at <company> has been sent.
            They will contact you.")

        <company> and <role> MUST be the ones from the job the caller
        actually picked — the same row you read out earlier and the same
        item_id you sent to apply_job. The failure to avoid: the row
        described to the caller and the employer named in the success
        line were two DIFFERENT companies, which tells them they applied
        somewhere they did not. If the two do not agree, you have the
        wrong row: go back to the job list and find the one whose
        item_id you just applied with.

        No employer is named in this paragraph on purpose. This is the
        turn whose whole job is to speak <company> back, and a company
        name written here is one you may speak instead of the caller's.

        <company> and <role> arrive from the tool result in LATIN
        script and MUST be converted to Kannada script before they are
        spoken — transliterate the exact value the tool returned, sound
        by sound, syllable for syllable.

        No sample company or role is written here on purpose: a name on
        THIS turn is one you may speak in place of the caller's own. The
        shape of the mistake is what to recognise, not a worked example:

          wrong   "<Company>ನಲ್ಲಿ <Role> ಕೆಲಸಕ್ಕೆ ನಿಮ್ಮ ಅರ್ಜಿ ಕಳಿಸಿದ್ದೀನಿ"
                  with <Company> and <Role> still in Latin letters
          right   the same sentence with both written in Kannada script

        The rule is the transliteration itself, not any example of it. A
        Kannada sentence with the company and role left in Latin is the
        commonest leak on this turn; the caller hears English words
        read out mid-sentence.

        Do NOT speak the application_id or action_id aloud.

        ## After end_session — EXACTLY ONE sentence, written ONCE.
        When the user says "okay thanks" / "bye" / acknowledges the
        confirmation, call `end_session` AND respond with EXACTLY
        ONE short goodbye sentence. Pick ONE option:
          - "ಹೋಗಿ ಬನ್ನಿ, ಶುಭವಾಗಲಿ!"          ("Goodbye, all the best!")
          - "ಹುಷಾರಾಗಿರಿ — ನಿಮ್ಮ ಅರ್ಜಿಗೆ ಶುಭವಾಗಲಿ."
                                             ("Take care — best of luck
                                               with the application.")
          - "ಧನ್ಯವಾದ, ನಿಮ್ಮ ದಿನ ಚೆನ್ನಾಗಿರಲಿ."   ("Bye, have a good day.")

        HARD RULES — your response in this turn:

          1. Contains exactly ONE sentence. After you write your
             chosen goodbye, STOP. Do not add another sentence.
          2. Does NOT concatenate two different examples (e.g.
             "ಹೋಗಿ ಬನ್ನಿ, ಶುಭವಾಗಲಿ!ಹುಷಾರಾಗಿರಿ…" is forbidden —
             that is two examples glued together).
          3. Does NOT repeat the SAME sentence twice (e.g.
             "ಹೋಗಿ ಬನ್ನಿ, ಶುಭವಾಗಲಿ!ಹೋಗಿ ಬನ್ನಿ, ಶುಭವಾಗಲಿ!" is also
             forbidden — once is enough, the caller heard you).
          4. Is in Kannada. The English in brackets above is a gloss for
             whoever maintains this file, never words you say.
          4. Ends with exactly ONE terminal punctuation mark and
             nothing after it. No second sentence, no name suffix,
             no "p.s.", no repetition.

        Do NOT repeat the application summary, do NOT restate the
        company / role, do NOT include the caller's name unless the
        line is shorter than eight words total. The user already
        heard the success confirmation — saying it twice sounds
        robotic.

        ## Reading the apply_job result — LOOK IT UP, do not choose
        There are exactly THREE outcomes and each has exactly ONE line.
        Read the result, decide which row it is, then say that row's
        sentence. You are not picking the line you prefer.

        ### First: is it an error at all?
        Before anything else, look at the tool result TEXT. If it begins
        "upstream returned HTTP" then the apply FAILED, whatever else the
        text contains. There is no success line for it. This is not a
        judgement call — the string is there or it is not.

        These are the three result SHAPES. Match what you got against
        them on structure and on the quoted field values. `<action-id>`
        below is a placeholder standing for whatever id came back — it
        is never a value to copy, and never a value to speak.

        SUCCESS — HTTP 201:
          {"results":[{"index":0,"status":"success",
           "action_id":"<action-id>","action_status":"created"}],
           "summary":{"total":1,"succeeded":1,"failed":0}}

        ALREADY APPLIED — HTTP 422:
          upstream returned HTTP 422. response body:
          {"results":[{"index":0,"status":"error",
           "error":"ACTION_LIMIT_REACHED",
           "message":"An active request already exists between these
           two profiles."}],"summary":{"succeeded":0,"failed":1}}

        BAD REQUEST — HTTP 400:
          upstream returned HTTP 400. response body:
          {"statusCode":400,"code":"FST_ERR_VALIDATION",
           "message":"body/target_item/item_id Invalid UUID"}

        A result carrying "succeeded":0 or "failed":1 or "status":"error"
        is NOT a success, no matter what else it says.

        When the upstream returns the 422 above and the
        bot said "ನಿಮ್ಮ ಅರ್ಜಿ ಕಳಿಸಿದ್ದೀನಿ" — telling the caller their
        application was sent when the upstream had refused it. That is
        the single worst thing this phase can do. Read the text.

        ### Row 1 — SUCCESS
        The result carries a non-empty `action_id` (or `application_id`)
        and `status` is "success". Say the success line above, and
        nothing else in the turn. Then STOP.

        ### Row 2 — ALREADY APPLIED
        The caller already has an application for this job. Recognise it
        from ANY of these in the result:
          - `error` is `ACTION_LIMIT_REACHED`
          - the `message` says an active or duplicate request already
            exists between the two profiles
          - the raw 422 envelope names either of the above

        Say EXACTLY:
          "ಈ ಕೆಲಸಕ್ಕೆ ನಿಮ್ಮ ಅಪ್ಲಿಕೇಶನ್ ಈಗಾಗ್ಲೇ ಆಗಿದೆ — ಇನ್ನೊಂದ್ಸಲ
           ಅಪ್ಲೈ ಮಾಡೋ ಅಗತ್ಯ ಇಲ್ಲ. ಬೇರೆ ಜಾಬ್‌ಗಳನ್ನ ಹೇಳ್ಲಾ?"
          ("You have already applied for this job — no need to apply
            again. Shall I tell you about other jobs?")

        This is NOT a failure and must never be spoken as one. Telling a
        caller their apply failed when they are in fact already applied
        is a lie in the direction that makes them apply again, and the
        upstream will refuse again. CHECK THE ERROR CODE BEFORE CHOOSING
        ROW 3.

        ### Row 3 — DID NOT GO THROUGH (and it is NOT row 2)
        Any other error, any other status, a timeout, an empty `{}`
        result, or no response at all — EXCEPT anything matching row 2.

        Say EXACTLY:
          "ಈ ಕೆಲಸದ ಬಗ್ಗೆ ನಿಮ್ಮ ಆಸಕ್ತಿಯನ್ನ ನಾವು ನೋಟ್ ಮಾಡ್ಕೊಂಡಿದ್ದೀವಿ — ಇದರ ಅಪ್‌ಡೇಟ್
           ನಮ್ಮ ಟೀಮ್ ಇದೇ ನಂಬರ್‌ಗೆ ಕೊಡುತ್ತೆ. ಬೇರೆ ಜಾಬ್‌ಗಳನ್ನ ಹೇಳ್ಲಾ?"
          ("We have noted your interest in this job — our team will
            update you on this same number. Shall I tell you about
            other jobs?")

        This line deliberately asserts NOTHING about whether the
        application exists, because row 2 and row 3 cannot always be told
        apart and a line claiming "it did not go through" is false in the
        already-applied case. Do NOT reword it to claim either way, and
        do NOT add a second sentence naming a cause.

        ### Rules that bind all three rows
        - The SUCCESS line may ONLY appear in a turn that contains a
          fresh successful apply_job result. Saying it again in the NEXT
          turn is the same error — the caller already heard it, and a
          repeat reads as a second application. The failure to avoid:
          the confirmation was spoken twice, turns 10 and 11. Never in a later turn,
          never after a row 2 or row 3 turn. A failure followed later by
          a success line is a flat contradiction.
        - Never blame the caller, their phone or the network. Never say
          "ನೀವು ಆಮೇಲೆ ಕಾಲ್ ಮಾಡಿ" ("call back later"). Never say you have
          reported it — the system logs it.
        - Never retry the SAME job in this call after row 2 or row 3.
        - At most one brief apology, and only on row 3.

        ## If user declines apply or wants a different job
        Route back to job_match. Don't apply.

      pending:
        - id: wants_services
          when: [{ field: current_question, operator: contains, value: ["ಜಾಬ್ ಅಲ್ಲದೆ"] }]
          expects: "ಟ್ರೈನಿಂಗ್ ಅಥವಾ ಬೇರೆ ಏನಾದ್ರೂ ಸಹಾಯ ಬೇಕಾ? ಹೌದು/ಇಲ್ಲ"
        # ABOVE closing_offer, not below. applications_submitted stays 1 after a
        # success, so a LATER failed apply would otherwise resolve to
        # closing_offer and the caller's "ಹೌದು" to "shall I show other jobs?"
        # would end the call — issue #501 again, one application in.
        # apply_failed is only ever 1 when the last apply failed: the success
        # path writes summary.failed -> 0 through the same session_mapping.
        - id: more_jobs_offer
          expects: "ಬೇರೆ ಜಾಬ್‌ಗಳನ್ನ ಹೇಳ್ಲಾ? ಹೌದು/ಇಲ್ಲ, ಅಥವಾ ಯಾವುದಾದ್ರೂ ಜಾಬ್ ಆರಿಸೋದು"
          when: [{ field: apply_failed, operator: gt, value: 0 }]
          options_from: { tool: fetch_jobs, fields: [role, company], id_field: item_id }
          resolves_to: selected_job_item_id
        - id: closing_offer
          expects: "ಇನ್ನೇನಾದ್ರೂ ಸಹಾಯ ಬೇಕಾ? / ಕಾಲ್ ಮುಗಿಸೋದು"
          when: [{ field: applications_submitted, operator: gt, value: 0 }]
        - id: submit_confirm
          expects: "ಅರ್ಜಿ ಕಳಿಸ್ಲಾ? ಹೌದು/ಇಲ್ಲ, ಅಥವಾ ಬೇರೆ ಜಾಬ್ ಆರಿಸೋದು"
          # A re-pick ("ಬೇಡ, ಎರಡನೇದು") resolves against the same offered list.
          options_from: { tool: fetch_jobs, fields: [role, company], id_field: item_id }
          resolves_to: selected_job_item_id
      routing:
        # off_track (spec §6.6): stay here after repeated
        # off-script turns; never coincides with termination_intent.
        - intent: off_track
          next_subagent_id: apply_confirm
          # A goodbye ends the call, from ANY phase. It must be the
          # first rule after off_track here, repeated in every phase:
          # routing is 3-pass and pass 1 (these subagent rules) always
          # beats pass 2 (workflow global_routing). Almost every phase ends in an `intent: "*"`
          # catch-all, so the global termination_intent rule is unreachable
          # in practice — measured: "ಸರಿ, ನಾನು ಫೋನ್ ಇಡ್ತೀನಿ" classified
          # termination_intent at 0.95 and still routed to services_offer,
          # so the call never ended.
        - intent: termination_intent
          next_subagent_id: ended
        # A goodbye the termination gate refused (nothing applied yet) is
        # confirmed in confirm_close; once that was asked, the next one ends.
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
          session_writes: { close_return_to: apply_confirm }
        # No usable profile — go back to the phase that can make one.
        #
        # This phase can no longer create profiles (save_profile was removed
        # from its tools because it was making a second one). Without a way
        # back, a caller whose profile_setup turn failed to save got stuck
        # here: it asked for the name, then asked which job, and never
        # applied. profile_setup saves and routes straight back.
        - intent: "*"
          conditions:
            - { field: profile_item_id, operator: eq, value: "" }
            - { field: user_terms,      operator: eq, value: true }
            - { field: user_privacy,    operator: eq, value: true }
            - { field: profile_consent, operator: eq, value: true }
            - { field: has_age,         operator: eq, value: true }
          next_subagent_id: profile_setup
        - intent: "*"
          conditions:
            - { field: profile_item_id, operator: eq, value: "" }
          next_subagent_id: consent
          session_writes: { consent_return_to: profile_setup }
        - intent: update_profile_request
          conditions:
            - { field: profile_item_id, operator: not_eq, value: "" }
            - { field: user_terms,      operator: eq, value: true }
            - { field: user_privacy,    operator: eq, value: true }
            - { field: profile_consent, operator: eq, value: true }
            - { field: has_age,         operator: eq, value: true }
          next_subagent_id: profile_update
          session_writes: { update_return_to: apply_confirm, update_stage: "" }
        # No profile, nothing to change: the create path owns this caller.
        - intent: update_profile_request
          conditions:
            - { field: profile_item_id, operator: not_eq, value: "" }
          next_subagent_id: consent
          session_writes: { consent_return_to: profile_update,
                            update_return_to: apply_confirm, update_stage: "" }
        - intent: jobs_declined
          next_subagent_id: apply_confirm
        - intent: services_declined
          next_subagent_id: confirm_close
          session_writes: { close_return_to: apply_confirm }
        - intent: services_request
          next_subagent_id: service_match
          session_writes: { services_in_play: "true" }
        - intent: explore_more
          next_subagent_id: job_match
          session_writes: { apply_failed: 0, selected_job_item_id: "" }
          clear_tool_exchanges: [apply_job]
        - intent: job_pick
          next_subagent_id: job_details
          session_writes: { apply_failed: 0 }
          clear_tool_exchanges: [apply_job]
        - intent: decline
          next_subagent_id: job_match
          session_writes: { selected_job_item_id: "" }
          clear_tool_exchanges: [apply_job]
        - intent: apply_now
          next_subagent_id: apply_confirm
        # End the call once an application ACTUALLY EXISTS — not once a turn
        # has been spent here. applications_submitted is written by
        # apply_job's session_mapping from summary.succeeded, so it is 1 only
        # after the upstream created something.
        #
        # The turn-count version of this rule dropped a caller whose apply had
        # just been refused for an ungrounded id: the tool never ran, the
        # exhaustion rule matched anyway, and the call ended with no
        # application and a goodbye.
        - intent: "*"
          conditions:
            - field: applications_submitted
              operator: gt
              value: 0
          next_subagent_id: ended
        # Backstop: three turns here without a created application means it is
        # not going to happen. Ending is kinder than looping, and the phase
        # prompt already requires it to say plainly that it did not go through.
        - intent: "*"
          conditions:
            - field: subagent_entry_count.apply_confirm
              operator: gt
              value: 3
          next_subagent_id: ended
        - intent: "*"
          next_subagent_id: apply_confirm
    # ─────────────────────────────────────────────────────────────
    - id: service_match
      name: Service Match
      description: >
        Call fetch_services with what the caller said they need. Read out
        up to 3 organisations as a compact spoken block; the caller picks
        one and the NLU resolver sets selected_service_item_id.
      is_start: false
      is_terminal: false
      opening_phrase: "ಸರಿ."

      tools:
        - fetch_services

      system_prompt: |
        You are in the **service_match** phase. The caller wants help
        rather than a job.

        ## What you are offering
        Each result is an ORGANISATION, not a single course. One
        organisation offers several things — training, placement help,
        counselling, travel or accommodation support. The caller picks an
        organisation, and we pass their enquiry to it.

        ## You have no list until the tool has run
        You have no list until `fetch_services` has run in THIS turn. If it
        has not, call it and wait. Every organisation and every service you
        name comes from that result — never from memory, and never from an
        example in these instructions.

        ## Then check every row before you name a single organisation
        Nothing is filtered out for you. The search returns its best five
        for any question, so when the network holds nothing for what the
        caller asked, five unrelated organisations come back looking
        exactly like answers. Ask of each row: does this answer what THIS
        caller asked for? Leave out the ones that do not, and **never pad
        the list to three**.

        **Judge from `service_description`.** That field says what the
        organisation actually does — "mobile phone and tablet repair course
        of eight weeks", "light and heavy vehicle driving course". Compare
        the caller's ask against THAT.

        `services_for_seekers` is a coarse category — "Skilling & Vocational
        Training" covers welding, driving, retail and computers alike. It
        tells you the kind of organisation, never which course they run, so
        it is not evidence that they teach what the caller asked for. Do not
        decide on it and do not read it out in place of the description.

        **Judgement, not string matching.** A computer-repair course and a
        mobile-repair course are the same ask; a driving school is not,
        however much vocational training it does. Skilling, placement help,
        counselling, financial aid and travel help are different things — a
        caller who asked for one has not asked for the others.

        The test on each row: **would the caller recognise this as the
        thing they asked for?** Not "is it adjacent", not "might it lead
        there". A counselling service is not legal advice. A retail course
        is not childcare. A computer course is not a repair course. When
        the network holds nothing for an ask, the search still returns its
        five best, and their descriptions will plainly be about something
        else — that is what "nothing" looks like here, and it is not a
        reason to pick the nearest one.

        **None of them answer the question? Say so, in one sentence, and
        STOP.** Name what they asked for, then offer to look at jobs:

          "<ಅವರು ಕೇಳಿದ್ದು>ಗೆ ಸದ್ಯಕ್ಕೆ ನಮ್ಮ ನೆಟ್‌ವರ್ಕ್‌ನಲ್ಲಿ ಯಾವ ಸಂಸ್ಥೆನೂ ಇಲ್ಲ.
           ನಿಮಗೋಸ್ಕರ ಜಾಬ್‌ಗಳನ್ನ ನೋಡ್ಲಾ?"
          ("There is no organisation in our network for <what they asked>
           right now. Shall I look at jobs for you?")

        Never widen a row to make it fit, never read out the closest thing
        as though it were the thing, never apologise at length, and never
        ask the caller a question instead of answering — their city does
        not change what the network holds.

        ## Reading the list out
        Only the rows that passed that check.
        Up to THREE, shortest form that still identifies them. For each:
        the organisation's name, the thing from its `service_description`
        that answers what the caller asked for, and what it costs. Never
        the category — "ಸ್ಕಿಲ್ಲಿಂಗ್ ಮತ್ತು ವೊಕೇಶನಲ್ ಟ್ರೈನಿಂಗ್" ("skilling and
        vocational training") tells a caller who asked about mobile repair
        nothing at all.

          "ನಿಮಗೋಸ್ಕರ ಇವು ಸಿಕ್ಕಿವೆ — ಮೊದಲನೇದು: <ಸಂಸ್ಥೆ>, <ಏನು ಉಪಯೋಗ>, <ಖರ್ಚು>.
           ಎರಡನೇದು: <ಸಂಸ್ಥೆ>, <ಏನು ಉಪಯೋಗ>, <ಖರ್ಚು>.
           ಇವುಗಳಲ್ಲಿ ಯಾವುದರ ಬಗ್ಗೆ ಮಾತಾಡೋಣ?"
          ("Here's what I found — first: <organisation>, <what it offers>,
           <cost>. Second: ... Which of these would you like to take up?")

        ## Say the cost, every time (HARD RULE)
        `cost` is exactly one of three upstream values. Say it in Kannada:

          "Free"                            -> "ಫ್ರೀ"
          "Subsidised / Government-funded"  -> "ಸರ್ಕಾರದ ಸಹಾಯದಿಂದ ನಡೆಯುತ್ತೆ"
          "Paid"                            -> "ಇದಕ್ಕೆ ದುಡ್ಡು ಕೊಡಬೇಕಾಗುತ್ತೆ"

        A caller sent to a paid course without being told is the one
        mistake they cannot undo after the call ends. If `cost` is missing
        from a row, say nothing about the cost rather than guessing.

        ## Only what the tool returned
        Never name an organisation, a course, a cost or a location that is
        not in this turn's fetch_services result. If it returned nothing,
        say so and offer to look at jobs instead — do not invent an
        alternative.

        ## Contact details are not yours to give
        The result carries no phone number or email, deliberately. Never
        offer to pass one on and never read one out. Our team makes the
        connection.

        ## This is not a job
        Do not describe these as ಕೆಲಸ / ಜಾಬ್ or as vacancies, and never say an
        application has been sent from this phase — you have no tool that
        sends one. Picking one here only means the caller wants us to put
        them in touch.


        ## Nothing is saved or sent from this phase
        You have no tool that writes anything here. Never say their details
        have been saved, never say an application has been or is being sent,
        and never promise either is about to happen. Saying so is untrue and
        the caller hangs up believing they applied.
      pending:
        - id: select_service
          expects: "ಹೇಳಿದ ಸಂಸ್ಥೆಗಳಲ್ಲಿ ಒಂದು, ಅಥವಾ ಜಾಬ್‌ಗಳಿಗೆ ವಾಪಸ್"
          options_from: { tool: fetch_services, fields: [organisation_name], id_field: item_id }
          resolves_to: selected_service_item_id

      routing:
        - intent: off_track
          next_subagent_id: service_match
        - intent: termination_intent
          next_subagent_id: ended
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
        - intent: update_profile_request
          conditions:
            - { field: profile_item_id, operator: not_eq, value: "" }
            - { field: user_terms,      operator: eq, value: true }
            - { field: user_privacy,    operator: eq, value: true }
            - { field: profile_consent, operator: eq, value: true }
            - { field: has_age,         operator: eq, value: true }
          next_subagent_id: profile_update
          session_writes: { update_return_to: service_match, update_stage: "" }
        # No profile, nothing to change: the create path owns this caller.
        - intent: update_profile_request
          conditions:
            - { field: profile_item_id, operator: not_eq, value: "" }
          next_subagent_id: consent
          session_writes: { consent_return_to: profile_update,
                            update_return_to: service_match, update_stage: "" }
        - intent: explore_more
          next_subagent_id: job_match
          session_writes: { services_in_play: "false", selected_service_item_id: "" }
        - intent: job_pick
          next_subagent_id: job_match
          session_writes: { services_in_play: "false", selected_service_item_id: "" }
        - intent: service_pick
          conditions:
            - field: profile_item_id
              operator: not_eq
              value: ""
          next_subagent_id: connect_confirm
        - intent: service_pick
          conditions:
            - { field: user_terms,      operator: eq, value: true }
            - { field: user_privacy,    operator: eq, value: true }
            - { field: profile_consent, operator: eq, value: true }
            - { field: has_age,         operator: eq, value: true }
          next_subagent_id: profile_setup
        - intent: service_pick
          next_subagent_id: consent
          session_writes: { consent_return_to: profile_setup }
        - intent: "*"
          next_subagent_id: service_match

    - id: connect_confirm
      name: Connect & Confirm
      description: >
        Confirm with the caller, then call connect_service. Announces the
        result. Takes its inputs from the prior tool results —
        profile_item_id and selected_service_item_id — and asks for nothing.
      is_start: false
      is_terminal: false
      opening_phrase: "ನಿಮ್ಮ ಮಾಹಿತಿಯನ್ನ ಅವರಿಗೆ ಕಳಿಸ್ಲಾ?"

      tools:
        - connect_service

      system_prompt: |
        You are in the **connect_confirm** phase. Your job is to call
        connect_service for the organisation the caller chose, and say what
        happened. If a result for it is already in this conversation, speak
        from that and do not call it again.

        ## Ask before you send (HARD RULE)
        Sending the enquiry puts the caller's name and number in front of a
        real organisation. It happens only after they have said yes to
        being asked.

          - If the turn immediately before this one asked whether to send it
            and the caller said YES — that is your confirmation. Call
            connect_service. Do not ask twice.

          - Otherwise — including when the caller arrived here by naming an
            organisation — ASK FIRST and send nothing this turn:

              "<ಸಂಸ್ಥೆ>ಗೆ ನಿಮ್ಮ ಮಾಹಿತಿ ಕಳಿಸ್ಲಾ?"
              ("Shall I pass your enquiry on to <organisation>?")

            Then stop and wait.

        **Naming an organisation is not asking you to contact it.** A
        caller who picks the first one to hear more about it has asked for
        nothing to be sent.

        That holds just as firmly AFTER you have asked. Measured: you asked
        "ಕಳಿಸ್ಲಾ?", the caller answered "ಮೊದಲನೇದು", and the enquiry went
        out. Naming one at this step changes WHICH organisation, it does not
        answer the question — say what that one offers and what it costs,
        ask again for that one, and send nothing this turn.

        Only these count as the yes: ಹೌದು, ಹಾ, ಸರಿ, ಓಕೆ, ಕಳಿಸಿ,
        ಕಳಿಸಿಬಿಡಿ — an agreement, not a choice.

        A caller who already has a profile is the case to watch. Nothing
        stands between their pick and this phase — no details to collect, no
        question on the way — so you arrive holding an organisation they
        merely named. Measured: on that path the enquiry went out on the
        pick itself, while callers who came through profile_setup were
        asked first and were not. Arriving with a choice is not arriving
        with a yes; ask, and send on the next turn.

        ## Where the fields come from
        profile_item_id — the caller's profile item_id, from fetch_profile
        or from save_profile's response. service_item_id — the chosen
        organisation's item_id from the fetch_services result, copied
        verbatim as the full hyphenated UUID, never the caller's words for
        which one they picked. acting_as_user_id is supplied for you; do
        not pass it.

        ## Announce only what the result says
        On success: "ನಿಮ್ಮ ಮಾಹಿತಿಯನ್ನ <ಸಂಸ್ಥೆ>ಗೆ ಕಳಿಸಿದ್ದೀನಿ. ಅವರು ನಿಮ್ಮನ್ನ
        ಸಂಪರ್ಕ ಮಾಡ್ತಾರೆ." ("Your enquiry has been passed to <organisation>. They
        will contact you.")

        On failure, say plainly that it did not go through and what you
        will do next. Never report a success that the tool did not return,
        and never promise a callback the result does not support.

      pending:
        - id: closing_offer
          expects: "ಇನ್ನೇನಾದ್ರೂ ಸಹಾಯ ಬೇಕಾ? / ಕಾಲ್ ಮುಗಿಸೋದು"
          when: [{ field: service_enquiries_submitted, operator: gt, value: 0 }]
        - id: enquiry_confirm
          expects: "ಮಾಹಿತಿ ಕಳಿಸ್ಲಾ? ಹೌದು/ಇಲ್ಲ, ಅಥವಾ ಬೇರೆ ಸಂಸ್ಥೆ ಆರಿಸೋದು"
          options_from: { tool: fetch_services, fields: [organisation_name], id_field: item_id }
          resolves_to: selected_service_item_id

      routing:
        - intent: off_track
          next_subagent_id: connect_confirm
        - intent: termination_intent
          next_subagent_id: ended
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
        - intent: service_pick
          next_subagent_id: connect_confirm
        - intent: explore_more
          next_subagent_id: job_match
          session_writes: { services_in_play: "false", selected_service_item_id: "" }
        - intent: services_request
          next_subagent_id: service_match
          session_writes: { services_in_play: "true" }
        - intent: "*"
          conditions:
            - field: service_enquiries_submitted
              operator: gt
              value: 0
          next_subagent_id: ended
        - intent: "*"
          conditions:
            - field: subagent_entry_count.connect_confirm
              operator: gt
              value: 3
          next_subagent_id: ended
        - intent: "*"
          next_subagent_id: connect_confirm

    # confirm_close — the caller sounded like they were leaving before
    # anything was applied for ("ಈಗ ಬ್ಯುಸಿ ಇದ್ದೀನಿ, ಆಮೇಲೆ ಮಾತಾಡ್ತೀನಿ").
    #
    # The termination gate does not let that close end the call on its own
    # (a misread thank-you would hang up mid-journey), and no earlier phase
    # has end_session. Without this phase the model wrote its own goodbye
    # and the call stayed open until the caller hung up. One fixed question;
    # "ಹೌದು" (or another close) passes the gate via `pending: close_confirm`
    # and ends in `ended`; anything else returns to the phase recorded in
    # close_return_to by the rule that routed here. Asked at most once per
    # call: each phase's termination_blocked rule ends outright once
    # subagent_entry_count.confirm_close > 0.
    - id: confirm_close
      name: Confirm Close
      description: Ask once whether to end the call before anything is done.
      is_start: false
      is_terminal: false
      opening_phrase: "ಕಾಲ್ ಇಲ್ಲಿಗೆ ಮುಗಿಸಲಾ?"
      special_handler: null
      tools: []
      # fixed_opening needs at least one required field; close_return_to is
      # written by the very rule that routes here, so it is always present.
      fixed_opening: "ಕಾಲ್ ಇಲ್ಲಿಗೆ ಮುಗಿಸಲಾ?"
      fixed_opening_requires: [close_return_to]
      system_prompt: |
        The caller sounded like they want to end the call. Ask exactly this
        one sentence and nothing else: "ಕಾಲ್ ಇಲ್ಲಿಗೆ ಮುಗಿಸಲಾ?"
        Do not say goodbye yet. Do not call any tool.
      pending:
        - id: close_confirm
          expects: "ಹೌದು = ಕಾಲ್ ಮುಗಿಸಿ / ಇಲ್ಲ = ಮಾತು ಮುಂದುವರಿಸಿ"
      routing:
        # off_track (spec §6.6): stay here after repeated
        # off-script turns; never coincides with termination_intent.
        - intent: off_track
          next_subagent_id: confirm_close
        - intent: termination_intent
          next_subagent_id: ended
        # Yes-but-also-asking (close_declined): back to the phase like any other non-confirming answer.
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: opening }], next_subagent_id: opening }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: profile_resolve }], next_subagent_id: profile_resolve }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: job_match }], next_subagent_id: job_match }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: job_details }], next_subagent_id: job_details }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: profile_setup }], next_subagent_id: profile_setup }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: consent }], next_subagent_id: consent }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: clarification }], next_subagent_id: clarification }
        # Any other answer ("ಇಲ್ಲ", a question, a detail): back to where the caller was.
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: opening }], next_subagent_id: opening }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: profile_resolve }], next_subagent_id: profile_resolve }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: job_match }], next_subagent_id: job_match }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: job_details }], next_subagent_id: job_details }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: profile_setup }], next_subagent_id: profile_setup }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: consent }], next_subagent_id: consent }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: clarification }], next_subagent_id: clarification }
        - intent: "*"
          next_subagent_id: opening
    # ─────────────────────────────────────────────────────────────
    # handoff — the caller asked for a person. The framework handles that
    # human_request turn itself (before routing): it escalates, writes
    # handoff_status / close_return_to, routes here and speaks a configured
    # handoff line verbatim, so this phase has no fixed_opening. Its job is the
    # NEXT turn: the delivered line ends with "…ಅಥವಾ ಕಾಲ್ ಇಲ್ಲಿಗೆ ಮುಗಿಸಲಾ?", so after
    # it this phase declares the same close_confirm pending as confirm_close (the
    # close_confirm act-intent rows apply) and routes the same way: "ಹೌದು" ends,
    # anything else returns to close_return_to. Reached only when identity.human_handoff is request.
    - id: handoff
      name: Human Handoff
      description: After a handoff line, confirm ending the call or return to the phase.
      is_start: false
      is_terminal: false
      # Required by the schema, never spoken: the framework speaks the
      # configured handoff line on the turn that routes here.
      opening_phrase: "ಇನ್ನೇನಾದ್ರೂ ಸಹಾಯ ಮಾಡ್ಲಾ, ಅಥವಾ ಕಾಲ್ ಇಲ್ಲಿಗೆ ಮುಗಿಸಲಾ?"
      special_handler: null
      tools: []
      system_prompt: |
        The caller asked to speak to a person and has just been told what
        happened to that request. Do not promise a callback time and do not
        repeat the handoff line. If they want to continue, help with what
        they ask. Do not call any tool.
      # Only the delivered line asks the close question. After the failed line
      # ("…ನೀವು ಏನು ತಿಳ್ಕೊಳ್ಳೋಕೆ ಬಯಸ್ತೀರಾ?") or the already line a "ಹೌದು" is not a
      # goodbye, so nothing is pending and the answer goes back to
      # close_return_to. handoff_line is the line spoken on the handoff turn
      # (handoff_status stays "delivered" on an already turn).
      pending:
        - id: close_confirm
          expects: "ಹೌದು = ಕಾಲ್ ಮುಗಿಸಿ / ಇಲ್ಲ = ಮಾತು ಮುಂದುವರಿಸಿ"
          when:
            - { field: handoff_line, operator: eq, value: delivered }
      routing:
        # off_track (spec §6.6): stay here after repeated
        # off-script turns; never coincides with termination_intent.
        - intent: off_track
          next_subagent_id: handoff
        - intent: termination_intent
          next_subagent_id: ended
        # Yes-but-also-asking (close_declined): back to the phase like any other non-confirming answer.
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: opening }], next_subagent_id: opening }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: profile_resolve }], next_subagent_id: profile_resolve }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: job_match }], next_subagent_id: job_match }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: job_details }], next_subagent_id: job_details }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: profile_setup }], next_subagent_id: profile_setup }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: consent }], next_subagent_id: consent }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: clarification }], next_subagent_id: clarification }
        # Any other answer ("ಇಲ್ಲ", a question, a detail): back to where the caller was.
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: opening }], next_subagent_id: opening }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: profile_resolve }], next_subagent_id: profile_resolve }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: job_match }], next_subagent_id: job_match }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: job_details }], next_subagent_id: job_details }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: profile_setup }], next_subagent_id: profile_setup }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: consent }], next_subagent_id: consent }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: clarification }], next_subagent_id: clarification }
        - intent: "*"
          next_subagent_id: opening
    - id: ended
      name: Session Ended
      description: Graceful session termination.
      is_start: false
      is_terminal: true
      opening_phrase: "ಬ್ಲೂ ಡಾಟ್ಸ್ ಬಳಸಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದ. ನಿಮ್ಮ ದಿನ ಚೆನ್ನಾಗಿರಲಿ."
      special_handler: null
      tools: []
      system_prompt: |
        The user has chosen to end the call. Close warmly. Flush
        session state. Emit termination event.
      routing: []
    - id: clarification
      name: Clarification
      description: Fallback subagent for unknown or unclassifiable intent.
      is_start: false
      is_terminal: false
      opening_phrase: >
        ಕ್ಷಮಿಸಿ, ನನಗೆ ಸರಿಯಾಗಿ ಅರ್ಥ ಆಗಲಿಲ್ಲ. ನೀವು ಏನು ಹುಡುಕ್ತಾ ಇದ್ದೀರಿ,
        ಸ್ವಲ್ಪ ಇನ್ನೂ ಹೇಳ್ತೀರಾ?
      special_handler: null
      tools: []
      system_prompt: |
        The system could not classify the user's intent. Re-prompt
        gently. Do not say "I don't understand." Reflect what you
        know and ask one open question.
      routing:
        # off_track (spec §6.6): stay here after repeated
        # off-script turns; never coincides with termination_intent.
        - intent: off_track
          next_subagent_id: clarification
          # A goodbye ends the call, from ANY phase. It must be the
          # first rule after off_track here, repeated in every phase:
          # routing is 3-pass and pass 1 (these subagent rules) always
          # beats pass 2 (workflow global_routing). Almost every phase ends in an `intent: "*"`
          # catch-all, so the global termination_intent rule is unreachable
          # in practice — measured: "ಸರಿ, ನಾನು ಫೋನ್ ಇಡ್ತೀನಿ" classified
          # termination_intent at 0.95 and still routed to services_offer,
          # so the call never ended.
        - intent: termination_intent
          next_subagent_id: ended
        # A goodbye the termination gate refused (nothing applied yet) is
        # confirmed in confirm_close; once that was asked, the next one ends.
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
          session_writes: { close_return_to: clarification }
        - intent: "*"
          next_subagent_id: clarification

observability:
  domain: "blue_dot"
