# dev-kit/configs/blue-dots-kannada-v1/agent_core.yaml
# Blue Dots (Kannada) — Agent Core domain config.
# Merged with dev-kit/dpg/agent_core.yaml by loader.py before deployment.
# Deploy with DOMAIN=blue-dots-kannada-v1.
#
# Kannada twin of dev-kit/configs/blue-dots/agent_core.yaml, converted from
# the tuned Hindi config (main d4c6f9e) so its fixes carry over. Same phases,
# routing, tools and keys; spoken text, caller examples and keyword lists are
# Kannada. Wording follows the Raya KKB-Slim Kannada prompt where it had an
# equivalent. Not yet tested on Kannada calls.
#
# Differences forced by code that only knows Hindi and English (marked KN:):
#   - output_contract: script "any" (no Kannada script guard) and numbers
#     as a prompt rule, not numbers: words (no Kannada number converter).
#   - fetch_jobs result_shaping has no spoken: block, so pay is read from
#     salary_min/max etc. by the model instead of a pre-formatted field.
#   - The NLU prompt still says "Hindi number words become digits" (code).
#
# Voice-first job-seeker agent. Kannada default; mirrors caller into English
# when they switch. Five linear subagents map to the 5 phases
# of the apply flow.

agent:
  # OpenAI, because that is what this domain was actually validated on --
  # the full journey (job discovery through action/perform) was run end to
  # end against the Signals dev cluster on this provider. The domain was
  # originally authored for Anthropic; switching the declared provider to
  # match the tested one keeps the config honest. Re-validate before
  # changing it back.
  provider: openai
  # 4.1-mini is the primary because it performed better on this journey.
  # On the job-list turn 5.4-mini often returned an empty completion on
  # the post-tool-result call, ending the turn with no sentences:
  # 5.4-mini 1/3 clean runs against 4.1-mini 3/3, measured over the same
  # scripted journey. It reproduces on voice and web driven straight at
  # Agent Core, so it tracks the model rather than any one channel.
  # 5.4-mini stays as the fallback. Re-validate this pairing before
  # changing either model.
  primary_model: gpt-4.1-mini-2025-04-14
  fallback_model: gpt-5.4-mini-2026-03-17
  # OFF, deliberately. This gate intercepts turns 1 and 2 in the
  # orchestrator, BEFORE the workflow runs — the LLM is never called and no
  # subagent sees those turns. That made consent impossible to sequence
  # with anything else, which is why age ended up being collected several
  # phases later, long after the point where the upstream needs it.
  #
  # Consent now lives in the `opening` subagent, as its first question,
  # immediately followed by age and the under-18 gate. See the subagent
  # definition in agent_workflow.subagents for the full reasoning.
  #
  # Turning this off means user_storage_mode is no longer written by the
  # orchestrator. The opening subagent's routing rules write it instead,
  # via session_writes — "saved" on consent, "anonymous" on refusal — so
  # Memory Layer's DPDP flush behaviour is unchanged.
  ask_for_consent: false
  # Retained for reference and for any deployment that turns the gate back
  # on. Not read while ask_for_consent is false; the live consent wording
  # is the `opening` subagent's opening_phrase and system prompt.
  consent_prompt: >
    ನಿಮ್ಮ ವಿವರಗಳನ್ನ ಸೇವ್ ಮಾಡಿ ನಿಮ್ಮ ಪರವಾಗಿ ಜಾಬ್‌ಗಳಿಗೆ ಅಪ್ಲೈ ಮಾಡಬಹುದಾ?
    ಮುಂದುವರಿಯೋಕೆ ಹೌದು ಅಂತ ಹೇಳಿ.

  # Apply flow chains up to three tools (onboard → apply_job is the worst
  # case after the user picks a job; profile fetch and job fetch are
  # earlier turns). Three rounds covers every legitimate path.
  max_tool_rounds: 3

  # GH-204: short-circuit the LLM call on a clear goodbye.
  termination_short_circuit:
    enabled: true
    confidence_threshold: 0.7

  # Session fields shown to the LLM in <state> collected. These three are written
  # by fetch_profile's response.session_mapping (action_gateway.yaml), and the
  # profile_resolve prompt reads them from <state> collected.
  prompt_session_fields: [profile_item_id, stored_trade, stored_location,
                          user_terms, user_privacy, profile_consent, has_age]
  history_turns: 2
  state_fields: [applications_submitted, selected_job_item_id]

# Session bootstrap: fetch the caller's profile before turn-1 routing, without
# the LLM, so a returning caller's consent/age flags and live profile are in
# session state when turn 1 is routed (session-bootstrap spec). Read connector only.
session_bootstrap:
  timeout_ms: 2000
  steps:
    - type: tool
      tool: fetch_profile

# Lookup tables for tool pre-dispatch (Spec E). city_canonical maps a spelling
# to the canonical Indian-city name the upstream stores. Keys are what a
# Kannada caller says: Kannada script plus the common Latin/Kanglish spellings.
predispatch_tables:
  city_canonical:
    ಬೆಂಗಳೂರು: Bengaluru
    ಬೆಂಗಳೂರ್: Bengaluru
    ಬ್ಯಾಂಗಲೋರ್: Bengaluru
    ಬಾಂಬೆ: Mumbai
    ಮುಂಬೈ: Mumbai
    ಮದ್ರಾಸ್: Chennai
    ಚೆನ್ನೈ: Chennai
    ಕಲ್ಕತ್ತಾ: Kolkata
    ಕೋಲ್ಕತ್ತಾ: Kolkata
    ಹುಬ್ಬಳ್ಳಿ: Hubballi
    ಹುಬ್ಳಿ: Hubballi
    ಹುಬ್ಲಿ: Hubballi
    Hubbali: Hubballi
    ಮೈಸೂರು: Mysuru
    ಮೈಸೂರ್: Mysuru
    ಗುರ್ಗಾಂವ್: Gurugram
    ಗುರುಗ್ರಾಮ್: Gurugram
    # KN: Dharwad / Belagavi are not in the Hindi table; added because they are
    # the Hubli-Dharwad callers' home cities. Verify the upstream spelling.
    ಧಾರವಾಡ: Dharwad
    ಧಾರವಾಡ್: Dharwad
    Dharwar: Dharwad
    ಬೆಳಗಾವಿ: Belagavi
    ಬೆಳಗಾಂ: Belagavi
    Belgaum: Belagavi
    Bangalore: Bengaluru
    Bombay: Mumbai
    Madras: Chennai
    Calcutta: Kolkata
    Hubli: Hubballi
    Mysore: Mysuru
    Trivandrum: Thiruvananthapuram
    Cochin: Kochi
    Pondicherry: Puducherry
    Gurgaon: Gurugram
  name_placeholders: [unknown, "n/a", na, none, caller, user, "-", "ಹೆಸರು", "ಗೊತ್ತಿಲ್ಲ"]

channels:
  bridge:
    system_prompt_suffix: |
      You are speaking to someone on a phone call, not writing a chat message.
      They HEAR your reply through a voice client; they cannot see it. There is
      no text-to-speech cleanup step after you — whatever you write is spoken
      exactly as written, so:
      - Never use markdown, asterisks, bullet points, numbered lists, headings,
        backticks or emoji — they are read aloud character by character.
      - Write numbers, money, dates, times, phone numbers and email addresses in
        spoken form, never digits or symbols.
      - Never mention screens, tapping, clicking, links or typing — the caller
        only has their voice and their ears.

      ## Response length (hard rule)
      Reply in at most 2 short sentences. The only exception is presenting
      a list of jobs, where you may use at most 3 items, one short line each.

      ## Style
      Warm, natural, conversational. Calm pace, one idea at a time. Speak
      Kannada by default. Switch to English only if the caller
      does, and then stay in that language until they switch again.

      Your instructions, tool descriptions and any example wording in them
      are written in English for the people who maintain this config. They
      are not a cue to answer in English. Say everything to the caller in
      the conversation language — Kannada unless they switched — including
      short filler lines, error messages and confirmations.
      Never corporate, sales-like, scripted, or fake-warm.

      ## Never voice a slash
      Several inventory role names arrive with a "/" in them. The slash is
      never spoken as "ಸ್ಲ್ಯಾಶ್" and a literal "/" is never emitted:
        "ಸೇಲ್ಸ್/ಮಾರ್ಕೆಟಿಂಗ್"            → "ಸೇಲ್ಸ್ ಅಥವಾ ಮಾರ್ಕೆಟಿಂಗ್"
        "ಕಸ್ಟಮರ್ ಸಪೋರ್ಟ್/ಬಿಪಿಒ"        → "ಕಸ್ಟಮರ್ ಸಪೋರ್ಟ್ ಅಥವಾ ಬಿಪಿಒ"
        "Computer Operator / Data Entry" → "ಕಂಪ್ಯೂಟರ್ ಆಪರೇಟರ್ ಅಥವಾ ಡೇಟಾ ಎಂಟ್ರಿ"
      Where the slash means "per", speak the per-form: "₹500/day" →
      "ದಿನಕ್ಕೆ ಐನೂರು ರೂಪಾಯಿ". Under no circumstance voice the symbol.

      ## A placeholder is never words you say
      Anything in angle brackets or square brackets anywhere in these
      instructions — <location>, <trade>, <company>, [role], [ಹೆಸರು] — is a
      SLOT, not speech. Fill it with the real value before the sentence
      leaves your mouth. If you cannot fill it, say the sentence without
      that part, or say a different sentence. NEVER read the marker aloud.
      This is not hypothetical: a caller was told
      "ನಿಮ್ಮ ಮಾಹಿತಿಯಲ್ಲಿ <location> ಇದೆ" with the marker spoken
      verbatim. The same goes for any note to yourself in *( )*.

      ## Silence handling
      Silence is meaningful — do not rush to fill it.
      - Short pause: user is thinking. Wait.
      - Longer pause: one gentle bridge, e.g. "Take your time."
      - After disappointing facts (no jobs, declined application):
        let the truth land. Do not pile on questions.

      ## General voice etiquette
      Never reply with "please wait" messages. Always reply with the
      actual answer.

      ## Prior tool results
      Prior tool results in this conversation are in <known_facts> or, for
      a tool with no entry there, visible to you as real tool_result
      messages earlier in the message history. Do not re-invoke a tool
      unless the relevant parameters have changed; reuse the
      already-returned data when answering follow-up questions.

      ## Phone numbers, IDs, and internal state
      - Say phone digits one by one — never as a single chunk.
      - Never speak internal IDs aloud (item_id, application_id,
        action_id, profile_item_id, source_item_owner, UUIDs).
      - Never narrate your internal reasoning or session state.
        Specifically NEVER emit any of these patterns (real leaks):
          "The session context shows the user has selected <employer>
           and the profile action is create_new. I need to gather
           remaining required fields for save_profile. I have name
           (<name>), gender (<gender>), location (...)…"
          "I'll map that to the second job in the fetch_jobs result…"
          "From the fetch_jobs results, <employer> has item_id …"
          "I have all the details I need." / "Let me save now."
        These chain-of-thought leaks are forbidden. Either ASK the
        next question, CALL the next tool silently, or ANNOUNCE the
        result — nothing in between.
    terminal_word: "ಧನ್ಯವಾದ"
    output_contract:
      default_language: kannada
      languages:
        # KN: script `any` because the code has no Kannada script option; no
        # `numbers: words` because there is no Kannada number converter and
        # validation rejects it for Kannada. The first rule below carries it.
        kannada:
          script: any
          rules:
            - "Write every number in Kannada words, never as digits."
            - "Kannada script only. English loanwords in Kannada script: ಜಾಬ್, ಸ್ಕಿಲ್, ಆಪ್ಷನ್, ಅಪ್ಲೈ, ಲೊಕೇಶನ್, ಡೇಟಾ. Switch script only if the caller switches language."
            - "Employer, role and place names arrive in Latin script: sound each out and write it in Kannada script (SARA ENTERPRISES → ಸಾರಾ ಎಂಟರ್‌ಪ್ರೈಸಸ್, QUESS CORP LTD. → ಕ್ವೆಸ್ ಕಾರ್ಪ್, Sarjapur → ಸರ್ಜಾಪುರ). Never read a Latin value out as English letters."
            - "Read pay from salary_min/salary_max (or stipend_min/stipend_max), in rupees per month: say it in Kannada words rounded to the nearest thousand, as a range — ಇಪ್ಪತ್ತು ಸಾವಿರದಿಂದ ಮೂವತ್ತೆರಡು ಸಾವಿರ ರೂಪಾಯಿ ತಿಂಗಳಿಗೆ. task_rate_min/task_rate_max is rupees per task: ಒಂದು ಕೆಲಸಕ್ಕೆ ಐನೂರು ರೂಪಾಯಿ. If only one bound is present say just that. If none is present, say the job without pay."
            - "Times as ಬೆಳಿಗ್ಗೆ / ಮಧ್ಯಾಹ್ನ / ಸಂಜೆ / ರಾತ್ರಿ, never AM or PM. Dates in full words: ಜನವರಿ ಇಪ್ಪತ್ತೊಂಬತ್ತು, ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತಾರು."
            - "Abbreviations as letters in Kannada script: ITI → ಐ ಟಿ ಐ, NCVT → ಎನ್ ಸಿ ವಿ ಟಿ."
            - "Speak a city, never a PIN, plot, house, gali or sector number."
        english:
          script: latin
          numbers: words
          rules:
            - "Plain spoken English. Read pay from salary_min/salary_max (or stipend_min/stipend_max, rupees per month, rounded to the nearest thousand; task_rate_min/task_rate_max, rupees per task) in English words, never digits."
      guard:
        rewrite_digits: true
        strip_markdown: true
        count_foreign_script: true
    turn_assembler:
      silence_trigger:
        silence_ms: 800
      max_wait_ceiling:
        max_wait_ms: 8000

conversation:
  # EVERY string in this block is spoken to the caller VERBATIM — the
  # orchestrator emits them without an LLM call, so whatever language they
  # are written in is the language the caller hears.
  #
  # They pass through _translate_consent_message (orchestrator.py:2540),
  # which looks like it would translate them but does not: its first guard
  # returns the message unchanged when the detected language is empty, and
  # detection is off in this deployment (preprocessing.language_normalisation
  # .enabled: false), so every turn resolves to "". Measured on the 24 Sep
  # PoC calls: termination_message alone was spoken in English 38 times.
  #
  # So these are written in Kannada, to match the rest of the domain. If
  # language detection is ever turned on, translation starts working and
  # these become the Kannada source text rather than the final output.
  blocked_message: "ಕ್ಷಮಿಸಿ, ಇದರಲ್ಲಿ ನಾನು ಸಹಾಯ ಮಾಡೋಕೆ ಆಗಲ್ಲ."
  escalation_message: "ನಿಮ್ಮನ್ನ ಒಬ್ಬ ಕೌನ್ಸೆಲರ್ ಜೊತೆ ಕನೆಕ್ಟ್ ಮಾಡ್ತೀನಿ, ಅವರು ಮುಂದೆ ಸಹಾಯ ಮಾಡ್ತಾರೆ."
  output_blocked_message: "ಕ್ಷಮಿಸಿ, ಉತ್ತರ ಕೊಡೋಕೆ ಸ್ವಲ್ಪ ತೊಂದರೆ ಆಗ್ತಿದೆ. ಇನ್ನೊಂದ್ಸಲ ಕೇಳ್ತೀರಾ?"
  unknown_intent_message: "ಕ್ಷಮಿಸಿ, ನನಗೆ ಸರಿಯಾಗಿ ಕೇಳಿಸ್ಲಿಲ್ಲ. ಇನ್ನೊಂದ್ಸಲ ಹೇಳ್ತೀರಾ?"
  termination_message: "ಬ್ಲೂ ಡಾಟ್ಸ್ ಬಳಸಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದ. ನಿಮ್ಮ ದಿನ ಚೆನ್ನಾಗಿರಲಿ."
  # Spoken only when a turn produced no text at all, after the orchestrator's
  # empty-completion retry has already failed twice. On a phone line the
  # alternative is silence, which a caller cannot tell apart from a dropped
  # call. Asks them to repeat rather than pretending anything was understood.
  empty_response_message: "ಕ್ಷಮಿಸಿ, ನನಗೆ ಸರಿಯಾಗಿ ಕೇಳಿಸ್ಲಿಲ್ಲ. ಸ್ವಲ್ಪ ಇನ್ನೊಂದ್ಸಲ ಹೇಳ್ತೀರಾ?"
  unsupported_language_message: >
    ಕ್ಷಮಿಸಿ, ನಾನು ಕನ್ನಡ ಅಥವಾ ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ ಮಾತ್ರ ಸಹಾಯ ಮಾಡಬಹುದು.
    ಇವುಗಳಲ್ಲಿ ಯಾವುದಾದ್ರೂ ಒಂದು ಭಾಷೆಯಲ್ಲಿ ಮಾತಾಡ್ತೀರಾ?
  consent_decline_ack: >
    ಪರವಾಗಿಲ್ಲ — ನಿಮ್ಮ ಗೋಪ್ಯತೆಯನ್ನ ನಾವು ಗೌರವಿಸ್ತೀವಿ. ನಿಮ್ಮ ವಿವರಗಳನ್ನ ಸೇವ್
    ಮಾಡಲ್ಲ.
  profile_complete_message: "ಧನ್ಯವಾದ — ಈಗ ನಿಮಗೆ ಜಾಬ್‌ಗಳನ್ನ ನೋಡ್ತೀನಿ."
  returning_user_greeting: "ಮತ್ತೆ ಸ್ವಾಗತ! ಇವತ್ತು ನಿಮಗೆ ಏನೇನು ಇದೆ ಅಂತ ನೋಡ್ತೀನಿ."

  # GH-139 user mental-state model — disabled for blue-dots; the flow is
  # linear enough not to need state-conditioned prompts.
  user_state_model:
    enabled: false
    default_state: fog
    states: []

  session_end_eval:
    enabled: true
    # Only the CLOSING phases may hang up on a caller. Without this the tool is
    # offered to every subagent, and its own description ("task completed")
    # invites the model to fire it the moment a journey succeeds — the prompt
    # rules below did not hold against that. Measured on a live local call:
    #   16:05:25  9 ms after a 201 Created apply, same turn as the tool call
    #   16:05:37  on "ಸರಿ, ಧನ್ಯವಾದ" — routine thanks
    #   16:11:06  while the agent's own reply was still asking
    #             "ಅಪ್ಲೈ ಮಾಡ್ಲಾ?" — hangs up mid-question
    # Each of those drops a real call. A genuine goodbye still ends properly:
    # `termination_intent` is a GLOBAL route to `ended` from any phase, and
    # `ended` is on this list.
    subagents:
      - ended              # normal close, reached from anywhere on goodbye
      - u18_blocked        # under 18, cannot be onboarded by voice
    prompt: |
      ## Session-end evaluation
      `end_session` hangs up on the caller. Treat it as the last thing you
      ever do on a call, and only when the caller has plainly asked to go.

      Call it ONLY when BOTH are true:
        1. The caller has clearly asked to end the call — "ಇಡ್ತೀನಿ",
           "ಆಮೇಲೆ ಮಾತಾಡ್ತೀನಿ", "ಈಗ ಬೇಡ", "bye", "ಸರಿ ಇಡಿ",
           "that's all", "cut the call" — or has declined to continue and
           there is nothing left to offer; AND
        2. There is no question of yours still awaiting an answer.

      NEVER call it while you are asking something. If your own reply
      in this turn ends in a question mark, condition 2 is false and you
      must not call it — the caller is mid-answer and the line would
      drop on them.

      NEVER call it because the caller asked you to DO something.
      "ಅಪ್ಲೈ ಮಾಡಿ", "ಕಳಿಸಿ", "ತೋರಿಸಿ", "ಹುಡುಕಿ" are requests to
      continue — the opposite of a goodbye. Firing end_session in the
      same turn as your own question drops the line mid-question.

      NEVER call it because the caller said thank you.
      "ಧನ್ಯವಾದ", "ಧನ್ಯವಾದಗಳು", "thank you", "ಸರಿ ಧನ್ಯವಾದ" and
      "ಥ್ಯಾಂಕ್ಸ್" are ordinary politeness in Kannada and are used constantly
      MID-conversation — after an answer, after a job is read out, after
      any small thing. On their own they mean "got it", not "goodbye".
      A caller who says "ಸರಿ ಧನ್ಯವಾದ" and then keeps talking has not
      ended anything. Treating routine thanks as a hang-up signal is the
      commonest way this tool gets fired while the caller is still
      working through the call.

      NEVER call it because the caller refused permission. A refusal
      closes the application path, not the call: the caller is asked
      whether they want anything else on jobs or training, and that is
      a question like any other. Ending there drops the line on a
      question the caller has not answered yet.

      NEVER call it:
        - in the `opening` phase for any reason OTHER than the consent
          refusal above — age is not a conversation the caller can
          conclude;
        - while any question of yours is unanswered;
        - mid-flow: picking a job, confirming a profile, waiting on an
          application result;
        - in the same turn as any other tool call.

      When in doubt, do NOT call it. A call that stays open one turn too
      long costs the caller a moment. A call cut off mid-sentence costs
      them the whole journey and they have to redial.
    fail_action: "none"

# Framework `remember` tool: deliberately NOT enabled for blue-dots.
#
# Declaring `memory_tool` offers `remember` to the model alongside every tool
# list, prompt or no prompt. Measured on a local run (2026-10-01): the model
# called it unprompted, nothing grounded the value so every call was rejected,
# and on the streaming path it retried until the tool-round cap — an 8.9 s turn
# whose reply never listed the jobs. profile_item_id is already set from the
# live item by fetch_profile's session_mapping, so nothing needs it yet.
#
# To enable later: declare `memory_tool` (fields + grounded_in, see
# dev-kit/dpg/agent_core.yaml) together with the prompt that calls it.

# Connector descriptions seen by the LLM when picking a tool. The full
# adapter + path config lives in action_gateway.yaml; this block adds the
# invocation_rules that gate when the LLM may call each tool.
connectors:
  read:
    - name: fetch_profile
      description: >
        Look up the caller's seeker profile(s) by phone number. Returns
        zero, one, or many profiles. Already fetched when the call started —
        use the fetch_profile entry of <known_facts> or, if there is none,
        the earlier fetch_profile result. Call it yourself only if neither
        exists or the caller says their details changed. Takes no parameters — the caller's phone is
        injected from the session user_id by the rest_api adapter.
      input_schema:
        type: object
        properties: {}
        additionalProperties: false
      invocation_rules:
        call_when: >
          Use the fetch_profile entry of <known_facts> or, if there is
          none, the earlier fetch_profile result in this conversation. An
          empty <known_facts> alone is no reason to call again. Call only
          if neither exists, or the caller says their details changed
          (then pass force_refresh=true).
        required_before_calling: []
        must_not_substitute: >
          Never invent profile content. If fetch_profile returned zero
          profiles, the user is new and trade + city must be asked
          explicitly.
        on_empty: >
          ನೀವು ಯಾವ ಟ್ರೇಡ್‌ನಲ್ಲಿ ಕೆಲಸ ಹುಡುಕ್ತಿದ್ದೀರಿ?
        on_failure: >
          ಕ್ಷಮಿಸಿ, ಈಗ ನಿಮ್ಮ ವಿವರಗಳು ಸಿಗ್ತಿಲ್ಲ. ಸ್ವಲ್ಪ ಹೊತ್ತಲ್ಲಿ
          ಮತ್ತೆ ಟ್ರೈ ಮಾಡ್ತೀನಿ.
        bridge_line: "ಒಂದು ನಿಮಿಷ —"
      # Stored for 30 minutes so later turns of the call read the result from
      # <known_facts> instead of re-fetching. save_profile invalidates it
      # (below). Session scope, NOT user: a cache hit does not replay
      # session_mapping, so on a redial (new session) has_age, user_terms,
      # user_privacy, profile_item_id, acting_as_user_id, stored_trade and
      # stored_location would never be written, re-asking consent/age and
      # sending returning callers down the new-user path. User scope needs a
      # framework follow-up first. `keep` lists projected fields of
      # fetch_profile's response.projection (action_gateway.yaml). The
      # projection is deliberately NOT narrowed: profile_setup (update path)
      # and apply_confirm read item_state fields (age, work_experience, ...)
      # from items[], so the whole items array must stay.
      cache:
        scope: session
        ttl_seconds: 1800
        keep: [source_item_owner, acting_as_user_id, items]

    - name: fetch_jobs
      description: >
        Search the Blue Dots provider network for current job postings.
        Call only after trade and city are confirmed in memory.

        The search RANKS, it does not FILTER. It returns its best five
        rows for any question, so expect rows for a different trade and
        rows in other cities — sometimes every row. Checking the trade
        and the city on each row is yours to do, every time, before you
        say anything about a job.
      input_schema:
        type: object
        properties:
          item_state.role:
            type: string
            description: "Trade / role to filter by (capitalised, e.g. 'Plumber')."
          item_state.city:
            type: string
            description: >
              The caller's city, capitalised canonical name — "Bengaluru"
              not "bengaluru". It goes into the semantic query, so it
              shapes the ranking; it is not a server-side filter and rows
              in other cities still come back.
        additionalProperties: false
      invocation_rules:
        call_when: >
          User is in the job_match subagent AND both trade and city are
          set in session state AND the user has not already picked a
          job. Re-call on user request to broaden or change trade/city.
        required_before_calling: [trade, location]
        must_not_substitute: >
          Never describe job availability from memory or from a prior call.
          Fetch fresh whenever the trade or the city changes. Within one
          trade and city, THIS call's search result is the list: reading
          out a row you already fetched and have not yet offered is not
          describing from memory, and needs no second search.
        on_empty: >
          ಈಗ ಆ ಊರಲ್ಲಿ ಆ ಟ್ರೇಡ್‌ನ ಯಾವ ಜಾಬ್ ಕೂಡ ಕಾಣ್ತಿಲ್ಲ. ಹತ್ತಿರದ
          ಊರುಗಳಲ್ಲಿ ನೋಡ್ಲಾ, ಬೇರೆ ಟ್ರೇಡ್‌ನಲ್ಲಿ ನೋಡ್ಲಾ, ಅಥವಾ ನಿಮಗೆ ಟ್ರೈನಿಂಗ್
          ತರ ಏನಾದ್ರೂ ಸಹಾಯ ಬೇಕಾ?
        on_failure: >
          ಕ್ಷಮಿಸಿ, ಜಾಬ್ ಸರ್ವೀಸ್ ಈಗ ಸಿಗ್ತಿಲ್ಲ. ಸ್ವಲ್ಪ ಹೊತ್ತಲ್ಲಿ ಮತ್ತೆ
          ಟ್ರೈ ಮಾಡ್ತೀನಿ.
        bridge_line: "ನಿಮಗೆ ಜಾಬ್‌ಗಳನ್ನ ನೋಡ್ತೀನಿ."
      # Stored so the dialogue-act NLU frame can list the jobs on offer and
      # resolve "ಮೊದಲನೇದು" to an item_id (NLU dialogue-acts spec §5.2, §6.3).
      # Session scope: a later call searches afresh. The projection is a list,
      # so `keep` does not apply. Each query_text is its own entry; the latest
      # one is the list on offer.
      cache:
        scope: session
        ttl_seconds: 1800
      result_shaping:
        drop_when:
          - { field: role, operator: in, value: [null, "", "na", "NA", "Na", "Any", "any", "Not Available"] }
          - { field: role, operator: contains, value: "|" }
        sort:
          - { field: match_score, order: desc }
          - { field: salary_max, order: desc }
        # KN: no Kannada spoken-number converter in code; pay is read from salary_min/max etc. (see output_contract).
        strip_numbers_in: [location]
    - name: fetch_services
      description: >
        Search the Blue Dots network for support organisations — skilling
        and vocational training, job placement assistance, career
        counselling and interview preparation, financial aid and scheme
        enrolment, help with accommodation or travel. Call only when the
        caller has asked for this kind of help.

        The search RANKS, it does not FILTER. It returns its best five
        rows for any question, so a subject the network does not hold
        still comes back as five organisations that do something else.
        Checking each row against what the caller actually asked is
        yours to do, every time, before you name a single one.
      input_schema:
        type: object
        properties:
          query_text:
            type: string
            description: >
              What the caller needs, in an English sentence, naming the city
              when it is known — "skill training for a welder in Ghaziabad".
          offset:
            type: integer
            description: "How many results to skip. OMIT on a first search."
        required: ["query_text"]
        additionalProperties: false
      invocation_rules:
        call_when: >
          User is in the service_match subagent AND has said what kind of
          help they want, or has agreed to hear what support is available.
        required_before_calling: []
        must_not_substitute: >
          Never describe an organisation, a course or a cost from memory.
          Only what this tool returned in this call may be spoken.
        on_empty: >
          ಈಗ ಈ ತರದ ಯಾವ ಸಹಾಯನೂ ಕಾಣ್ತಿಲ್ಲ. ಜಾಬ್‌ಗಳನ್ನ ನೋಡ್ಲಾ?
        on_failure: >
          ಕ್ಷಮಿಸಿ, ಈ ಮಾಹಿತಿ ಈಗ ಸಿಗ್ತಿಲ್ಲ. ಜಾಬ್‌ಗಳನ್ನ ನೋಡ್ಲಾ?
        bridge_line: "ಏನು ಸಹಾಯ ಸಿಗುತ್ತೆ ಅಂತ ನೋಡ್ತೀನಿ."
      cache:
        scope: session
        ttl_seconds: 1800
      result_shaping:
        drop_when:
          - { field: organisation_name, operator: in, value: [null, "", "na", "NA", "Na"] }
        sort:
          - { field: match_score, order: desc }
  # save_profile and apply_job were listed under `read:` though both are
  # write tools (category: write in action_gateway.yaml). `invalidates` is only
  # valid on `write`, so they moved here; tool order and consent handling are
  # unchanged (the gateway category decides consent, not this grouping).
  write:
    - name: save_profile
      description: >
        Create a new seeker profile. This is the create path only —
        changing an existing profile is update_profile's job.
      input_schema:
        type: object
        properties:
          name: {type: string}
          phone: {type: string}
          gender: {type: string}
          location: {type: string}
          age: {type: integer}
          work_experience: {type: string, description: "Fresher / Worked before / Returning after a break"}
          profile_item_id: {type: string, description: "Pass to UPDATE; omit to CREATE."}
          experience_years: {type: string}
          trade: {type: string}
          job_nature: {type: string}
          help_needed: {type: string}
        # Mirrors the live upstream schema, fetched from
        # GET /api/v1/network/schema/blue_dot/seeker/profile_1.0, which
        # requires exactly ["name", "phone"]. gender, location, age and
        # work_experience are all optional there.
        #
        # This list previously demanded all six, so the bot walked a
        # five-question gauntlet before it could save anything — 57 of 201
        # turns on the 24 Sep PoC calls were spent in profile collection and
        # no application completed. phone comes free from the caller's
        # number, so the caller is asked exactly one question: their name.
        #
        # age is NOT listed here but is still always sent: the participant
        # endpoint rejects with 400 AGE_REQUIRED when consent is present and
        # no age is on file, so the opening subagent collects it before the
        # journey starts and it is in session by the time this fires.
        required: ["name", "phone"]
        additionalProperties: false
      invocation_rules:
        call_when: >
          User is in the profile_setup subagent AND the name is known.
          Reaching that phase already means the caller has no live
          profile, so this is always a create. Send every other field
          you already have — trade, location and age are known by then —
          and do not ask for or wait for any of them.

          OMIT profile_item_id. It is what makes the call an UPDATE, and
          there is nothing to update.
        # One profile per turn, enforced. save_profile creating a duplicate is
        # worse than apply_job doing so: the upstream rejects a duplicate
        # application, but it accepts a second profile happily, and the caller
        # ends the call with two — the application attached to whichever one
        # the model used last. Two of four test runs produced a second live
        # profile under a name the caller never gave.
        max_calls_per_turn: 1
        # Consent gate, enforced before the call leaves Agent Core. A returning
        # caller whose consent is on file has these from fetch_profile and is
        # not asked again; anyone else has them only after the consent phase.
        consent_session_fields: [user_terms, user_privacy, profile_consent]
        grounded_params:
          # Same guard apply_job carries, for the same reason. Measured on
          #
          # Naming the source tools is what catches it: the value is a
          # well-formed UUID that really did appear in a tool result, just
          # the wrong tool's.
          profile_item_id: [fetch_profile, save_profile]
        required_before_calling: [name, phone]
        # must_not_substitute states this for the model to read; this enforces
        # it. The prompt already said "only if the caller volunteered them
        # unprompted" and was ignored: a seeker who said only their name, trade
        # and city went out with work_experience="Returning after a break",
        # experience_years="1 Year" and job_nature="Full-time" — none uttered,
        # all three empty in session, slot_provenance listing only
        # [consent_response, name, age, trade, location].
        #
        # Each param here is taken from the FIRST non-empty session key listed
        # and dropped when none has a value, so the model's own value is never
        # used.
        #
        # `name` was deliberately absent, on the grounds that it is required and
        # dropping it guarantees an upstream rejection. That reasoning is right
        # about the mechanism and wrong about which outcome is worse. Because
        # `name` is `required: true` in the tool schema, the model cannot emit
        # the call without SOME value, and when the caller has not been asked it
        # invents one. Measured upstream across three runs, the same caller
        # profile was written as `caller`, as `Unknown`, and as the literal
        # `[ಬಳಕೆದಾರರ ಹೆಸರು]` (Hindi original: "user's name") — a permanent record under a name its owner
        # never gave, which no later call can tell from a real one.
        #
        # Listed here, the caller's own spoken name (an NLU slot, carried in
        # `known_fields`) is what gets sent, and a name nobody supplied is
        # DROPPED. The save then fails loudly with the upstream's own
        # "name required", `on_failure` below is spoken, and the model asks the
        # question it should have asked. A refused write beats a fabricated one.
        session_only_params:
          name:             [name]
          gender:           [gender]
          age:              [age]
          work_experience:  [work_experience]
          experience_years: [experience_years]
          job_nature:       [job_nature]
          help_needed:      [help_needed]
          # A returning caller's values live under stored_*; their own words
          # this call win, which is the order profile_resolve writes them in.
          location:         [location, stored_location]
          trade:            [trade, stored_trade]
        must_not_substitute: >
          Never invent profile fields. Each must come from the user
          or from the chosen profile's existing state (for update
          paths).
        on_failure: >
          ಕ್ಷಮಿಸಿ, ನಿಮ್ಮ ವಿವರಗಳು ಸೇವ್ ಆಗಲಿಲ್ಲ. ಇನ್ನೊಂದ್ಸಲ ಟ್ರೈ ಮಾಡ್ತೀನಿ.
        bridge_line: "ನಿಮ್ಮ ವಿವರಗಳನ್ನ ಸೇವ್ ಮಾಡ್ತಿದ್ದೀನಿ."
      # A save changes what fetch_profile returns, so drop its stored result.
      invalidates: [fetch_profile]

    - name: update_profile
      description: >
        Update the caller's existing profile. Pass ONLY the fields that are
        changing — the upstream merges them and leaves the rest alone. This
        is never a create: without a live profile there is nothing to
        update.

        Write the canonical ENGLISH value, never the caller's Kannada words:
        "Hubballi" not "ಹುಬ್ಬಳ್ಳಿ", "Data Entry Operator" not
        "ಡೇಟಾ ಎಂಟ್ರಿ". The job search matches on these, so a Kannada value
        saved here stops the caller's own profile finding them work.
        Canonical city names are the same ones job_match uses — Bengaluru,
        Mumbai, Chennai, Kolkata, Gurugram.
      input_schema:
        type: object
        properties:
          location: {type: string}
          trade: {type: string}
          work_experience: {type: string, description: "Fresher / Worked before / Returning after a break"}
          experience_years: {type: string}
          job_nature: {type: string}
          help_needed: {type: string}
        additionalProperties: false
        required: []
      invocation_rules:
        call_when: >
          The caller is in profile_update AND has said yes to the
          confirmation question naming what is changing. Send the fields
          that differ from their stored profile and nothing else. Never
          send age.

          profile_item_id is filled from session, not by you.
        must_not_substitute: >
          Never claim the profile was updated before you have read this
          tool's result.
        on_failure: >
          ಈಗ ಪ್ರೊಫೈಲ್ ಅಪ್‌ಡೇಟ್ ಮಾಡೋಕೆ ಆಗ್ತಿಲ್ಲ.
        bridge_line: "ನಿಮ್ಮ ಪ್ರೊಫೈಲ್ ಅಪ್‌ಡೇಟ್ ಮಾಡ್ತೀನಿ."
        max_calls_per_turn: 1
        consent_session_fields: [user_terms, user_privacy, profile_consent]
      # An update changes what fetch_profile returns, so drop its stored result.
      invalidates: [fetch_profile]

    - name: apply_job
      description: >
        Submit the job application linking the chosen profile to the
        selected job. Call only after a profile is chosen
        (profile_item_id and acting_as_user_id both known) and the
        user has explicitly confirmed they want to submit.
      input_schema:
        type: object
        properties:
          profile_item_id: {type: string}
          acting_as_user_id: {type: string}
          job_item_id: {type: string}
          role: {type: string}
          work_experience: {type: string}
          age: {type: integer}
        required: ["profile_item_id", "acting_as_user_id", "job_item_id", "role", "work_experience", "age"]
        additionalProperties: false
      invocation_rules:
        call_when: >
          User is in the apply_confirm subagent AND profile_item_id
          AND acting_as_user_id AND selected_job_item_id are all
          known AND the user has explicitly confirmed (yes) in the
          current turn. acting_as_user_id comes from fetch_profile's
          source_item_owner field (use_existing path) or from
          save_profile's user_id field (create_new / update_existing
          path).
        required_before_calling: [acting_as_user_id, profile_item_id, selected_job_item_id]
        # One application per turn, ENFORCED. The prompt says the same and the
        # model broke it twice: five apply_job calls from a single job pick
        # (three created), then two in another turn (both created). Each one is
        # an application at an employer the caller never chose, sent to a real
        # hiring manager with their name and number on it.
        max_calls_per_turn: 1
        consent_session_fields: [user_terms, user_privacy, profile_consent]
        # ENFORCED, not just described. Each of these must appear verbatim in a
        # tool result from this conversation or the call is refused before it
        # leaves us. `must_not_substitute` below has always asked for this in
        # prose and the model still broke it: on a live local call it sent
        # "ನಿಮ್ಮ ಅಪ್ಲಿಕೇಶನ್ ಈಗಾಗಲೇ ಹಾಕಿದೆ" — you have already applied.
        # The caller had not applied to anything.
        # Each param names the tools whose results may supply it. A bare list
        # ("came from ANY tool result") is not enough here: every identifier in
        # play is a UUID that appeared in some response, so the model can copy
        # one into another's slot and pass the check. Measured on a live
        # streaming call — apply_job went out with job_item_id ==
        # profile_item_id (both 343954ce-…), which the plain check allowed
        # because save_profile really had returned that value.
        grounded_params:
          job_item_id: [fetch_jobs]
          profile_item_id: [fetch_profile, save_profile]
          # acting_as_user_id is NOT listed: it is `source: session` now, so
          # the adapter injects it and it never appears in the schema the
          # model sees (get_tool_definitions keeps only source=agent params).
          # A param the model cannot supply cannot be invented, and guarding
          # it only risked refusing a value the adapter was about to replace.
        must_not_substitute: >
          Never submit without an explicit yes/confirm in the most
          recent user turn.
        on_failure: >
          ಕ್ಷಮಿಸಿ, ಅರ್ಜಿ ಕಳಿಸೋಕೆ ಆಗಲಿಲ್ಲ. ಇನ್ನೊಂದ್ಸಲ ಟ್ರೈ ಮಾಡ್ತೀನಿ.
        bridge_line: "ನಿಮ್ಮ ಅರ್ಜಿ ಕಳಿಸ್ತಿದ್ದೀನಿ."
    - name: connect_service
      description: >
        Send the caller's enquiry to the support organisation they chose,
        linking their profile to that organisation. Call only after a
        profile exists and the caller has confirmed in this turn.
      input_schema:
        type: object
        properties:
          profile_item_id: {type: string}
          acting_as_user_id: {type: string}
          service_item_id: {type: string}
        required: ["profile_item_id", "acting_as_user_id", "service_item_id"]
        additionalProperties: false
      invocation_rules:
        call_when: >
          User is in the connect_confirm subagent AND profile_item_id AND
          selected_service_item_id are known AND the caller has explicitly
          said yes in the current turn.
        required_before_calling: [profile_item_id, selected_service_item_id]
        max_calls_per_turn: 1
        consent_session_fields: [user_terms, user_privacy, profile_consent]
        grounded_params:
          service_item_id: [fetch_services]
          profile_item_id: [fetch_profile, save_profile]
        must_not_substitute: >
          Never send without an explicit yes in the most recent user turn.
        on_failure: >
          ಕ್ಷಮಿಸಿ, ನಿಮ್ಮ ಮಾತು ಅವರಿಗೆ ತಲುಪಿಸೋಕೆ ಆಗಲಿಲ್ಲ. ಇನ್ನೊಂದ್ಸಲ ಟ್ರೈ ಮಾಡ್ತೀನಿ.
        bridge_line: "ನಿಮ್ಮ ಮಾತನ್ನ ಅವರಿಗೆ ತಲುಪಿಸ್ತಿದ್ದೀನಿ."

  internal: []   # No knowledge_retrieval — KE not used in this domain.

preprocessing:
  language_normalisation:
    # OFF, deliberately. Turning this on locks the caller's language from
    # their FIRST turn and stores it on the persistent profile, so it follows
    # them into later calls. Almost everyone opens with "hello" regardless of
    # the language they actually want, which would pin Kannada speakers to
    # English for the whole conversation and every conversation after it.
    # Rejected on that basis; measured and working otherwise.
    #
    # With this off the main LLM is told to mirror the caller's language per
    # turn (manager_agent.build_system_prompt, the empty detected_language
    # branch) — no lock, no stored preference, so a caller who opens in
    # English and continues in Kannada is followed rather than pinned.
    #
    # Revisit if the lock moves to session scope, or if min_detection_tokens
    # can be raised so one-word openers fall through to the default instead
    # of deciding the call.
    enabled: false
    provider: openai
    model: gpt-4.1-mini-2025-04-14
    default_language: kannada
    supported_languages: [english, kannada]
    transliteration: true
    code_switching: true

  nlu_processor:
    # NLU runs on the same OpenAI model as the rest of the stack, which is
    # the configuration the journey was validated on.
    provider: openai
    model: gpt-4.1-mini-2025-04-14
    user_state_confidence_threshold: 0.4

    signal_intents:
      pay_disappointment: objection
      distance_issue: constraint
      counsellor_request: escalation_signal

    # human: the caller wants a person ("ಮನುಷ್ಯರ ಜೊತೆ ಮಾತಾಡಿಸಿ") — derives human_request below.
    # identity: who/what the assistant is ("ನೀವು ಯಾರು?") — answered from the <identity> block.
    topics: [job_details, salary, location, search, profile, process, identity, human, language, services, other]
    abandons_offered_acts: [request_change]
    signals: [pay_disappointment, distance_issue, counsellor_request]
    slots:
      consent_response: { type: enum, values: [granted, declined], accept_when_pending: [consent],
                          description: "ವಿವರಗಳನ್ನ ಸೇವ್ ಮಾಡೋ ಅನುಮತಿಗೆ ಉತ್ತರ" }
      # 5–99, not adult-only: the u18_blocked route must see under-age answers.
      # Also accepted while consent is pending: callers often give age in the same breath.
      # The Hindi "un-" numerals (one-less-than-the-next-ten) read ten years high
      # without an example: measured against UAT, Hindi 29 stored as 39 and
      # Hindi 39 as 49, four times out of four, while 19, 49 and 59
      # were correct. Both failures are +10, so the U18 gate is never fooled,
      # but a 29-year-old is filed as 39. The two that fail are listed here.
      # KN: Kannada has no "un-" form (29 = ಇಪ್ಪತ್ತೊಂಬತ್ತು, twenty + nine), but the
      # -ಒಂಬತ್ತು (nine) compounds are the analogous risk, so 29 and 39 stay as
      # the examples. Not yet measured on Kannada.
      age:              { type: int, min: 5, max: 99, accept_when_pending: [consent, age],
                          description: "ವಯಸ್ಸು, digits ನಲ್ಲಿ",
                          examples: ["ಇಪ್ಪತ್ತೆರಡು → 22", "ಹದಿನಾರು → 16", "ಇಪ್ಪತ್ತೊಂಬತ್ತು → 29", "ಮೂವತ್ತೊಂಬತ್ತು → 39"] }
      trade:            { type: string, normalise: title, description: "ಕೆಲಸ/ಟ್ರೇಡ್, English ನಲ್ಲಿ (Welder, Plumber). Only a concrete trade; vague answers (ಏನಾದ್ರೂ, ಯಾವ ಕೆಲಸ ಆದ್ರೂ) → omit. A request for HELP is not a trade — ಟ್ರೈನಿಂಗ್, ಕೋರ್ಸ್, ಸಹಾಯ, ಕಲಿಸೋದು all → omit, they are the services topic" }
      location:         { type: string, normalise: title, description: "ಊರು/ಸಿಟಿ, canonical English (Bengaluru, Hubli). Only a named place; vague answers (ಹತ್ತಿರ ಎಲ್ಲಾದ್ರೂ, ಎಲ್ಲಿ ಆದ್ರೂ, ಬೇರೆ ಊರು) → omit" }
      name:             { type: string, description: "caller ಹೆಸರು" }
      gender:           { type: enum, values: [male, female, other] }
      work_experience:  { type: enum, values: [Fresher, Worked before, Returning after a break] }
      experience_years: { type: int, min: 0, max: 60 }
      job_nature:       { type: enum, values: [Internship, Apprenticeship, Full-time, Flexible] }
      monthly_in_hand:  { type: int, min: 0, max: 1000000 }
      language_preference: { type: enum, values: [english, kannada], description: "ಯಾವ ಭಾಷೆಯಲ್ಲಿ ಮಾತಾಡಬೇಕು" }
    known_fields: [consent_response, age, trade, location, name, stored_trade, stored_location]
    examples:
      - { pending: closing_offer, caller: "ಸರಿ ಧನ್ಯವಾದ", out: { acts: [acknowledge], relation: answers_pending } }
      - { pending: close_confirm, caller: "ಹೌದು ರೀ", out: { acts: [affirm], relation: answers_pending } }
      - { pending: close_confirm, caller: "ಸರಿ", out: { acts: [affirm], relation: answers_pending } }
      - { pending: close_confirm, caller: "ಸರಿ ಧನ್ಯವಾದ", out: { acts: [affirm], relation: answers_pending } }
      - { pending: close_confirm, caller: "ಹಾ ಸರಿ", out: { acts: [affirm], relation: answers_pending } }
