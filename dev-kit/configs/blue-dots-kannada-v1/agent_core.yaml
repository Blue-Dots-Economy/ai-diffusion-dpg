      - { pending: consent, caller: "ಹೌದು ರೀ ಸರಿ", out: { acts: [affirm], relation: answers_pending, slots: { consent_response: granted } } }
      - { pending: consent, caller: "ಇಲ್ಲ, ಸೇವ್ ಮಾಡಬೇಡಿ", out: { acts: [deny], relation: answers_pending, slots: { consent_response: declined } } }
      - { pending: select_job, caller: "ಹಾ ಹುಡುಕಿ", out: { acts: [affirm], relation: answers_other } }
      - { pending: age, caller: "ಇಪ್ಪತ್ತೆರಡು ವರ್ಷ", out: { acts: [provide_info], relation: answers_pending, slots: { age: 22 } } }
      - { pending: age, caller: "ವೆಲ್ಡಿಂಗ್ ಕೆಲಸ ಬೇಕು", out: { acts: [provide_info], relation: answers_other, slots: { trade: Welder } } }
      - { pending: select_job, caller: "ಎಲೆಕ್ಟ್ರಿಷಿಯನ್ ಅಲ್ಲ, ವೆಲ್ಡರ್", out: { acts: [correct], relation: answers_other, slots: { trade: Welder } } }
      - { pending: select_job, caller: "ಫ್ಲಿಪ್‌ಕಾರ್ಟ್‌ದು", out: { acts: [select], relation: answers_pending, reference: { option: 1, spoken: "ಫ್ಲಿಪ್‌ಕಾರ್ಟ್‌ದು" } } }
      - { pending: select_job, caller: "ಎರಡನೇದರ ಬಗ್ಗೆ ಹೇಳಿ", out: { acts: [select], relation: answers_pending, reference: { option: 2, spoken: "ಎರಡನೇದರ" } } }
      - { pending: submit_confirm, caller: "ಇಲ್ಲ, ಮೂರನೇದು ಹೇಳಿ", out: { acts: [deny, select], relation: answers_pending, reference: { option: 3, spoken: "ಮೂರನೇದು" } } }
      - { pending: age, caller: "ಸಂಬಳ ಎಷ್ಟು", out: { acts: [ask], relation: new_topic, topic: salary } }
      # Declining jobs is not a goodbye; `close` would end the call.
      - { pending: use_saved_details, caller: "ನನಗೆ ಜಾಬ್ ಬೇಡ", out: { acts: [deny], relation: new_topic, topic: services } }
      - { pending: trade, caller: "ನನಗೆ ಕೆಲಸ ಬೇಡ", out: { acts: [deny], relation: new_topic, topic: services } }
      - { pending: location, caller: "ಕೆಲಸ ಹುಡುಕೋದು ಬೇಡ", out: { acts: [deny], relation: new_topic, topic: services } }
      - { pending: select_job, caller: "ನನಗೆ ಯಾವ ಜಾಬ್ ಕೂಡ ಬೇಡ", out: { acts: [deny], relation: new_topic, topic: services } }
      - { pending: select_job, caller: "ಆಮೇಲೆ ಮಾತಾಡ್ತೀನಿ", out: { acts: [close], relation: new_topic } }
      # A goodbye is a goodbye wherever it lands. Without these, a caller
      # leaving part-way through was read as `acknowledge` against whatever
      # question was pending — the close never reached the termination gate,
      # the call carried on asking for a trade, and the line stayed open until
      # the silence timeout. "ಧನ್ಯವಾದ" alone is an acknowledgement; "ಧನ್ಯವಾದ"
