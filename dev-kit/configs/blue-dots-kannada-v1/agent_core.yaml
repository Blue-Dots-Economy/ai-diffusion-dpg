      - { pending: submit_confirm, caller: "ಸರಿ ಧನ್ಯವಾದ", out: { acts: [affirm], relation: answers_pending } }
      - { pending: submit_confirm, caller: "ಧನ್ಯವಾದ", out: { acts: [acknowledge], relation: unclear } }
      - { pending: submit_confirm, caller: "ಓಕೆ ಧನ್ಯವಾದ", out: { acts: [affirm], relation: answers_pending } }
      - { pending: submit_confirm, caller: "ಆಯ್ತು ಸರಿ, ಧನ್ಯವಾದ", out: { acts: [affirm], relation: answers_pending } }
      - { pending: submit_confirm, caller: "ಇಲ್ಲ ಇಲ್ಲ, ಎರಡನೇದು", out: { acts: [correct, select], relation: answers_pending, reference: { option: 2, spoken: "ಎರಡನೇದು" } } }
      - { pending: submit_confirm, caller: "ಬೇರೆ ಏನಾದ್ರೂ ಜಾಬ್ ಇದೆಯಾ", out: { acts: [request_change], relation: new_topic, topic: search } }
