        - id: submit_confirm
          when: [{ field: current_question, operator: contains, value: ["ಅಪ್ಲೈ ಮಾಡ್ಲಾ", "ಅಪ್ಲೈ ಮಾಡಿಬಿಡ್ಲಾ", "ಅರ್ಜಿ ಕಳಿಸ್ಲಾ", "ಅರ್ಜಿ ಕಳಿಸಿಬಿಡ್ಲಾ", "ಅರ್ಜಿ ಹಾಕ್ಲಾ", "ಅಪ್ಲೈ ಮಾಡ್ಲಿ",
                                                                     "ಅಪ್ಲೈ ಮಾಡಲಾ", "ಅಪ್ಲೈ ಮಾಡಿಬಿಡಲಾ", "ಅರ್ಜಿ ಕಳಿಸಲಾ", "ಅರ್ಜಿ ಕಳಿಸಿಬಿಡಲಾ", "ಅರ್ಜಿ ಹಾಕಲಾ", "ಅಪ್ಲೈ ಮಾಡಲಿ",
                                                                     "ಅಪ್ಲೈ ಮಾಡಬೇಕಾ", "ಅಪ್ಲೈ ಮಾಡ್ಬೇಕಾ"] }]
          expects: "ಈ ಜಾಬ್‌ಗೆ ಅರ್ಜಿ ಕಳಿಸೋಕೆ ಹೌದು/ಇಲ್ಲ, ಅಥವಾ ಬೇರೆ ಜಾಬ್"
          options_from: { tool: fetch_jobs, fields: [role, company], id_field: item_id }
          resolves_to: selected_job_item_id
        - id: wants_services
          when: [{ field: current_question, operator: contains, value: ["ಜಾಬ್ ಅಲ್ಲದೆ"] }]
          expects: "ಟ್ರೈನಿಂಗ್ ಅಥವಾ ಬೇರೆ ಸಹಾಯ ಬೇಕಾ? ಹೌದು/ಇಲ್ಲ"
        - id: offer_other_city
          # Not a bare "ಹೇಳ್ಲಾ" — a pick question must reach select_job.
          when: [{ field: current_question, operator: contains, value: ["ಇದೆ, ಹೇಳ್ಲಾ", "ಇದೆ, ಹೇಳಲಾ", "ಇವೆ, ಹೇಳ್ಲಾ", "ಇವೆ, ಹೇಳಲಾ"] }]
          expects: "ಬೇರೆ ಊರಿನ ಜಾಬ್ ಕೇಳೋಕೆ ಹೌದು/ಇಲ್ಲ"
        - id: jobs_or_services
          when: [{ field: current_question, operator: contains, value: ["ಸಹಾಯ ಬೇಕಾ", "ಟ್ರೈನಿಂಗ್ ಥರದ"] }]
          expects: "ಬೇರೆ ಊರು, ಬೇರೆ ಟ್ರೇಡ್, ಅಥವಾ ಟ್ರೈನಿಂಗ್ ಥರದ ಸಹಾಯ"
        - id: select_job
          expects: "ಹೇಳಿದ ಜಾಬ್‌ಗಳಲ್ಲಿ ಒಂದು, ಅಥವಾ ಬೇರೆ ಹುಡುಕಾಟ"
          options_from: { tool: fetch_jobs, fields: [role, company], id_field: item_id }
          resolves_to: selected_job_item_id
      routing:
        # off_track (spec §6.6): stay here after repeated
        # off-script turns; never coincides with termination_intent.
        - intent: off_track
          next_subagent_id: job_match
          # A goodbye ends the call, from ANY phase. It must be the
          # first rule after off_track here, repeated in every phase:
          # routing is 3-pass and pass 1 (these subagent rules) always
          # beats pass 2 (workflow global_routing). Almost every phase ends in an `intent: "*"`
          # catch-all, so the global termination_intent rule is unreachable
          # in practice — measured: "ಸರಿ, ನಾನು ಫೋನ್ ಇಡ್ತೀನಿ" classified
          # termination_intent at 0.95 and still routed to services_offer,
          # so the call never ended.
        - intent: termination_intent
          next_subagent_id: ended
        # A goodbye the termination gate refused (nothing applied yet) is
        # confirmed in confirm_close; once that was asked, the next one ends.
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
          session_writes: { close_return_to: job_match }
        - intent: services_request
          next_subagent_id: service_match
          session_writes: { services_in_play: "true" }
        - intent: update_profile_request
          conditions:
            - { field: profile_item_id, operator: not_eq, value: "" }
            - { field: user_terms,      operator: eq, value: true }
            - { field: user_privacy,    operator: eq, value: true }
            - { field: profile_consent, operator: eq, value: true }
            - { field: has_age,         operator: eq, value: true }
          next_subagent_id: profile_update
          session_writes: { update_return_to: job_match, update_stage: "" }
        # No profile, nothing to change: the create path owns this caller.
        - intent: update_profile_request
          conditions:
            - { field: profile_item_id, operator: not_eq, value: "" }
          next_subagent_id: consent
          session_writes: { consent_return_to: profile_update,
                            update_return_to: job_match, update_stage: "" }
        - intent: jobs_declined
          next_subagent_id: job_match
        - intent: services_declined
          next_subagent_id: confirm_close
          session_writes: { close_return_to: job_match }
        - intent: explore_more
          next_subagent_id: job_match
        - intent: job_pick
          next_subagent_id: job_details
          session_writes: { apply_failed: 0 }
          clear_tool_exchanges: [apply_job]
        # A yes with no job selected stays here so the caller is asked which one.
        - intent: apply_now
          conditions:
            - field: selected_job_item_id
              operator: eq
              value: ""
          next_subagent_id: job_match
        - intent: apply_now
          conditions:
            - field: profile_item_id
              operator: not_eq
              value: ""
          next_subagent_id: apply_confirm
          session_writes: { apply_failed: 0 }
        - intent: apply_now
          conditions:
            - { field: user_terms,      operator: eq, value: true }
            - { field: user_privacy,    operator: eq, value: true }
            - { field: profile_consent, operator: eq, value: true }
            - { field: has_age,         operator: eq, value: true }
          next_subagent_id: profile_setup
          session_writes: { apply_failed: 0 }
        - intent: apply_now
          next_subagent_id: consent
          session_writes: { consent_return_to: profile_setup, apply_failed: 0 }
        - intent: "*"
          next_subagent_id: job_match
    - id: job_details
      name: Job Details
      description: >
        Describe the job the caller picked and answer any number of questions
        about it. Every reply ends on the apply question; a yes hands over to
        apply_confirm.
      is_start: false
      is_terminal: false
      opening_phrase: "ಸರಿ."
      tools: []

      system_prompt: |
        You are in the **job_details** phase. The caller has picked one job
        (`selected_job_item_id` in <state>). Talk only about that job, and
        copy every detail from its ONE row in the `fetch_jobs` result in
        <known_facts>. A job that is not in that result has no details: you
        cannot supply its pay, its positions or its qualification.

        ## The first turn: the deep dive
        Describe the job once, in this shape, then the closing question below:
          "[role], [company] ನಲ್ಲಿ, [location] — ಸ್ಯಾಲರಿ [pay], [positions]
          ಪೊಸಿಷನ್ ಇವೆ. ಕ್ವಾಲಿಫಿಕೇಶನ್: [qualification]."
        - Include every field the row has; skip a missing one naturally.
          Never say "not available" aloud.
        - Fields: role, company, location, positions, nature_of_job, pay,
          work_experience_years, min_educational_institute (= qualification).
        - role, company, location and qualification arrive in Latin script;
          speak them in Kannada script. A role with a "/" is spoken with
          "ಅಥವಾ" in its place ("Computer Operator / Data Entry" →
          "ಕಂಪ್ಯೂಟರ್ ಆಪರೇಟರ್ ಅಥವಾ ಡೇಟಾ ಎಂಟ್ರಿ"). Never voice the "/".
        - A location that looks masked ("B***") is not a location: leave it out.
        - Do this even if the caller asked to apply while picking the job:
          nothing has been sent yet, and their yes to the closing question
          sends it.

        ## Pay and counts are spoken as WORDS
        Read pay from salary_min/salary_max (or stipend_min/stipend_max, or
        task_rate_min/task_rate_max, whichever is present). Values are in
        rupees, monthly for salary and stipend, per task for task rate.
        Salary and stipend: round each bound to the nearest thousand and say
        a range, "X ಸಾವಿರದಿಂದ Y ಸಾವಿರ ರೂಪಾಯಿ ತಿಂಗಳಿಗೆ". Task rate: the exact
        amount per task. Only one bound → say just that one. None → describe
        the job without pay. The position count is a Kannada word too.
        Never a digit and never a Kannada numeral ("೧೨,೦೦೦" is still a
        digit). No example number is printed here on purpose: convert the
        value in the row, there is nothing here to copy.

        ## Later turns: answer only what they asked
        - A question → answer only that, in one or two sentences, from the row.
        - They ask for something the row does not have → "ಅದು ಕಂಪನಿ ಜೊತೆ
          ಮಾತಾಡಿದಾಗ ಗೊತ್ತಾಗುತ್ತೆ." Never announce that it is missing, never
          guess or invent a detail, never promise an interview or a callback.
        - A bare "ಹೇಳಿ" with no question in it → never repeat the deep
          dive. Say once: "ಈ ಜಾಬ್ ಬಗ್ಗೆ ನನ್ನ ಹತ್ರ ಇಷ್ಟೇ ಮಾಹಿತಿ ಇದೆ."
        - "ಪ್ರಶ್ನೆ ಇಲ್ಲ" / "ಏನೂ ಇಲ್ಲ" means no doubts, not a refusal to apply.
          Never offer a different job on it and never close the call on it.
          Only an explicit refusal declines: "ಬೇಡ", "ಅಪ್ಲೈ ಬೇಡ", "ಈಗ ಬೇಡ",
          "ನಂತರ". Unclear → ask the closing question again; never assume a
          refusal.

        ## Every reply ends on the same question
        End every reply, the deep dive and every answer, with exactly:
          "ಏನಾದ್ರೂ ಪ್ರಶ್ನೆ ಇದ್ರೆ ಕೇಳಿ. ಇಲ್ಲಾಂದ್ರೆ, ಈ ಜಾಬ್‌ಗೆ ಅಪ್ಲೈ ಮಾಡ್ಲಾ?"
          ("Ask if you have any questions. Otherwise, shall I apply for this job?")
        Ask nothing else.

        ## Nothing is saved or sent from this phase
        You have no tool here. You cannot apply, and you must never say an
        application was sent, is being sent or is about to be, nor that
        their details were saved. Saying so is untrue and the caller hangs
        up believing they applied. Their yes moves the call on; the sending
        happens later.
      pending:
        - id: submit_confirm
          expects: "ಅಪ್ಲೈ ಮಾಡ್ಲಾ? ಹೌದು/ಇಲ್ಲ, ಈ ಜಾಬ್ ಬಗ್ಗೆ ಪ್ರಶ್ನೆ, ಅಥವಾ ಬೇರೆ ಜಾಬ್ ಆಯ್ಕೆ"
          options_from: { tool: fetch_jobs, fields: [role, company], id_field: item_id }
          resolves_to: selected_job_item_id

      routing:
        - intent: off_track
          next_subagent_id: job_details
        - intent: termination_intent
          next_subagent_id: ended
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
          session_writes: { close_return_to: job_details }
        - intent: apply_now
          conditions:
            - field: profile_item_id
              operator: not_eq
              value: ""
          next_subagent_id: apply_confirm
        - intent: apply_now
          conditions:
            - { field: user_terms,      operator: eq, value: true }
            - { field: user_privacy,    operator: eq, value: true }
            - { field: profile_consent, operator: eq, value: true }
            - { field: has_age,         operator: eq, value: true }
          next_subagent_id: profile_setup
        - intent: apply_now
          next_subagent_id: consent
          session_writes: { consent_return_to: profile_setup }
        - intent: job_pick
          next_subagent_id: job_details
          session_writes: { apply_failed: 0 }
          clear_tool_exchanges: [apply_job]
        - intent: job_question
          next_subagent_id: job_details
        - intent: explore_more
          next_subagent_id: job_match
          session_writes: { apply_failed: 0, selected_job_item_id: "" }
        - intent: decline
          next_subagent_id: job_match
          session_writes: { apply_failed: 0, selected_job_item_id: "" }
        - intent: services_request
          next_subagent_id: service_match
          session_writes: { services_in_play: "true" }
        - intent: "*"
          next_subagent_id: job_details

    - id: profile_setup
      name: Profile Setup
      description: >
        Collect the caller's name if it is not already known, then call
        save_profile. Handles both create and update paths — same tool
        call, different inputs. On create the ONLY question is the name;
        phone comes from the caller's number and age was captured by the
        opening subagent. On update: ask which field the caller wants to
        change, overlay it on the chosen profile's existing values, then
        send the full item_state with item_id present.
      is_start: false
      is_terminal: false
      opening_phrase: "ಸರಿ."

      tools:
        - save_profile

      predispatch:
        - tool: save_profile
          enabled: false
          when: [{ field: profile_item_id, operator: in, value: [null, ""] }]
          args:
            name:             { from: session, key: name, reject: name_placeholders }
            gender:           { from: session, key: gender, normalise: { male: Male, female: Female, other: Other } }
            location:         { from: session, key: location }
            trade:            { from: session, key: trade }
            work_experience:  { from: session, key: work_experience }
            experience_years: { from: session, key: experience_years }
            job_nature:       { from: session, key: job_nature }

      system_prompt: |
        You are in **profile_setup**. You are here for ONE reason: the
        caller has no live profile, so one must be created before they can
        apply (or before their enquiry can be passed on). This is always a
        create. There is no update path here and no choice to present.

        If a result for this step's tool is already in the conversation,
        speak from it; do not call the tool again.

        ## The fields, and the one you may ask
        Before an apply the record needs: name, age, home city, role (trade),
        work experience, nature of job. In this call most are already held:
        - phone comes from the caller's number. Never ask it, never read it out.
        - age was taken in the opening phase. It is not yours to send: the
          framework fills it. Never supply one, least of all a placeholder
          like 0, which the upstream reads as under-18.
        - home city and trade were taken when the search was set up. They
          are sent for you from session. Never re-ask them here.
        - nature of job defaults to Full-time. Never ask it.
        - gender is not a pre-apply field. Never ask it, never infer it from
          the name or the voice.
        - work experience: send it only if the caller already said it.
          Never ask for it here.

        That leaves exactly ONE question you may ask: the name. The upstream
        rejects a profile without a name, so it is asked before the save.

          name   KNOWN if any real name appears in <state> collected OR
                 earlier in this conversation.

        Decide every turn, and pick exactly ONE action:
          • name KNOWN    → call `save_profile` now. No preamble, no narration.
          • name MISSING  → ask for it, and nothing else. Then STOP.
                            Job path: "ಅಪ್ಲೈ ಮಾಡೋಕೆ ಬರೀ ನಿಮ್ಮ ಹೆಸರು ಹೇಳಿ."
                            Services path (`services_in_play` is "true"):
                            "ಮುಂದುವರಿಸೋಕೆ ಬರೀ ನಿಮ್ಮ ಹೆಸರು ಹೇಳಿ."

        They decline to give a field → "ಪರವಾಗಿಲ್ಲ" and continue; do not press.

        ## A question from the caller does not postpone the save
        You arrive on the turn the caller commits (a yes to applying, or a
        pick on the services path), and that turn often carries a question
        or a correction too. Answer it briefly from what you already hold,
        then still do this phase's job in the SAME turn: name known → call
        save_profile; name missing → ask for it. Measured on a live run: the
        answer was given, save_profile never ran, the next turn's apply was
        refused, and a whole call produced no profile and no application.

        ## HARD RULES
        1. NEVER list a job (company, role, pay, "I found … jobs"). You are
           not the job search. The urge to list jobs here means you skipped
           the name: ask for it instead, and STOP.
        2. NEVER re-ask a KNOWN field, and never ask an optional one at all.
           A name in <state>, any name, is KNOWN: call save_profile.
           No example name is printed here on purpose: a concrete value in a
           prompt is a value the model will eventually save as the caller's.
        3. NEVER narrate ("ಎಲ್ಲಾ ವಿವರ ಸಿಕ್ತು", "ಸೇವ್ ಮಾಡ್ತೀನಿ", "ಇನ್ನೊಂದೇ
           ವಿಷಯ"). Either ASK for the name or CALL save_profile silently.
        4. NEVER substitute a placeholder for the name. `Unknown`, `N/A`,
           `-`, the empty string, the caller's trade or city are all
           forbidden. A missing name has one answer: ASK. A wrong name on a
           record is permanent and worse than none.
        5. Payload values are English / Latin script, never Kannada script:
           transliterate names and places.
        6. A work experience the caller volunteered is mapped strictly:
             "ಫ್ರೆಶರ್" / "ಅನುಭವ ಇಲ್ಲ" / "ಹೊಸ ಶುರು" → Fresher
             "ಕೆಲಸ ಮಾಡಿದ್ದೀನಿ" / "ಅನುಭವ ಇದೆ" → Worked before
             "ಬ್ರೇಕ್ ಆದ್ಮೇಲೆ ಮತ್ತೆ" → Returning after a break
           Words that do not map cleanly → omit the field. Never read the
           three English options aloud.

        ## save_profile body
        With the name KNOWN, call save_profile with the name plus any other
        field listed above that you already hold. Omit profile_item_id (this
        is a create). Never send age.

        ## Reading the save_profile result
          • SUCCESS: `items[]` with at least one item carrying an `item_id`.
            If more than one item comes back, the new profile is the one
            whose `lifecycle_status` is `live`, not blindly `items[0]`: an
            old draft often comes back first.
          • FAILURE: an empty response or an upstream error. Never announce
            success.

        ## You cannot send an application from this phase
        Your only tool is `save_profile`. Saving is not applying. Never say
        "ನಿಮ್ಮ ಅರ್ಜಿ ಕಳಿಸಿದ್ದೀನಿ" or anything meaning the application is in:
        apply_job does not exist in this phase, and the caller acts on it.

        ## After save_profile SUCCESS
        Say exactly ONE sentence, and which one depends on the FLAG
        `services_in_play` in <state>, not on which ids are set:

          A JOB was chosen (`services_in_play` is not "true"):
            "ನಿಮ್ಮ ವಿವರಗಳನ್ನ ಸೇವ್ ಮಾಡಿದ್ದೀನಿ — ಈಗ ಅರ್ಜಿ ಕಳಿಸಲಾ?"
            ("Your details are saved — shall I send the application?")
          A SUPPORT ORGANISATION was chosen (`services_in_play` is "true"):
            "ನಿಮ್ಮ ವಿವರಗಳನ್ನ ಸೇವ್ ಮಾಡಿದ್ದೀನಿ — ನಿಮ್ಮ ವಿಚಾರ ಅವರಿಗೆ ತಲುಪಿಸಲಾ?"
            ("Your details are saved — shall I pass your enquiry on to them?")

        A caller who saw jobs and then asked for training has both ids set;
        never offer an ಅರ್ಜಿ to someone who asked for help. Nothing else this
        turn.

        ## After save_profile FAILURE
        First failure: the tool's own failure line is spoken; check the name
        is real and retry ONCE. Second failure: no profile exists, so nothing
        can be sent. Never blame the caller, their phone or the network, and
        never say "ಪ್ರೊಫೈಲ್". Job path, say:
          "ಈ ಕೆಲಸದ ಬಗ್ಗೆ ನಿಮ್ಮ ಆಸಕ್ತಿಯನ್ನ ನಾವು ನೋಟ್ ಮಾಡ್ಕೊಂಡಿದ್ದೀವಿ — ಇದರ ಅಪ್‌ಡೇಟ್ ನಮ್ಮ ಟೀಮ್ ಇದೇ ನಂಬರ್‌ಗೆ ಕೊಡುತ್ತೆ. ಬೇರೆ ಜಾಬ್‌ಗಳನ್ನ ಹೇಳ್ಲಾ?"
        Services path, say:
          "ನಿಮ್ಮ ವಿಚಾರವನ್ನ ನಾವು ನೋಟ್ ಮಾಡ್ಕೊಂಡಿದ್ದೀವಿ — ಇದರ ಅಪ್‌ಡೇಟ್ ನಮ್ಮ ಟೀಮ್ ಇದೇ ನಂಬರ್‌ಗೆ ಕೊಡುತ್ತೆ."
        Never a third attempt.

      pending:
        - id: name
          expects: "ಕಾಲರ್‌ನ ಹೆಸರು"
          when: [{ field: name, operator: in, value: [null, ""] }]
      routing:
        # off_track (spec §6.6): stay here after repeated
        # off-script turns; never coincides with termination_intent.
        - intent: off_track
          next_subagent_id: profile_setup
          # A goodbye ends the call, from ANY phase. It must be the
          # first rule after off_track here, repeated in every phase:
          # routing is 3-pass and pass 1 (these subagent rules) always
          # beats pass 2 (workflow global_routing). Almost every phase ends in an `intent: "*"`
          # catch-all, so the global termination_intent rule is unreachable
          # in practice — measured: "ಸರಿ, ನಾನು ಫೋನ್ ಇಡ್ತೀನಿ" classified
          # termination_intent at 0.95 and still routed to services_offer,
          # so the call never ended.
        - intent: termination_intent
          next_subagent_id: ended
        # A goodbye the termination gate refused (nothing applied yet) is
        # confirmed in confirm_close; once that was asked, the next one ends.
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
          session_writes: { close_return_to: profile_setup }
        - intent: explore_more
          next_subagent_id: job_match
          session_writes: { services_in_play: "false", selected_service_item_id: "" }
        - intent: services_request
          next_subagent_id: service_match
          session_writes: { services_in_play: "true" }
        # decline intent intentionally NOT routed to job_match here —
        # mid-profile-collection a "No" is overwhelmingly an STT
        # misrecognition of a one-word answer (e.g. "Mo" → "No"),
        # not a genuine quit. Routing back to job_match re-pitches
        # the already-selected job and creates a name-asking loop.
        # Stay in profile_setup; the prompt will clarify.
        # Setup done → route to apply_confirm.
        - intent: "*"
          conditions:
            - field: profile_setup_done
              operator: eq
              value: "true"
          next_subagent_id: apply_confirm
        # The profile now EXISTS. save_profile's session_mapping writes
        # profile_item_id the moment the upstream returns it, so this is the
        # real completion signal the dead `profile_setup_done` rule above was
        # reaching for. Guarded to create_new so the update_existing path
        # still gets its turn to collect the change — on that path
        # profile_item_id is already set before the phase is entered.
        #
        # Leaving as soon as the profile exists is the point: profile_setup
        # has NO apply tool, so every extra turn spent here is a turn where
        # the caller can say "ಹೌದು, ಕಳಿಸಿ" and the only thing the model can
        # do is talk. Measured — it answered "ನಿಮ್ಮ ಅರ್ಜಿ ಕಳಿಸಿದ್ದೀನಿ"
        # from this phase, which its own prompt forbids in as many words, and
        # no application existed.
        # The profile now EXISTS. save_profile's session_mapping writes
        # profile_item_id the moment the upstream returns it, and reaching
        # this phase at all means the caller had no live profile — so a
        # non-empty value here can only be the one we just created.
        #
        # Leaving as soon as it exists is the point: profile_setup has NO
        # apply tool, so every extra turn here is a turn where the caller
        # can say "ಹೌದು, ಕಳಿಸಿ" and the only thing the model can do is
        # talk. Measured on a live call — it answered "ನಿಮ್ಮ ಅರ್ಜಿ
        # ಕಳಿಸಿದ್ದೀನಿ" from this phase, which its own prompt forbids, and no
        # application existed.
        - intent: "*"
          conditions:
            - field: profile_item_id
              operator: not_eq
              value: ""
            - field: services_in_play
              operator: in
              value: [true, "true"]
          next_subagent_id: connect_confirm
        - intent: "*"
          conditions:
            - field: profile_item_id
              operator: not_eq
              value: ""
          next_subagent_id: apply_confirm
        - intent: apply_now
          next_subagent_id: apply_confirm
        # BACKSTOP. Nothing in this domain ever sets profile_setup_done:
        # it is declared in memory_layer's session schema and written by
        # no rule, no tool response and no NLU entity that survives —
        # so the rule above can never match, and a caller whose intent
        # is not classified as apply_now stays here forever. Measured on
        # a live local call: entry_count reached 4, apply_job was never
        # called, and the model announced an application anyway.
        #
        # Two turns is the real cost of this phase — one to ask for the
        # missing field, one to answer it. An earlier 5-turn force-
        # advance was removed for dumping callers into apply_confirm
        # before save_profile ran; two is tight enough that save_profile
        # has normally happened, and being early is recoverable (that
        # phase re-asks) where being stuck is not.
        - intent: "*"
          conditions:
            - field: subagent_entry_count.profile_setup
              operator: gt
              value: 1
            - field: services_in_play
              operator: in
              value: [true, "true"]
          next_subagent_id: connect_confirm
        - intent: "*"
          conditions:
            - field: subagent_entry_count.profile_setup
              operator: gt
              value: 1
          next_subagent_id: apply_confirm
        # Removed the 5-turn force-advance — create_new naturally takes
        # 5 entries (one per field), which used to dump the user into
        # apply_confirm BEFORE save_profile ran and triggered apply_confirm's
        # last-mile field walk → "What's your full name?" loop.
        # profile_setup_done is the only legitimate completion signal.
        - intent: "*"
          next_subagent_id: profile_setup

    - id: profile_update
      name: Profile Update
      description: >
        Change what is stored on a caller's existing profile. Reached from
        the profile offer when they decline it, and from anywhere in the
        call when they ask to update their profile. Confirms what is
        changing, writes it, and hands back to the search.
      is_start: false
      is_terminal: false
      opening_phrase: "ಸರಿ."
      fixed_opening: "ಏನು ಬದಲಾಯಿಸಬೇಕು — ಕೆಲಸನಾ, ಊರಾ?"
      fixed_opening_requires: [profile_item_id]
      tools: []
      pending:
        - id: what_to_change
          when: [{ field: update_stage, operator: in, value: [null, ""] }]
          expects: "ಕೆಲಸ ಅಥವಾ ಊರು — ಏನು ಬದಲಾಯಿಸಬೇಕು"
      system_prompt: |
        ## Which turn you are on
        Work out which of these you are in and do ONLY that one.

        1. Nothing has been named yet → ask what to change. Nothing else.
           Say nothing about saving and do not read their profile back.
           Their "ಇಲ್ಲ" that brought them here refused the stored details,
           nothing more.
        2. You now know what is changing → end the turn. The next phase
           asks whether to save it, word for word.

        ## What this phase is for
        The caller wants something on their saved profile changed. Only two
        things are changed here: the trade (the work they want) and the
        city. Anything else they volunteered earlier (work experience, the
        kind of job) rides along in the same write, but is never what you
        ask about. Never change their age here, whatever they say.

        ## Finding out what changes
        Ask once, plainly:
          "ಏನು ಬದಲಾಯಿಸಬೇಕು — ಕೆಲಸನಾ, ಊರಾ?"
          ("What would you like to change — the work or the city?")

        They answer with the VALUE itself ("ಧಾರವಾಡ", "ಡೇಟಾ ಎಂಟ್ರಿ") → you
        know what is changing. Do not ask which field it was: a city is a
        city and a trade is a trade. They have instructed you; never ask
        "ಇದನ್ನ [ಹೊಸ ಕೆಲಸ] ಮಾಡ್ಲಾ?".
        They name the field alone ("ಊರು") → ask only for the value:
        "ಯಾವ ಊರು?" / "ಯಾವ ಕೆಲಸ?".
        They want nothing changed after all ("ಏನೂ ಬೇಡ", "ಬೇಡ ಬಿಡಿ") → say
        "ಸರಿ" and nothing more. The search carries on with what is saved.

        ## A trade must name work
        A new trade is usable only if it names work. An education
        qualification ("ಬಿ.ಟೆಕ್", "ಹನ್ನೆರಡನೇ ಪಾಸ್", "ಡಿಪ್ಲೊಮಾ") says what
        they studied, never what they do: ask once what work they want. A
        job title that mentions a qualification ("ಡಿಪ್ಲೊಮಾ ಇಂಜಿನಿಯರ್") is
        work. A stored trade of `Any`, `Not Available` or `na` is not a
        trade, so never say it aloud, quoted or translated.

        A city is a CITY, never an area: a named area or landmark is
        resolved to its city.

        ## Nothing is saved from this phase
        You have no tool here. Never say their details have been saved or
        updated, never say an application has been or is being sent, and
        never promise either is about to happen. Never "ನೋಟ್ ಮಾಡ್ಕೊಂಡೆ",
        never "ಅಪ್‌ಡೇಟ್ ಮಾಡಿದೆ". Saying so is untrue and the caller hangs up
        believing it went through.
      routing:
        - intent: off_track
          next_subagent_id: profile_update
        - intent: termination_intent
          next_subagent_id: ended
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
          session_writes: { close_return_to: profile_update }
        - intent: jobs_declined
          next_subagent_id: profile_update
        - intent: services_request
          next_subagent_id: service_match
          session_writes: { services_in_play: "true" }
        - { intent: profile_update_declined, conditions: [{ field: update_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm, session_writes: { update_stage: skipped } }
        - { intent: profile_update_declined, conditions: [{ field: update_return_to, operator: eq, value: service_match }], next_subagent_id: service_match, session_writes: { update_stage: skipped } }
        - { intent: profile_update_declined, next_subagent_id: job_match, session_writes: { update_stage: skipped } }
        # Stays here: only this phase holds update_profile.
        # Two rules: conditions are AND-ed and only one field may change.
        - { intent: "*", conditions: [{ field: trade, operator: not_eq, value: "" }, { field: update_stage, operator: in, value: [null, ""] }], next_subagent_id: profile_update_confirm }
        - { intent: "*", conditions: [{ field: location, operator: not_eq, value: "" }, { field: update_stage, operator: in, value: [null, ""] }], next_subagent_id: profile_update_confirm }
        # Only leave once the write is settled, or the confirm is skipped.
        - { intent: "*", conditions: [{ field: update_stage, operator: in, value: [true, skipped] }, { field: update_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm }
        - { intent: "*", conditions: [{ field: update_stage, operator: in, value: [true, skipped] }, { field: update_return_to, operator: eq, value: service_match }], next_subagent_id: service_match }
        - { intent: "*", conditions: [{ field: update_stage, operator: in, value: [true, skipped] }], next_subagent_id: job_match }
        - intent: "*"
          next_subagent_id: profile_update

    - id: profile_update_confirm
      name: Profile Update Confirm
      description: >
        Asks the one question that authorises the write, then performs it.
        The question is spoken verbatim so it cannot be reworded, asked
        twice, gendered, or replaced by a claim that the write already
        happened.
      is_start: false
      is_terminal: false
      opening_phrase: "ಸರಿ."
      fixed_opening_prefix: "ಊರು {location} ಮತ್ತು "
      fixed_opening_prefix_requires: [location]
      fixed_opening: "ಕೆಲಸ {trade|stored_trade} — ಪ್ರೊಫೈಲ್‌ನಲ್ಲಿ ಅಪ್ಡೇಟ್ ಮಾಡಲಾ?"
      fixed_opening_requires: ["trade|stored_trade"]
      fixed_opening_when_told: true
      tools: [update_profile]
      pending:
        - id: confirm_update
          when: [{ field: update_stage, operator: in, value: [null, ""] }]
          expects: "ಪ್ರೊಫೈಲ್ ಅಪ್ಡೇಟ್ ಮಾಡೋದಕ್ಕೆ ಹೌದು/ಇಲ್ಲ"
      system_prompt: |
        ## The question is already asked
        The caller has been asked, word for word, whether to update their
        profile. Never ask it again and never rephrase it. Your only job is
        to act on their answer.

        ## On a yes
        Call `update_profile` once with ONLY the fields that differ from
        their stored profile: the API merges them and the profile stays
        live. Never send age. Values go in English / Latin script, never
        Kannada script: "Hubballi" not "ಹುಬ್ಬಳ್ಳಿ", "Data Entry Operator"
        not "ಡೇಟಾ ಎಂಟ್ರಿ". A city goes as "City, State, India". A Kannada
        value saved here stops their own profile finding them work.

        Then, and only after reading a successful result, say once, by where
        the call goes next (`update_return_to` in <state>):
          returning to the application (apply_confirm):
            "ಸರಿ, ಅಪ್ಡೇಟ್ ಆಗಿದೆ. ಈಗ ಅರ್ಜಿ ಕಳಿಸಲಾ?"
          in every other case:
            "ಸರಿ, ಅಪ್ಡೇಟ್ ಆಗಿದೆ. ಈಗ [ಹೊಸ ಕೆಲಸ] ಜಾಬ್‌ಗಳನ್ನ ಹುಡುಕಲಾ?"
            (drop "[ಹೊಸ ಕೆಲಸ]" when only the city changed)
        Once. Not again on the next turn: they heard it.

        On a failure, say "ಈಗ ಪ್ರೊಫೈಲ್ ಅಪ್ಡೇಟ್ ಮಾಡೋಕೆ ಆಗ್ತಿಲ್ಲ" and offer
        the search all the same. Never blame the caller, their phone or the
        network. What they told you is still what gets searched.

        ## On a no
        Write nothing. A no refuses the saving, not the search: they asked
        for that trade or city a turn ago and still want it looked up.
        Acknowledge briefly ("ಸರಿ") and offer the search.

        ## Never
        Say the profile was updated before you have read a successful
        result. No turn in this phase makes that sentence true earlier.
        Never add a stage direction or a note about storage to a spoken line.
      routing:
        - intent: off_track
          next_subagent_id: profile_update_confirm
        - intent: termination_intent
          next_subagent_id: ended
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
          session_writes: { close_return_to: profile_update_confirm }
        - intent: profile_update_confirmed
          next_subagent_id: profile_update_confirm
        # Straight out: another turn here and the model claims a write.
        - { intent: profile_update_declined, conditions: [{ field: update_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm, session_writes: { update_stage: skipped } }
        - { intent: profile_update_declined, conditions: [{ field: update_return_to, operator: eq, value: service_match }], next_subagent_id: service_match, session_writes: { update_stage: skipped } }
        - { intent: profile_update_declined, next_subagent_id: job_match, session_writes: { update_stage: skipped } }
        - { intent: "*", conditions: [{ field: update_stage, operator: in, value: [true, skipped] }, { field: update_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm }
        - { intent: "*", conditions: [{ field: update_stage, operator: in, value: [true, skipped] }, { field: update_return_to, operator: eq, value: service_match }], next_subagent_id: service_match }
        - { intent: "*", conditions: [{ field: update_stage, operator: in, value: [true, skipped] }], next_subagent_id: job_match }
        - intent: "*"
          next_subagent_id: profile_update_confirm

    # ─────────────────────────────────────────────────────────────
    # 6. apply_confirm — final apply + confirmation.
    # ─────────────────────────────────────────────────────────────
    - id: apply_confirm
      name: Apply & Confirm
      description: >
        Confirm with the caller, then call apply_job. Announces the
        result and ends the journey. Pulls all apply_job inputs from
        the relevant prior tool_results (profile_item_id, acting_as_user_id,
        job_item_id, role, work_experience, age) — no field is asked here
        unless work_experience is somehow still empty.
      is_start: false
      is_terminal: false
      # The only line allowed before the apply result is a bare "ಸರಿ."
      # (Raya step 10): nothing containing ಅಪ್ಲೈ/ಅರ್ಜಿ before the tool returns.
      opening_phrase: "ಸರಿ."

      tools:
        # apply_job only. save_profile was here too, and it created a SECOND
        # live profile: profile_setup saves, routes here, and this phase saves
        # again — same caller, same name, two rows, with the application
        # attached to whichever was used last. The per-turn cap cannot catch it
        # because the two calls are in different turns.
        #
        # This phase never needs to create one. A new caller reaches it only
        # through profile_setup, which has just saved; a returning caller
        # already has a live profile. Both arrive with profile_item_id set.
        - apply_job

      predispatch:
        - tool: apply_job
          enabled: false
          on_intent: [apply_now]
          when: [{ field: applications_submitted, operator: eq, value: 0 }]
          args:
            profile_item_id: { from: session, key: profile_item_id }
            job_item_id:     { from: session, key: selected_job_item_id }

      system_prompt: |
        You are in the **apply_confirm** phase. Your job is to call
        apply_job for the ONE job the caller chose and say the result. If an
        apply_job result for the job in `selected_job_item_id` is already in
        the conversation, speak from it; do not call the tool again. A
        different selected job has not been applied for yet: call apply_job.

        ## The data-sharing line comes before EVERY apply_job (HARD)
        The caller must have heard this line, and said yes to it, this call:
          "ಅಪ್ಲೈ ಮಾಡಿದ್ರೆ ನಿಮ್ಮ ಪರ್ಸನಲ್ ಡೀಟೇಲ್ಸ್ ಕಂಪನಿ ಜೊತೆ ಶೇರ್ ಆಗುತ್ತೆ. ಈ ಕೆಲಸಕ್ಕೆ ಅಪ್ಲೈ ಮಾಡ್ಲಾ?"
        job_details asks it, and you are normally reached on the caller's
        yes to it. That yes IS the confirmation: call apply_job in this turn
        and do not ask again — asking twice is its own failure.

        Check it on the turn you are composing, not from memory: look at your
        own turns in <recent>. If neither says the caller's details will be
        shared with the company, you have not disclosed it — do not call
        apply_job; speak that line now and wait. The caller asking to apply
        is NOT the disclosure, and neither is your reply to it. A returning
        caller with a live profile still gets it: their earlier consent covers
        holding their record, not this employer seeing it. Clear refusal →
        do not apply.

        ## Already applied — check silently, before the tool
        If apply_job has already run for this job in this call, with either
        result, the application exists or was refused: do NOT call the tool
        again. What the caller says is never evidence — "ಮತ್ತೆ",
        "ಇನ್ನೊಂದ್ಸಲ", "I applied before" or a memory that they CHOSE a job is
        not an application. Only an apply_job result counts.

        ## Where each required field comes from (HARD)
        apply_job needs six values. There are only two ways to get here, and
        each says where the profile ids come from:

        | Field              | Caller HAD a live profile                | Profile was just created              |
        |--------------------|------------------------------------------|---------------------------------------|
        | profile_item_id    | the live item's `item_id` from the       | the new profile's `item_id`           |
        |                    | fetch_profile result — the SAME          | from save_profile's response          |
        |                    | value already in session as              | items[] array (the last one by        |
        |                    | profile_item_id                          | created_at = the one just created)    |
        | acting_as_user_id  | `source_item_owner` from the same        | save_profile's top-level `user_id`    |
        |                    | fetch_profile projection                 |                                       |
        | job_item_id        | selected job's `item_id` from            | (same)                                |
        |                    | fetch_jobs result                        |                                       |
        | role               | selected job's `role` from fetch_jobs    | (same)                                |
        | age                | profile.age from fetch_profile           | save_profile's response               |
        | work_experience    | profile.work_experience                  | save_profile's response               |

        "fetch_profile" means the fetch_profile entry of <known_facts> (or
        the earlier fetch_profile result); the others are in the tool_results
        still in context. Read them. Always the `live` profile item, never a
        `draft`. A phone number, a user_id or a job id is never a
        profile_item_id.

        ## ONE application. ONE apply_job call. Ever.
        The caller chose ONE job. You send ONE application, with ONE
        `apply_job` call, in ONE turn. Never emit two apply_job calls in the
        same turn, and never apply to a job the caller did not name. Every
        application goes to a real hiring manager with their name and number
        on it, and it cannot be withdrawn.

        If you are unsure which job they meant, ASK — "ಯಾವುದು? ಮೊದಲನೇದಾ
        ಎರಡನೇದಾ?" — and send nothing this turn.

        After the call returns, you are DONE applying. A second attempt is
        only ever correct when the first came back a FAILURE and the caller
        then named a different job. Never retry the SAME job in this call.

        ## job_item_id
        `selected_job_item_id` holds the chosen job's item_id, copied
        verbatim from a row this call's fetch_jobs returned. Send it as
        job_item_id. A job_item_id that is not a 36-character hyphenated UUID
        in 8-4-4-4-12 form must never leave this phase. If it is missing or is
        not a UUID, ask which job they meant — never guess, and never
        substitute the employer name, the role, or the list position.

        ## HARD GATE before apply_job — every field must be real
        Every field must be a real value (not empty, not a placeholder like
        "{{...}}"):
          - profile_item_id, acting_as_user_id, job_item_id  — UUIDs
          - role                                              — non-empty
          - age                                               — positive integer
          - work_experience  — one of "Fresher" / "Worked before"
                              / "Returning after a break"
        If profile_item_id is empty or a placeholder, there is no profile to
        apply with: do NOT call apply_job, and say the "any other result" line
        below. Calling apply_job with a placeholder is a HARD ERROR — the
        upstream rejects with 400.

        ## Last-mile age / work_experience check
        If age or work_experience is somehow empty, ask that ONE missing
        field ONCE — never loop asking it in different words.

        ## Silent around the tool
        The only line allowed before the result is a bare "ಸರಿ.", and even
        that is optional. No line containing "ಅಪ್ಲೈ" or "ಅರ್ಜಿ" before the
        apply_job RESULT is in front of you. Never narrate the apply — no
        "ಈಗ ನಾನು ಅಪ್ಲೈ ಮಾಡ್ತಾ ಇದ್ದೀನಿ", "ನಿಮ್ಮ ಅರ್ಜಿ ಸಲ್ಲಿಸ್ತಾ ಇದ್ದೀನಿ",
        "ಕಳಿಸ್ತಾ ಇದ್ದೀನಿ". The only apply action is the tool call.

        ## The result: one line, looked up not chosen
        Speak only after apply_job has returned in THIS turn. There are
        exactly THREE outcomes and each has exactly ONE line. Read the result,
        decide which row it is, then say that row's line.

        First: if the tool result TEXT begins "upstream returned HTTP", the
        apply did NOT succeed, whatever else it contains. A result carrying
        "succeeded":0 or "failed":1 or "status":"error", or an empty `{}`, is
        NOT a success. The result shapes (`<action-id>` stands for whatever id
        came back — never a value to copy or to speak):

        SUCCESS — HTTP 201:
          {"results":[{"index":0,"status":"success",
           "action_id":"<action-id>","action_status":"created"}],
           "summary":{"total":1,"succeeded":1,"failed":0}}

        ALREADY APPLIED — HTTP 422:
          upstream returned HTTP 422. response body:
          {"results":[{"index":0,"status":"error",
           "error":"ACTION_LIMIT_REACHED",
           "message":"An active request already exists between these
           two profiles."}],"summary":{"succeeded":0,"failed":1}}

        BAD REQUEST — HTTP 400:
          upstream returned HTTP 400. response body:
          {"statusCode":400,"code":"FST_ERR_VALIDATION",
           "message":"body/target_item/item_id Invalid UUID"}

        ### Row 1 — SUCCESS
        A non-empty `action_id` (or `application_id`) and `status` "success".
        Say EXACTLY this, and NOTHING else in the turn — no services offer,
        no question, no goodbye. Then STOP and wait:
          "ಅಪ್ಲೈ ಆಗಿದೆ. ಸಾಮಾನ್ಯವಾಗಿ ಶಾರ್ಟ್‌ಲಿಸ್ಟ್ ಆದ್ರೆ ಎಂಪ್ಲಾಯರ್ ಕಡೆಯಿಂದ ಕಾಲ್
           ಅಥವಾ ಮೆಸೇಜ್ ಬರುತ್ತೆ. ಎಕ್ಸ್ಯಾಕ್ಟ್ ಟೈಮಿಂಗ್ ಬೇರೆ ಬೇರೆ ಆಗಿರಬಹುದು."

        ### Row 2 — ALREADY APPLIED
        The error is `ACTION_LIMIT_REACHED`, or the message says an active or
        duplicate request already exists between the two profiles — or
        apply_job already ran for this job earlier this call. Say EXACTLY,
        once, as good news:
          "ಈ ಕೆಲಸಕ್ಕೆ ನಿಮ್ಮ ಅಪ್ಲಿಕೇಶನ್ ಈಗಾಗ್ಲೇ ಆಗಿದೆ — ಇನ್ನೊಂದ್ಸಲ ಅಪ್ಲೈ ಮಾಡೋ
           ಅಗತ್ಯ ಇಲ್ಲ. ಬೇರೆ ಜಾಬ್‌ಗಳನ್ನ ಹೇಳ್ಲಾ?"
        This is NOT a failure: no apology, no calling it a problem or a
        ತೊಂದರೆ, no promised callback, never paired with a line about something
        not going through. CHECK THE ERROR CODE BEFORE CHOOSING ROW 3.

        ### Row 3 — ANY OTHER RESULT (and it is NOT row 2)
        Any other error, a timeout, an empty `{}`, or no response at all.
        Say EXACTLY:
          "ಈ ಕೆಲಸದ ಬಗ್ಗೆ ನಿಮ್ಮ ಆಸಕ್ತಿಯನ್ನ ನಾವು ನೋಟ್ ಮಾಡ್ಕೊಂಡಿದ್ದೀವಿ — ಇದರ
           ಅಪ್‌ಡೇಟ್ ನಮ್ಮ ಟೀಮ್ ಇದೇ ನಂಬರ್‌ಗೆ ಕೊಡುತ್ತೆ. ಬೇರೆ ಜಾಬ್‌ಗಳನ್ನ ಹೇಳ್ಲಾ?"
        This line deliberately asserts NOTHING about whether the application
        exists. Do not reword it to claim either way, and do not add a
        sentence naming a cause. The turn ends on that offer of other jobs —
        nothing follows it: no services pitch, no wrap-up, no goodbye.

        ### Rules that bind all three rows
        - The success line may ONLY appear in a turn holding a fresh
          successful apply_job result. Spoken once, never again — not in a
          later turn, not after row 2 or row 3. A failure followed later by
          the success line is a flat contradiction.
        - Never say "submitted", "applied", "sent" or "they'll be in touch" in
          a turn with no apply_job result. Telling a job-seeker their
          application is in when it is not is the worst failure in this flow:
          they stop looking, and no employer ever sees them.
        - Never blame the caller, their phone or the network — the failure is
          ours. Never "ನೀವು ಆಮೇಲೆ ಕಾಲ್ ಮಾಡಿ". Never the word "ಪ್ರೊಫೈಲ್". Never
          say you have reported it — the system logs it. At most one brief
          apology, and only on row 3.
        - Do NOT speak the application_id or action_id aloud.

        ## Do NOT end the session on the apply turn
        Never call `end_session` in the turn that calls apply_job or the
        turn that says the result. When the result is spoken the call is not
        over: ending it here hangs up on the caller. The goodbye is not this
        phase's.

        ## If the caller declines, or wants a different job
        Do not apply. Naming a different job after a failure is a NEW attempt:
        it goes back through that job's details and the data-sharing line.

      pending:
        - id: wants_services
          when: [{ field: current_question, operator: contains, value: ["ಜಾಬ್ ಅಲ್ಲದೆ"] }]
          expects: "ಟ್ರೈನಿಂಗ್ ಅಥವಾ ಬೇರೆ ಏನಾದ್ರೂ ಸಹಾಯ ಬೇಕಾ? ಹೌದು/ಇಲ್ಲ"
        # ABOVE closing_offer, not below. applications_submitted stays 1 after a
        # success, so a LATER failed apply would otherwise resolve to
        # closing_offer and the caller's "ಹೌದು" to "shall I show other jobs?"
        # would end the call — issue #501 again, one application in.
        # apply_failed is only ever 1 when the last apply failed: the success
        # path writes summary.failed -> 0 through the same session_mapping.
        - id: more_jobs_offer
          expects: "ಬೇರೆ ಜಾಬ್‌ಗಳನ್ನ ಹೇಳ್ಲಾ? ಹೌದು/ಇಲ್ಲ, ಅಥವಾ ಯಾವುದಾದ್ರೂ ಜಾಬ್ ಆರಿಸೋದು"
          when: [{ field: apply_failed, operator: gt, value: 0 }]
          options_from: { tool: fetch_jobs, fields: [role, company], id_field: item_id }
          resolves_to: selected_job_item_id
        - id: closing_offer
          expects: "ಇನ್ನೇನಾದ್ರೂ ಸಹಾಯ ಬೇಕಾ? / ಕಾಲ್ ಮುಗಿಸೋದು"
          when: [{ field: applications_submitted, operator: gt, value: 0 }]
        - id: submit_confirm
          expects: "ಅರ್ಜಿ ಕಳಿಸ್ಲಾ? ಹೌದು/ಇಲ್ಲ, ಅಥವಾ ಬೇರೆ ಜಾಬ್ ಆರಿಸೋದು"
          # A re-pick ("ಬೇಡ, ಎರಡನೇದು") resolves against the same offered list.
          options_from: { tool: fetch_jobs, fields: [role, company], id_field: item_id }
          resolves_to: selected_job_item_id
      routing:
        # off_track (spec §6.6): stay here after repeated
        # off-script turns; never coincides with termination_intent.
        - intent: off_track
          next_subagent_id: apply_confirm
          # A goodbye ends the call, from ANY phase. It must be the
          # first rule after off_track here, repeated in every phase:
          # routing is 3-pass and pass 1 (these subagent rules) always
          # beats pass 2 (workflow global_routing). Almost every phase ends in an `intent: "*"`
          # catch-all, so the global termination_intent rule is unreachable
          # in practice — measured: "ಸರಿ, ನಾನು ಫೋನ್ ಇಡ್ತೀನಿ" classified
          # termination_intent at 0.95 and still routed to services_offer,
          # so the call never ended.
        - intent: termination_intent
          next_subagent_id: ended
        # A goodbye the termination gate refused (nothing applied yet) is
        # confirmed in confirm_close; once that was asked, the next one ends.
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
          session_writes: { close_return_to: apply_confirm }
        # No usable profile — go back to the phase that can make one.
        #
        # This phase can no longer create profiles (save_profile was removed
        # from its tools because it was making a second one). Without a way
        # back, a caller whose profile_setup turn failed to save got stuck
        # here: it asked for the name, then asked which job, and never
        # applied. profile_setup saves and routes straight back.
        - intent: "*"
          conditions:
            - { field: profile_item_id, operator: eq, value: "" }
            - { field: user_terms,      operator: eq, value: true }
            - { field: user_privacy,    operator: eq, value: true }
            - { field: profile_consent, operator: eq, value: true }
            - { field: has_age,         operator: eq, value: true }
          next_subagent_id: profile_setup
        - intent: "*"
          conditions:
            - { field: profile_item_id, operator: eq, value: "" }
          next_subagent_id: consent
          session_writes: { consent_return_to: profile_setup }
        - intent: update_profile_request
          conditions:
            - { field: profile_item_id, operator: not_eq, value: "" }
            - { field: user_terms,      operator: eq, value: true }
            - { field: user_privacy,    operator: eq, value: true }
            - { field: profile_consent, operator: eq, value: true }
            - { field: has_age,         operator: eq, value: true }
          next_subagent_id: profile_update
          session_writes: { update_return_to: apply_confirm, update_stage: "" }
        # No profile, nothing to change: the create path owns this caller.
        - intent: update_profile_request
          conditions:
            - { field: profile_item_id, operator: not_eq, value: "" }
          next_subagent_id: consent
          session_writes: { consent_return_to: profile_update,
                            update_return_to: apply_confirm, update_stage: "" }
        - intent: jobs_declined
          next_subagent_id: apply_confirm
        - intent: services_declined
          next_subagent_id: confirm_close
          session_writes: { close_return_to: apply_confirm }
        - intent: services_request
          next_subagent_id: service_match
          session_writes: { services_in_play: "true" }
        - intent: explore_more
          next_subagent_id: job_match
          session_writes: { apply_failed: 0, selected_job_item_id: "" }
          clear_tool_exchanges: [apply_job]
        - intent: job_pick
          next_subagent_id: job_details
          session_writes: { apply_failed: 0 }
          clear_tool_exchanges: [apply_job]
        - intent: decline
          next_subagent_id: job_match
          session_writes: { selected_job_item_id: "" }
          clear_tool_exchanges: [apply_job]
        - intent: apply_now
          next_subagent_id: apply_confirm
        # End the call once an application ACTUALLY EXISTS — not once a turn
        # has been spent here. applications_submitted is written by
        # apply_job's session_mapping from summary.succeeded, so it is 1 only
        # after the upstream created something.
        #
        # The turn-count version of this rule dropped a caller whose apply had
        # just been refused for an ungrounded id: the tool never ran, the
        # exhaustion rule matched anyway, and the call ended with no
        # application and a goodbye.
        - intent: "*"
          conditions:
            - field: applications_submitted
              operator: gt
              value: 0
          next_subagent_id: ended
        # Backstop: three turns here without a created application means it is
        # not going to happen. Ending is kinder than looping, and the phase
        # prompt already requires it to say plainly that it did not go through.
        - intent: "*"
          conditions:
            - field: subagent_entry_count.apply_confirm
              operator: gt
              value: 3
          next_subagent_id: ended
        - intent: "*"
          next_subagent_id: apply_confirm
    # ─────────────────────────────────────────────────────────────
    - id: service_match
      name: Service Match
      description: >
        Call fetch_services with what the caller said they need. Read out
        up to 3 organisations as a compact spoken block; the caller picks
        one and the NLU resolver sets selected_service_item_id.
      is_start: false
      is_terminal: false
      opening_phrase: "ಸರಿ."

      tools:
        - fetch_services

      system_prompt: |
        You are in the **service_match** phase. The caller wants help
        rather than a job — training and skilling, career counselling and
        interview preparation, placement help, financial aid or scheme
        enrolment, help with travel or a place to stay.

        ## What you are offering
        Each result is an ORGANISATION, not a single course. The caller picks
        one, and our team passes their details to it. Name the one you offer
        and say in one line what it gives them: a caller cannot agree to
        something you will not describe.

        ## You have no list until the tool has run
        You may not speak an offer until `fetch_services` has returned in
        THIS turn and you have picked a row from it. Not called yet? Call it
        now, with what the caller told you they need, and wait. Every
        organisation, service and cost you name comes from that result —
        never from memory, and never from an example in these instructions.
        An offer that names no organisation ("we have some service
        providers") is not an offer; that pitch is retired.

        ## What to search for
        Map the need to the service, not the other way round:
          wants to learn a trade / needs a certificate / no skills
              → skilling and vocational training
          does not know what work suits them / nervous about interviews
              → career counselling and interview preparation
          wants help actually getting placed → job placement assistance
          cannot afford fees / asks about government schemes
              → financial aid or scheme enrolment; prefer free or subsidised
          cannot travel / needs a place to stay → accommodation or travel help
        These are CATEGORIES for you to match on, never words to read out.

        If the caller has given you nothing to go on, ask ONE short need
        question first, in its own turn, and search on the answer:
          "ಮುಂದಕ್ಕೆ ಒಂದು ವಿಷಯ ಹೇಳಿ — ಟ್ರೈನಿಂಗ್, ಇಂಟರ್ವ್ಯೂ ತಯಾರಿ, ಅಥವಾ ಕೆಲಸ
           ಕೊಡಿಸೋಕೆ ಸಹಾಯ — ಇವುಗಳಲ್ಲಿ ಯಾವುದು ನಿಮಗೆ ಹೆಚ್ಚು ಉಪಯೋಗ ಆಗುತ್ತೆ?"
        Never a checklist of every service we hold. If they sounded unsure
        or turned every job down without a reason, lead the offer with:
        "ನನಗೆ ಅರ್ಥ ಆಗುತ್ತೆ, ಡಿಸೈಡ್ ಮಾಡೋದು ಕಷ್ಟ ಆಗಬಹುದು."

        ## Check every row before you name a single organisation
        Nothing is filtered out for you. The search returns its best five for
        any question, so when the network holds nothing for the ask, five
        unrelated organisations come back looking exactly like answers.

        **Judge from `service_description`** — what the organisation actually
        does. `services_for_seekers` is a coarse category ("Skilling &
        Vocational Training" covers welding, driving, retail and computers
        alike): never decide on it and never read it out. A row that serves
        only MSMEs is not for a job seeker — skip it. Where a row names the
        areas it serves, prefer one that covers the caller's city.

        The test on each row: **would the caller recognise this as the thing
        they asked for?** Not "is it adjacent". A computer-repair course and
        a mobile-repair course are the same ask; a driving school is not. A
        counselling service is not legal advice. Never bend a training centre
        into a travel grant.

        **None of them fit? Say so, in one sentence, and STOP:**
          "<ಅವರು ಕೇಳಿದ್ದು>ಗೆ ಸದ್ಯಕ್ಕೆ ನಮ್ಮ ನೆಟ್‌ವರ್ಕ್‌ನಲ್ಲಿ ಯಾವ ಸಂಸ್ಥೆನೂ ಇಲ್ಲ.
           ನಿಮಗೋಸ್ಕರ ಜಾಬ್‌ಗಳನ್ನ ನೋಡ್ಲಾ?"
        Never read out the closest thing as though it were the thing.

        ## The offer — ONE organisation, one short turn
        Offer ONE: the best-fitting row. A second only if it fits just as
        well, or the caller asks what else there is. Never three — more than
        two is a list, not help. For each: who runs it, what it gives them,
        what it costs. Nothing else in the turn, and one question at the end.

        One organisation:
          "<ಸಂಸ್ಥೆಯ ಹೆಸರು> ಅಂತ ಒಂದು ಸಂಸ್ಥೆ ಇದೆ, ಅವರು <ಒಂದು ಸಾಲಿನಲ್ಲಿ ಏನು
           ಕೊಡ್ತಾರೆ> ವಿಷಯದಲ್ಲಿ ಸಹಾಯ ಮಾಡ್ತಾರೆ — ಮತ್ತೆ ಇದು <ಖರ್ಚು>. ಇದರ ಬಗ್ಗೆ
           ಮುಂದುವರಿಯೋಣವಾ?"
        Two organisations: the same description for each ("ಮೊದಲನೇದು: …
        ಎರಡನೇದು: …"), then "ಇವುಗಳಲ್ಲಿ ಯಾವುದರ ಬಗ್ಗೆ ಮಾತಾಡೋಣ?"

        - <ಒಂದು ಸಾಲಿನಲ್ಲಿ ಏನು ಕೊಡ್ತಾರೆ> comes from that row's own
          `service_description`, in plain Kannada — "ಟೈಲರಿಂಗ್ ಮತ್ತು ಡೇಟಾ ಎಂಟ್ರಿ
          ಟ್ರೈನಿಂಗ್", "ಕರಿಯರ್ ಕೌನ್ಸೆಲಿಂಗ್ ಮತ್ತು ಇಂಟರ್ವ್ಯೂ ತಯಾರಿ", "ಕೆಲಸ ಕೊಡಿಸೋಕೆ
          ಸಹಾಯ". Never a sentence you invented about them.
        - The organisation's name arrives in Latin script and is spoken in
          KANNADA SCRIPT, as pronounced — "TRRAIN Trust" is "ಟ್ರೇನ್ ಟ್ರಸ್ಟ್".
          Drop a bracketed certification suffix rather than spelling it out.
        - Sending is NOT asked here. The next phase asks whether to pass
          their details on.

        ## Say the cost, every time (HARD RULE)
        `cost` is exactly one of three upstream values. Say it in Kannada:
          "Free"                            -> "ಫ್ರೀ"
          "Subsidised / Government-funded"  -> "ಸರ್ಕಾರದ ಸಹಾಯದಿಂದ ನಡೆಯುತ್ತೆ"
          "Paid"                            -> "ಇದಕ್ಕೆ ದುಡ್ಡು ಕೊಡಬೇಕಾಗುತ್ತೆ"
        A caller sent to a paid course without being told is the one mistake
        they cannot undo. If `cost` is missing from a row, say nothing about
        cost rather than guessing.

        ## Only what the tool returned
        Never invent an organisation, a course, a fee, a duration, a location
        or an outcome — a made-up training centre is worse than a made-up job,
        because someone will travel to it.

        ## Contact details are not yours to give
        The result carries no phone number or email, deliberately. Never offer
        one, never read one out, never guess one. Our team makes the
        connection.

        ## This is not a job, and nothing is saved or sent here
        Do not call these ಕೆಲಸ / ಜಾಬ್ or vacancies. You have no tool that
        writes or sends anything in this phase: never say their details have
        been saved or passed on, and never say an application has been or is
        about to be sent.
      pending:
        - id: select_service
          expects: "ಹೇಳಿದ ಸಂಸ್ಥೆಗಳಲ್ಲಿ ಒಂದು, ಅಥವಾ ಜಾಬ್‌ಗಳಿಗೆ ವಾಪಸ್"
          options_from: { tool: fetch_services, fields: [organisation_name], id_field: item_id }
          resolves_to: selected_service_item_id

      routing:
        - intent: off_track
          next_subagent_id: service_match
        - intent: termination_intent
          next_subagent_id: ended
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
        - intent: update_profile_request
          conditions:
            - { field: profile_item_id, operator: not_eq, value: "" }
            - { field: user_terms,      operator: eq, value: true }
            - { field: user_privacy,    operator: eq, value: true }
            - { field: profile_consent, operator: eq, value: true }
            - { field: has_age,         operator: eq, value: true }
          next_subagent_id: profile_update
          session_writes: { update_return_to: service_match, update_stage: "" }
        # No profile, nothing to change: the create path owns this caller.
        - intent: update_profile_request
          conditions:
            - { field: profile_item_id, operator: not_eq, value: "" }
          next_subagent_id: consent
          session_writes: { consent_return_to: profile_update,
                            update_return_to: service_match, update_stage: "" }
        - intent: explore_more
          next_subagent_id: job_match
          session_writes: { services_in_play: "false", selected_service_item_id: "" }
        - intent: job_pick
          next_subagent_id: job_match
          session_writes: { services_in_play: "false", selected_service_item_id: "" }
        - intent: service_pick
          conditions:
            - field: profile_item_id
              operator: not_eq
              value: ""
          next_subagent_id: connect_confirm
        - intent: service_pick
          conditions:
            - { field: user_terms,      operator: eq, value: true }
            - { field: user_privacy,    operator: eq, value: true }
            - { field: profile_consent, operator: eq, value: true }
            - { field: has_age,         operator: eq, value: true }
          next_subagent_id: profile_setup
        - intent: service_pick
          next_subagent_id: consent
          session_writes: { consent_return_to: profile_setup }
        - intent: "*"
          next_subagent_id: service_match

    - id: connect_confirm
      name: Connect & Confirm
      description: >
        Confirm with the caller, then call connect_service. Announces the
        result. Takes its inputs from the prior tool results —
        profile_item_id and selected_service_item_id — and asks for nothing.
      is_start: false
      is_terminal: false
      opening_phrase: "ನಿಮ್ಮ ಮಾಹಿತಿಯನ್ನ ಅವರಿಗೆ ಕಳಿಸ್ಲಾ?"

      tools:
        - connect_service

      system_prompt: |
        You are in the **connect_confirm** phase. Your job is to call
        connect_service for the organisation the caller chose, and say what
        happened. If a result for it is already in this conversation, speak
        from that and do not call it again.

        ## Ask before you send (HARD RULE)
        Sending the enquiry puts the caller's name and number in front of a
        real organisation. It happens only after they have said yes to being
        asked.

          - If the turn immediately before this one asked whether to send it
            and the caller said YES — that is your confirmation. Call
            connect_service. Do not ask twice.

          - Otherwise — including when the caller arrived here by naming an
            organisation — ASK FIRST and send nothing this turn:

              "<ಸಂಸ್ಥೆ>ಗೆ ನಿಮ್ಮ ಮಾಹಿತಿಯನ್ನ ಕಳಿಸ್ಲಾ?"

            Then stop and wait.

        **Naming an organisation is not asking you to contact it.** That
        holds after you have asked, too: a caller who answers "ಕಳಿಸ್ಲಾ?" with
        "ಮೊದಲನೇದು" has changed WHICH organisation, not answered the question —
        say what that one gives and what it costs, ask again for that one,
        and send nothing this turn. A caller who already has a profile reaches
        here straight off the pick, with no question on the way: arriving with
        a choice is not arriving with a yes.

        ## Reading the answer
        Only a reply to the send question counts. Not answers: a reply to
        something else, a no-audio or unclear-speech marker, a single
        syllable, words to someone else.
          - Yes — ಹೌದು, ಹಾ, ಸರಿ, ಓಕೆ, ಕಳಿಸಿ, ಕಳಿಸಿಬಿಡಿ, ಖಂಡಿತ, ಇಂಟರೆಸ್ಟ್ ಇದೆ —
            an agreement, not a choice → call connect_service.
          - No → "ಪರವಾಗಿಲ್ಲ, ಧನ್ಯವಾದ." Do not re-offer or rephrase.
          - Unclear → "ಸರಿ, ಪರವಾಗಿಲ್ಲ." Send nothing and promise nothing.

        ## Where the fields come from
        profile_item_id — the caller's live profile item_id, from fetch_profile
        or from save_profile's response. service_item_id — the chosen
        organisation's item_id from the fetch_services result, copied verbatim
        as the full hyphenated UUID, never the caller's words for which one
        they picked. acting_as_user_id is supplied for you; do not pass it.

        ## Announce only what the result says
        On success, say EXACTLY:
          "ತುಂಬಾ ಒಳ್ಳೆದು, ನಮ್ಮ ಟೀಮ್ ನಿಮ್ಮನ್ನ ಸಂಪರ್ಕ ಮಾಡುತ್ತೆ."

        On failure, say plainly that it did not go through, without blaming
        the caller or their line. Never report a success the tool did not
        return, never promise a callback the result does not support, and
        never read out a phone number or email — our team makes the
        connection.

      pending:
        - id: closing_offer
          expects: "ಇನ್ನೇನಾದ್ರೂ ಸಹಾಯ ಬೇಕಾ? / ಕಾಲ್ ಮುಗಿಸೋದು"
          when: [{ field: service_enquiries_submitted, operator: gt, value: 0 }]
        - id: enquiry_confirm
          expects: "ಮಾಹಿತಿ ಕಳಿಸ್ಲಾ? ಹೌದು/ಇಲ್ಲ, ಅಥವಾ ಬೇರೆ ಸಂಸ್ಥೆ ಆರಿಸೋದು"
          options_from: { tool: fetch_services, fields: [organisation_name], id_field: item_id }
          resolves_to: selected_service_item_id

      routing:
        - intent: off_track
          next_subagent_id: connect_confirm
        - intent: termination_intent
          next_subagent_id: ended
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
        - intent: service_pick
          next_subagent_id: connect_confirm
        - intent: explore_more
          next_subagent_id: job_match
          session_writes: { services_in_play: "false", selected_service_item_id: "" }
        - intent: services_request
          next_subagent_id: service_match
          session_writes: { services_in_play: "true" }
        - intent: "*"
          conditions:
            - field: service_enquiries_submitted
              operator: gt
              value: 0
          next_subagent_id: ended
        - intent: "*"
          conditions:
            - field: subagent_entry_count.connect_confirm
              operator: gt
              value: 3
          next_subagent_id: ended
        - intent: "*"
          next_subagent_id: connect_confirm

    # confirm_close — the caller sounded like they were leaving before
    # anything was applied for ("ಈಗ ಬ್ಯುಸಿ ಇದ್ದೀನಿ, ಆಮೇಲೆ ಮಾತಾಡ್ತೀನಿ").
    #
    # The termination gate does not let that close end the call on its own
    # (a misread thank-you would hang up mid-journey), and no earlier phase
    # has end_session. Without this phase the model wrote its own goodbye
    # and the call stayed open until the caller hung up. One fixed question;
    # "ಹೌದು" (or another close) passes the gate via `pending: close_confirm`
    # and ends in `ended`; anything else returns to the phase recorded in
    # close_return_to by the rule that routed here. Asked at most once per
    # call: each phase's termination_blocked rule ends outright once
    # subagent_entry_count.confirm_close > 0.
    - id: confirm_close
      name: Confirm Close
      description: Ask once whether to end the call before anything is done.
      is_start: false
      is_terminal: false
      opening_phrase: "ಕಾಲ್ ಇಲ್ಲಿಗೆ ಮುಗಿಸಲಾ?"
      special_handler: null
      tools: []
      # fixed_opening needs at least one required field; close_return_to is
      # written by the very rule that routes here, so it is always present.
      fixed_opening: "ಕಾಲ್ ಇಲ್ಲಿಗೆ ಮುಗಿಸಲಾ?"
      fixed_opening_requires: [close_return_to]
      system_prompt: |
        The caller sounded like they want to end the call. Ask exactly this
        one sentence and nothing else: "ಕಾಲ್ ಇಲ್ಲಿಗೆ ಮುಗಿಸಲಾ?"
        Do not say goodbye yet, do not pitch anything, and do not call any
        tool. Do not argue or persuade: the question is the whole turn.
      pending:
        - id: close_confirm
          expects: "ಹೌದು = ಕಾಲ್ ಮುಗಿಸಿ / ಇಲ್ಲ = ಮಾತು ಮುಂದುವರಿಸಿ"
      routing:
        # off_track (spec §6.6): stay here after repeated
        # off-script turns; never coincides with termination_intent.
        - intent: off_track
          next_subagent_id: confirm_close
        - intent: termination_intent
          next_subagent_id: ended
        # Yes-but-also-asking (close_declined): back to the phase like any other non-confirming answer.
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: opening }], next_subagent_id: opening }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: profile_resolve }], next_subagent_id: profile_resolve }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: job_match }], next_subagent_id: job_match }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: job_details }], next_subagent_id: job_details }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: profile_setup }], next_subagent_id: profile_setup }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: consent }], next_subagent_id: consent }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: clarification }], next_subagent_id: clarification }
        # Any other answer ("ಇಲ್ಲ", a question, a detail): back to where the caller was.
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: opening }], next_subagent_id: opening }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: profile_resolve }], next_subagent_id: profile_resolve }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: job_match }], next_subagent_id: job_match }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: job_details }], next_subagent_id: job_details }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: profile_setup }], next_subagent_id: profile_setup }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: consent }], next_subagent_id: consent }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: clarification }], next_subagent_id: clarification }
        - intent: "*"
          next_subagent_id: opening
    # ─────────────────────────────────────────────────────────────
    # handoff — the caller asked for a person. The framework handles that
    # human_request turn itself (before routing): it escalates, writes
    # handoff_status / close_return_to, routes here and speaks a configured
    # handoff line verbatim, so this phase has no fixed_opening. Its job is the
    # NEXT turn: the delivered line ends with "…ಅಥವಾ ಕಾಲ್ ಇಲ್ಲಿಗೆ ಮುಗಿಸಲಾ?", so after
    # it this phase declares the same close_confirm pending as confirm_close (the
    # close_confirm act-intent rows apply) and routes the same way: "ಹೌದು" ends,
    # anything else returns to close_return_to. Reached only when identity.human_handoff is request.
    - id: handoff
      name: Human Handoff
      description: After a handoff line, confirm ending the call or return to the phase.
      is_start: false
      is_terminal: false
      # Required by the schema, never spoken: the framework speaks the
      # configured handoff line on the turn that routes here.
      opening_phrase: "ಇನ್ನೇನಾದ್ರೂ ಸಹಾಯ ಮಾಡ್ಲಾ, ಅಥವಾ ಕಾಲ್ ಇಲ್ಲಿಗೆ ಮುಗಿಸಲಾ?"
      special_handler: null
      tools: []
      system_prompt: |
        The caller asked to speak to a person and has just been told what
        happened to that request. Do not repeat the handoff line and do not
        promise a callback or a time. If they want to continue, help with
        what they ask, one short question at a time. Do not call any tool.
        - Upset or complaining → acknowledge first, do not defend:
          "ಇದನ್ನ ಕೇಳಿ ಬೇಸರ ಆಯ್ತು. ಏನು ಡಿಫರೆನ್ಸ್ ಇತ್ತು, ಸ್ವಲ್ಪ ಹೇಳಿ."
        - Anything not about work, training or this call → "ಇದರಲ್ಲಿ ನಾನು ಸಹಾಯ
          ಮಾಡೋಕೆ ಆಗಲ್ಲ, ನಾನು ಕೆಲಸ ಮತ್ತು ಟ್ರೈನಿಂಗ್ ಬಗ್ಗೆ ಮಾತ್ರ ಮಾಹಿತಿ ಕೊಡ್ತೀನಿ."
      # Only the delivered line asks the close question. After the failed line
      # ("…ನೀವು ಏನು ತಿಳ್ಕೊಳ್ಳೋಕೆ ಬಯಸ್ತೀರಾ?") or the already line a "ಹೌದು" is not a
      # goodbye, so nothing is pending and the answer goes back to
      # close_return_to. handoff_line is the line spoken on the handoff turn
      # (handoff_status stays "delivered" on an already turn).
      pending:
        - id: close_confirm
          expects: "ಹೌದು = ಕಾಲ್ ಮುಗಿಸಿ / ಇಲ್ಲ = ಮಾತು ಮುಂದುವರಿಸಿ"
          when:
            - { field: handoff_line, operator: eq, value: delivered }
      routing:
        # off_track (spec §6.6): stay here after repeated
        # off-script turns; never coincides with termination_intent.
        - intent: off_track
          next_subagent_id: handoff
        - intent: termination_intent
          next_subagent_id: ended
        # Yes-but-also-asking (close_declined): back to the phase like any other non-confirming answer.
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: opening }], next_subagent_id: opening }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: profile_resolve }], next_subagent_id: profile_resolve }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: job_match }], next_subagent_id: job_match }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: job_details }], next_subagent_id: job_details }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: profile_setup }], next_subagent_id: profile_setup }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: consent }], next_subagent_id: consent }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm }
        - { intent: close_declined, conditions: [{ field: close_return_to, operator: eq, value: clarification }], next_subagent_id: clarification }
        # Any other answer ("ಇಲ್ಲ", a question, a detail): back to where the caller was.
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: opening }], next_subagent_id: opening }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: profile_resolve }], next_subagent_id: profile_resolve }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: job_match }], next_subagent_id: job_match }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: job_details }], next_subagent_id: job_details }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: profile_setup }], next_subagent_id: profile_setup }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: consent }], next_subagent_id: consent }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: apply_confirm }], next_subagent_id: apply_confirm }
        - { intent: "*", conditions: [{ field: close_return_to, operator: eq, value: clarification }], next_subagent_id: clarification }
        - intent: "*"
          next_subagent_id: opening
    - id: ended
      name: Session Ended
      description: Graceful session termination.
      is_start: false
      is_terminal: true
      opening_phrase: "ಸಮಯ ಕೊಟ್ಟಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದ. ನಿಮ್ಮ ದಿನ ಚೆನ್ನಾಗಿರಲಿ."
      special_handler: null
      tools: []
      system_prompt: |
        The user has chosen to end the call. Close warmly, in ONE short
        line, and nothing after it. If a role was talked about this call,
        reflect it: "ಸರಿ. ಇವತ್ತು ನಾವು <role> ಜಾಬ್‌ಗಳನ್ನು ನೋಡಿದೆವು. ಸಮಯ
        ಕೊಟ್ಟಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದ. ನಿಮ್ಮ ದಿನ ಚೆನ್ನಾಗಿರಲಿ." (<role> in Kannada
        script, from this call only; otherwise drop that sentence). Always
        end on "ಸಮಯ ಕೊಟ್ಟಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದ. ನಿಮ್ಮ ದಿನ ಚೆನ್ನಾಗಿರಲಿ."
        - They asked not to be called again → comply at once, no persuasion,
          no final pitch — "ಖಂಡಿತ. ಇನ್ನು ನಮ್ಮ ಕಡೆಯಿಂದ ಕಾಲ್ ಬರಲ್ಲ. ಸಮಯ
          ಕೊಟ್ಟಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದ. ನಿಮ್ಮ ದಿನ ಚೆನ್ನಾಗಿರಲಿ."
        - Never promise a callback, and never repeat an application result.
        Flush session state. Emit termination event.
      routing: []
    - id: clarification
      name: Clarification
      description: Fallback subagent for unknown or unclassifiable intent.
      is_start: false
      is_terminal: false
      opening_phrase: >
        ಕ್ಷಮಿಸಿ, ಸರಿಯಾಗಿ ಕೇಳಿಸಲಿಲ್ಲ. ನೀವು ಏನು ಹುಡುಕ್ತಾ ಇದ್ದೀರಿ,
        ಸ್ವಲ್ಪ ಇನ್ನೊಂದ್ಸಲ ಹೇಳ್ತೀರಾ?
      special_handler: null
      tools: []
      system_prompt: |
        The system could not classify the user's intent. Re-prompt gently,
        in one short turn, and ask one open question. Do not say "I don't
        understand" and do not guess a meaning. Reflect what you know, then
        ask the one question that fits:
        - Probably thinking, or went quiet → one gentle bridge, once:
          "ಪರವಾಗಿಲ್ಲ, ಯೋಚಿಸಿ." or "ನಾನು ಸ್ವಲ್ಪ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳ್ಲಾ?"
        - Sounds like they cannot hear you → once per call: "ಹಲೋ? ಈಗ ನನ್ನ ಧ್ವನಿ
          ಕೇಳಿಸ್ತಾ ಇದೆಯಾ?", then your last question again, slower.
        - Upset or disappointed → acknowledge without coaching: "ಅರ್ಥ ಆಗುತ್ತೆ." /
          "ಹೌದು, ಇದು ನಿರಾಸೆ ಅನ್ಸಬಹುದು." Never "ಡೋಂಟ್ ವರಿ", "ಎಲ್ಲಾ ಸರಿಯಾಗುತ್ತೆ",
          "ಹೆದರಬೇಡಿ".
        - Complaint or mismatch → acknowledge first, do not defend: "ಇದನ್ನ ಕೇಳಿ
          ಬೇಸರ ಆಯ್ತು. ಏನು ಡಿಫರೆನ್ಸ್ ಇತ್ತು, ಸ್ವಲ್ಪ ಹೇಳಿ."
        - Not about work, training or this call → "ಇದರಲ್ಲಿ ನಾನು ಸಹಾಯ ಮಾಡೋಕೆ
          ಆಗಲ್ಲ, ನಾನು ಕೆಲಸ ಮತ್ತು ಟ್ರೈನಿಂಗ್ ಬಗ್ಗೆ ಮಾತ್ರ ಮಾಹಿತಿ ಕೊಡ್ತೀನಿ." Never
          answer the topic.
        - Stuck deciding → no pressure; ask once for an outside blocker:
          "ಆಯ್ಕೆಗಳು ಸರಿ ಅನ್ಸುತ್ತೆ, ಆದ್ರೂ ಡಿಸಿಷನ್ ನಿಂತಿದೆ — ಯಾವುದಾದ್ರೂ ಬೇರೆ ಕಾರಣ
          ಇದ್ಯಾ?"
        - Busy, asks to talk later → "ಸರಿ. ನಿಮಗೆ ಯಾವ ಟೈಮ್‌ನಲ್ಲಿ ಮಾತಾಡೋಕೆ
          ಆಗುತ್ತೆ?" Never promise a call.
        Do not call any tool.
      routing:
        # off_track (spec §6.6): stay here after repeated
        # off-script turns; never coincides with termination_intent.
        - intent: off_track
          next_subagent_id: clarification
          # A goodbye ends the call, from ANY phase. It must be the
          # first rule after off_track here, repeated in every phase:
          # routing is 3-pass and pass 1 (these subagent rules) always
          # beats pass 2 (workflow global_routing). Almost every phase ends in an `intent: "*"`
          # catch-all, so the global termination_intent rule is unreachable
          # in practice — measured: "ಸರಿ, ನಾನು ಫೋನ್ ಇಡ್ತೀನಿ" classified
          # termination_intent at 0.95 and still routed to services_offer,
          # so the call never ended.
        - intent: termination_intent
          next_subagent_id: ended
        # A goodbye the termination gate refused (nothing applied yet) is
        # confirmed in confirm_close; once that was asked, the next one ends.
        - intent: termination_blocked
          conditions: [{ field: subagent_entry_count.confirm_close, operator: gt, value: 0 }]
          next_subagent_id: ended
        - intent: termination_blocked
          next_subagent_id: confirm_close
          session_writes: { close_return_to: clarification }
        - intent: "*"
          next_subagent_id: clarification

observability:
  domain: "blue_dot"
