# dev-kit/configs/blue-dots/reach_layer.yaml
# Blue Dots — Reach Layer domain config.
# Deep-merged on top of dev-kit/dpg/reach_layer.yaml at startup.
#
# One block per channel: web, cli and voice (the Reach Layer channels), plus
# bridge for the optional VoicERA integration. What the agent says is Hindi,
# in a woman's voice, matching agent_core.yaml; web UI labels are English.

reach_layer:

  common:
    observability:
      domain: "blue_dot"

  channels:

    cli:
      prompt: "You: "
      agent_prefix: "Agent: "

    web:
      # Blue Dots runs the web chat without login. To turn Google sign-in on, set
      # enabled: true and provide GOOGLE_CLIENT_ID and REACH_SESSION_SECRET.
      auth:
        enabled: false
      ui:
        app_name: "Blue Dots"
        app_tagline: "Job assistant"
        app_icon: "🔵"
        agent_avatar: "🔵"
        user_avatar: "👤"
        setup_heading: "Welcome to Blue Dots"
        # The country code is required. What is typed here becomes
        # session.user_id, which the Action Gateway substitutes into
        # `?phone_number={user_id}` for the lookup and `"+{user_id}"` for the
        # write — and /admin/participant keys on the account phone, which
        # carries the code. A 10-digit entry still "works" end to end, but it
        # stores a malformed number that will never match the same caller
        # arriving by voice.
        setup_subtitle: "Enter your phone number with the country code to begin a session."
        user_id_placeholder: "e.g. 919876543210"
        user_id_hint: "12 digits — country code first, no + and no spaces."
        start_btn_label: "Start →"
        new_session_msg: "नमस्ते! मैं ब्लू डॉट्स की सहायक हूँ। काम ढूँढने में आपकी मदद कर सकती हूँ।"
        returning_user_msg: "आपका फिर से स्वागत है!"
        storage_key: "blue_dots_user_id"
        theme_storage_key: "blue_dots_theme"
        sign_out_confirm: "Sign out?"
        switch_user_confirm: "Switch user? Your current session will be closed."
        delete_conversation_confirm: "Delete this conversation? This cannot be undone."

    voice:
      # Hindi by default. Hindi callers pause longer mid-sentence than the
      # framework's 0.4 s window allows, so the utterance closes later.
      vad:
        stop_secs: 1.0
      raya:
        stt_language: "hi"
        tts_language: "hi"
        voice_id: "d6a002d0-230c-49b1-a137-b8a7d564b1ae"   # Priyanka, hi (a woman's voice)
      agent_core:
        timeout_ms: 15000
        # Opening line on call pickup is emitted by Agent Core as the
        # entry subagent's opening_phrase. Do not add a static greeting here.
        # Spoken verbatim only when the Agent Core call fails — Hindi,
        # feminine first person.
        fallback_phrase: "माफ़ कीजिए, मैं सुन नहीं पाई। क्या आप फिर से बोल सकते हैं?"
        # GH-152: brief acknowledgement spoken when the caller barges
        # in mid-response. Spoken verbatim — Hindi.
        barge_in_acknowledgement: "एक सेकंड।"
      # GH-242: short hold if the first sentence hasn't reached TTS within
      # filler_threshold_ms. Same neutral hold as the bridge's
      # tool_status_phrases: it must never reveal what is happening.
      filler_threshold_ms: 1500
      filler_phrase: "एक मिनट।"
      # GH-137: spoken just before WebSocket close on bot-initiated hangup.
      # Emitted verbatim — Hindi.
      terminal_word: "धन्यवाद"

    bridge:
      # GH-137-style: spoken/written just before the caller's client closes
      # the call. The shim never ends the call itself, so this word is the
      # only signal the caller gets that the conversation is finished.
      #
      # Hindi, because it is emitted VERBATIM — the bridge appends it to the
      # stream on session end without any translation step. On the 24 Sep
      # PoC calls it was the English "Thank you", spoken to Hindi callers at
      # the end of every terminated turn.
      terminal_word: "धन्यवाद"
      # VoicERA offers this tool when the agent has automatic_call_ending
      # and graceful_llm_call_ending enabled. On session end the bridge calls
      # it after the goodbye, and VoicERA hangs up. Without it the line
      # stayed open until the platform's max-duration timeout.
      hangup_tool_name: "end_conversation"
      # Spoken while a tool runs, so a 5-7 s turn is not silence the caller
      # fills with "hello?" (which the client treats as barge-in and cancels
      # the turn). One line per turn at most, never once the reply has started.
      # Hindi, emitted verbatim. end_session is deliberately unmapped.
      # Blue Dots: "Call them silently... No waiting message and no status
      # narration before, during or immediately after any of them." A hold is
      # permitted, but it is a NEUTRAL hold and "must never reveal what is
      # happening" — so every phrase here is the same two words.
      #
      # What the previous phrases broke:
      #   fetch_profile "मैं देख रही हूँ"  — on the spec's explicit banned list
      #   fetch_jobs    "नौकरियाँ देख रही हूँ" — reveals the lookup
      #   save_profile  "सेव कर रही हूँ"   — status narration
      #   apply_job     "आवेदन भेज रही हूँ" — hard law 4: claims the apply
      #                 BEFORE a result exists. apply_job is not in the
      #                 spec's permitted-hold list at all, so it gets none.
      tool_status_phrases:
        fetch_profile: "एक मिनट।"
        fetch_jobs: "एक मिनट।"
        save_profile: "एक मिनट।"
        # Not a workflow tool: Agent Core emits it while a human handoff is
        # being escalated (identity/handoff spec §5.3).
        request_human: "एक मिनट।"
